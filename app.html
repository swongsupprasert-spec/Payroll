  // แสดงส่วนต่างสด ๆ ให้เห็นว่าขึ้นเท่าไร กี่เปอร์เซ็นต์ ก่อนกดบันทึก
  const nsIn=$('#f_newSal'), nfIn=$('#f_newFrom'), nHint=$('#f_newHint');
  const baseHint=nHint.innerHTML;
  const showDiff=()=>{
    const cur=+$('#f_salary').value||0, nv=+nsIn.value||0;
    if(!nsIn.value.trim() || !(nv>0)){ nHint.innerHTML=baseHint; return; }
    const d=nv-cur;
    const pct=cur>0 ? Math.round(d/cur*1000)/10 : 0;
    const col=d>0?'var(--good,#15803d)':d<0?'var(--bad)':'inherit';
    const sign=d>0?'+':'';
    nHint.innerHTML=`<span style="color:${col};font-weight:700">${sign}${money(d)}`
      + (cur>0?` (${sign}${pct}%)`:'')+'</span>'
      + ` จาก ${money(cur)} → <strong>${money(nv)}</strong>`
      + (nfIn.value?` มีผล ${fmtDate(nfIn.value)}`:' — ยังไม่ได้เลือกวันที่มีผล');
  };
  [nsIn,nfIn,$('#f_salary')].forEach(x=>{ if(x){ x.addEventListener('input',showDiff); x.addEventListener('change',showDiff); } });
  // รูปพนักงาน — เลือก / ลบ
  const phIn=$('#f_photo'), phBox=$('#f_photoBox'), phDel=$('#f_photoDel');
  const drawPhoto=()=>{
    phBox.innerHTML=empAvatar({name:$('#f_name').value, photo:photoData}, 72);
    phDel.style.display = photoData ? '' : 'none';
  };
  $('#f_photoPick').onclick=()=>phIn.click();
  phIn.onchange=()=>{
    const f=phIn.files && phIn.files[0];
    readEmpPhoto(f, (data)=>{ photoData=data; drawPhoto(); toast('เลือกรูปแล้ว — กดบันทึกเพื่อจัดเก็บ'); });
    phIn.value='';
  };
  phDel.onclick=()=>{ photoData=''; drawPhoto(); };
  // กสล. กับ กองทุนสงเคราะห์ลูกจ้าง — เลือกได้อย่างใดอย่างหนึ่ง
  const syncFunds=()=>{
    const pv=$('#f_pvdRate'), wf=$('#f_wfRate'), note=$('#f_fundNote'), btn=$('#f_wfSet');
    if(!pv||!wf) return;
    const hasPvd=(+pv.value||0)>0, hasWf=(+wf.value||0)>0;
    wf.disabled=hasPvd; pv.disabled=hasWf;
    if(btn) btn.disabled=hasPvd;
    wf.style.background=hasPvd?'#f1f5f9':''; pv.style.background=hasWf?'#f1f5f9':'';
    if(hasPvd&&!hasWf) note.innerHTML='ℹ️ คนนี้มี<strong>กองทุนสำรองเลี้ยงชีพ</strong>อยู่แล้ว จึงไม่ต้องเข้ากองทุนสงเคราะห์ลูกจ้าง';
    else if(hasWf&&!hasPvd) note.innerHTML='ℹ️ คนนี้เข้า<strong>กองทุนสงเคราะห์ลูกจ้าง</strong> จึงกรอกอัตรา กสล. ไม่ได้';
    else note.innerHTML='';
    note.style.display=(hasPvd||hasWf)?'block':'none';
  };
  // เตือนทันทีถ้ารหัสซ้ำ (ระหว่างพิมพ์)
  $('#f_code').oninput=(ev)=>{
    const val=ev.target.value.trim().toLowerCase();
    const dup=val && DB.employees.some(x=>x.id!==id && String(x.code||'').trim().toLowerCase()===val);
    ev.target.style.borderColor = dup ? '#dc2626' : '';
    const w=$('#codeWarn'); if(w) w.textContent = dup ? '⚠️ รหัสนี้ถูกใช้แล้ว' : '';
  };
  ['#f_pvdRate','#f_wfRate'].forEach(s=>{ const n=$(s); if(n) n.addEventListener('input', syncFunds); });
  const wfSet=$('#f_wfSet');
  if(wfSet) wfSet.onclick=()=>{ $('#f_wfRate').value=(+DB.wfRateDefault||0.25); syncFunds(); };
  syncFunds();
}
function nextCode(){
  const used=new Set(DB.employees.map(e=>String(e.code||'').trim().toLowerCase()));
  const nums = DB.employees.map(e=>{ const m=String(e.code).match(/(\d+)/); return m?+m[1]:0; });
  let n=Math.max(0,...nums)+1, code;
  do{ code='EMP'+String(n).padStart(3,'0'); n++; } while(used.has(code.toLowerCase()));  // กันชนซ้ำ
  return code;
}

/* ============ 2. PAYROLL (earnings/deductions per employee) ============ */
let payrollEmpId=null, payrollFilter='all';
/* ═══════════ เบิกจ่ายล่วงหน้า ═══════════
   บริษัทที่จ่ายเดือนละ 2 รอบ : รอบกลางเดือนจ่ายล่วงหน้า แล้วหักคืนตอนสิ้นเดือน
   ยอดเบิกเก็บเป็นรายการหัก 'advance' ของงวดนั้น ภาษี/ประกันสังคมจึงยังคิดเป็นรายเดือนถูกต้องเหมือนเดิม */
/* เปอร์เซ็นต์ที่ใช้เติมยอดเบิกกลางเดือนให้ทุกคน — ตั้งได้ต่อบริษัท ไม่ตั้งใช้ 40%
   จำกัด 1–100 เพราะเบิกเกินค่าจ้างของงวดไม่มีเงินเหลือให้หักคืนตอนสิ้นเดือน */
function advPct(){
  const v=+(DB.advPct||0);
  return v>0 ? Math.min(100, v) : 40;
}
function setAdvPct(v){
  const n=Math.round(+v||0);
  if(!(n>0)) return false;
  DB.advPct=Math.min(100, n);
  return true;
}
function advPayDate(){
  const {from,to}=periodRange(PERIOD);
  const mid=new Date(from.getTime()+Math.floor((to-from)/2));
  return isoOf(mid);
}
function advOf(emp){ return Number(readRec(PERIOD, emp.id).ded.advance||0); }
function advSet(emp, val){
  const r=getRec(PERIOD, emp.id);
  r.manual=r.manual||{}; r.manual.advance=1;          // เป็นตัวเลขที่คนกรอก ไม่ให้ระบบเขียนทับ
  r.ded.advance=Math.max(0, Math.round(Number(val||0)*100)/100);
  save();
}

        <td>${daily?'<span class="chip" style="background:#fef3c7;color:#b45309">รายวัน</span>':'<span class="chip" style="background:#d8f3e6;color:#092942">รายเดือน</span>'}</td>

    const box=panel.querySelector('#advTbl');

  panel.querySelector('#advFill').onclick=()=>{
    rows.forEach(x=>advSet(x.e, x.suggest));

  // พนักงานรายเดือนที่เข้างานกลางเดือน: คิดเงินเดือนตามสัดส่วน
  const pr = prorate(emp, PERIOD);
  const prorateBlock = (!isDaily && pr.partial) ? `<div class="field" style="grid-column:1/-1;background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:12px 14px;margin-bottom:14px">
    <label style="font-weight:700;color:#b45309">📅 เข้างานกลางเดือน — คิดเงินเดือนตามสัดส่วน (Prorate)</label>
    ${pr.factor>0
      ? `<div style="margin-top:6px;line-height:1.7">เริ่มงาน ${fmtDate(emp.startDate)} · งวด ${fmtD(pr.from)} – ${fmtD(pr.to)}<br>ทำงาน <strong>${pr.worked}</strong> วัน จาก ${pr.dim} วันในงวดนี้<br>
         เงินเดือน ${money(emp.salary)} × ${pr.worked}/${pr.dim} = <strong style="color:var(--brand-d);font-size:16px">${money(basePay(emp,r,PERIOD))}</strong> บาท</div>`
      : `<div style="margin-top:6px">พนักงานเริ่มงาน ${fmtDate(emp.startDate)} ซึ่งยังไม่ถึงงวดนี้ จึงยังไม่มีเงินเดือนในงวด ${periodLabel(PERIOD)}</div>`}
  </div>` : '';

  const earnRows=EARN_FIELDS.filter(([k])=>k!=='ot').map(([k,l])=>`<div class="field"><label>${l}</label><input type="number" step="0.01" data-earn="${k}" value="${r.earn[k]||0}"></div>`).join('');
  const rate=otRate(emp);
  const otRateLabel = isDaily ? `${money(emp.salary)}÷${DB.otHours||8}` : `${money(emp.salary)}÷${DB.otDays||30}÷${DB.otHours||8}`;
  const otBlock=`<div class="field" style="grid-column:1/-1;background:#f6faf8;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px">
    <label style="font-weight:700;color:var(--brand-d)">ค่าล่วงเวลา (OT) — คำนวณรายชั่วโมง</label>
    <div class="muted" style="font-size:12px;margin-top:2px">อัตรา/ชม. ${otRateLabel} = ${money(rate)} บาท · เพิ่มได้หลายแถวถ้าเดือนนี้มี OT หลายแบบ</div>
    <div id="otRows" style="margin-top:8px"></div>
    <button type="button" id="otAdd" class="btn ghost" style="padding:7px 14px;font-size:13.5px">+ เพิ่มแถว OT</button>
    <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="muted">รวมค่าล่วงเวลา (OT):</span>
      <input type="number" step="0.01" data-earn="ot" id="otAmt" value="${r.earn.ot||0}" style="width:150px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-weight:700"> <span class="muted">บาท</span>
      <span class="muted" style="font-size:12px">(แก้ตัวเลขนี้เองได้)</span>
    </div>
  </div>`;
  const AUTO_DED={sso:1,pvd:1,tax:1,absent:1};   // ช่องคำนวณอัตโนมัติ (แก้ทับเองได้)
  const uDays=unpaidDays(emp, PERIOD);
  const dedRows=DED_FIELDS.map(([k,l])=>{
    const auto=AUTO_DED[k], man=r.manual&&r.manual[k];
    const tag = !auto ? ''
      : man ? ` <span style="color:#d97706;font-size:11px">(แก้เอง)</span> <a href="#" data-reauto="${k}" style="font-size:11px;color:var(--brand)">↻ คืนค่าอัตโนมัติ</a>`
            : ' <span style="color:#059669;font-size:11px">(อัตโนมัติ)</span>';
    const bg = auto ? (man?'background:#fffbeb':'background:#f0fdf4') : '';
    // บอกที่มาของยอดหักขาดงาน ให้ตรวจย้อนไปที่ใบลาได้
    let note='';
    if(k==='absent'){
      note = isDaily
        ? '<div class="muted" style="font-size:11px;margin-top:3px">พนักงานรายวันไม่ถูกหัก — ได้ค่าจ้างตามวันที่มาทำงานอยู่แล้ว</div>'
        : uDays>0
          ? `<div class="muted" style="font-size:11px;margin-top:3px">จากใบลาไม่รับค่าจ้าง <strong>${num(uDays)}</strong> วันในงวดนี้ · ${money(emp.salary||0)} ÷ 30 × ${num(uDays)}</div>`
          : '<div class="muted" style="font-size:11px;margin-top:3px">งวดนี้ไม่มีใบลาไม่รับค่าจ้าง</div>';
    }
    return `<div class="field"><label>${l}${tag}</label>
      <input type="number" step="0.01" data-ded="${k}" id="ded_${k}" value="${r.ded[k]||0}" style="${bg}">${note}</div>`;
  }).join('');

  const panel=el(`<div class="panel">
    <div class="phead"><h2>${esc(emp.name)} <span class="muted">— ${periodLabel(PERIOD)}</span></h2>
      <div class="sp"><span class="chip">${isDaily?`รายวัน ${money(emp.salary)}/วัน`:`เงินเดือน ${money(emp.salary)}`}</span></div></div>
    <div class="pbody">
      <div class="grid2">
        <div>
          <div class="sec-title">2.1 เงินได้</div>
          ${dayBlock}
          ${prorateBlock}
          ${otBlock}
          <div class="grid2">${earnRows}</div>
        </div>
        <div>
          <div class="sec-title">2.2 เงินหัก</div>
          <div class="grid2">${dedRows}</div>
        </div>
      </div>
    </div>
  </div>`);
  v.appendChild(panel);

  const totBox=el(`<div class="cards" id="peTot"></div>`);
  v.appendChild(totBox);
  drawPeTot(emp);

  // เงินได้เปลี่ยน → คำนวณ ปกส./กสล./ภาษี ใหม่ แล้วอัปเดตช่องอัตโนมัติ
  const refreshAutoDed=()=>{ autoDeductions(emp,r);
    ['sso','pvd','tax'].forEach(k=>{ const el2=panel.querySelector('#ded_'+k); if(el2) el2.value=r.ded[k]; }); };

  panel.querySelectorAll('input[data-earn]').forEach(i=>i.oninput=()=>{ r.earn[i.dataset.earn]=+i.value||0; refreshAutoDed(); save(); drawPeTot(emp); });
  panel.querySelectorAll('input[data-ded]').forEach(i=>i.oninput=()=>{
    const k=i.dataset.ded, val=+i.value||0;
    if(AUTO_DED[k]) setManualDed(r,k,val); else r.ded[k]=val;   // แก้ช่องอัตโนมัติ = ยึดค่าที่พิมพ์
    save(); drawPeTot(emp);
  });
  // ปุ่มคืนค่าอัตโนมัติ
  panel.querySelectorAll('[data-reauto]').forEach(a=>a.onclick=(ev)=>{
    ev.preventDefault(); clearManualDed(emp,r,a.dataset.reauto); render(); toast('คืนค่าอัตโนมัติแล้ว');
  });
  // OT auto-calc: รวมทุกแถว (อัตรา/ชม. × ชั่วโมง × ตัวคูณ)
  const otA=panel.querySelector('#otAmt'), otBox=panel.querySelector('#otRows');
  const recalcOT=()=>{
    const rows=otRowsOf(r);
    otBox.querySelectorAll('.otrow').forEach(function(el,i){
      if(!rows[i]) rows[i]={h:0,m:1.5};
      rows[i].h=+el.querySelector('.otH').value||0;
      rows[i].m=+el.querySelector('.otM').value||0;
      el.querySelector('.otSub').textContent=money(otAmount(emp,rows[i].h,rows[i].m))+' บาท';
    });
    const amt=otTotal(emp,r);
    r.earn.ot=amt; otA.value=amt; refreshAutoDed(); save(); drawPeTot(emp);
  };
  const drawOTRows=()=>{
    const rows=otRowsOf(r);
    otBox.innerHTML=rows.map(function(row,i){
      return '<div class="otrow" style="display:grid;grid-template-columns:1fr 1.6fr auto auto;gap:10px;align-items:end;margin-bottom:8px">'
        +'<div class="field"><label>จำนวนชั่วโมง</label><input type="number" step="0.5" class="otH" value="'+(row.h||0)+'"></div>'
        +'<div class="field"><label>ตัวคูณ (เท่า)</label><select class="otM">'
        + OT_MULTS.map(function(o){ return '<option value="'+o[0]+'"'+((+(row.m||1.5)===+o[0])?' selected':'')+'>'+o[1]+'</option>'; }).join('')
        +'</select></div>'
        +'<div class="field"><label>เป็นเงิน</label><div class="otSub" style="padding:9px 4px;font-weight:700;color:var(--brand-d);white-space:nowrap">0 บาท</div></div>'
        +'<button type="button" class="otDel" title="ลบแถวนี้" style="border:1px solid var(--line);background:#fff;color:#dc2626;border-radius:8px;width:36px;height:38px;cursor:pointer;font-size:15px">✕</button>'
        +'</div>';
    }).join('');
    otBox.querySelectorAll('.otH').forEach(function(x){ x.oninput=recalcOT; });
    otBox.querySelectorAll('.otM').forEach(function(x){ x.onchange=recalcOT; });
    otBox.querySelectorAll('.otDel').forEach(function(b,i){
      b.onclick=function(){
        const rows=otRowsOf(r);
        if(rows.length<=1) rows[0]={h:0,m:1.5}; else rows.splice(i,1);
        drawOTRows(); recalcOT();
      };
    });
    recalcOT();
  };
  drawOTRows();
  panel.querySelector('#otAdd').onclick=()=>{ otRowsOf(r).push({h:0,m:1.5}); drawOTRows(); };
  // พนักงานรายวัน: เปลี่ยนจำนวนวัน → อัปเดตค่าจ้างฐาน
  const wd=panel.querySelector('#workDays');
  if(wd) wd.oninput=()=>{ r.days=+wd.value||0; panel.querySelector('#baseShow').value=money(basePay(emp,r));
    refreshAutoDed();   // วันเปลี่ยน → คำนวณ ปกส./กสล./ภาษี ใหม่
    save(); drawPeTot(emp); };
}
/* ---------- มุมมอง "ทั้งหมด" : ตารางกรอกเงินได้/เงินหักทุกคน ---------- */
const MANUAL_DED=['loan','studentloan','other'];        // ช่องหักที่กรอกเอง
/* ---------- ล้างข้อมูลเงินเดือนทั้งงวด (เช่น เผลอทำเงินเดือนเดือนที่ยังไม่ถึง) ---------- */
function clearPeriodModal(p){
  const pp=DB.payroll[p]||{};
  const ids=Object.keys(pp);
  if(!ids.length){ toast('งวด '+periodLabel(p)+' ยังไม่มีข้อมูลให้ล้าง'); return; }
  /* สรุปให้เห็นก่อนว่ากำลังจะลบอะไร */
  let gross=0, net=0, named=[];
  ids.forEach(id=>{
    const e=DB.employees.find(x=>x.id===id); if(!e) return;
    const cc=calc(e,p); gross+=cc.gross; net+=cc.net;
    named.push(esc(e.code)+' — '+esc(e.name));
  });
  const [py,pm]=p.split('-').map(Number);
  const future = py>lastRealYear() || (py===lastRealYear() && pm>lastRealMonth(py));
  const body=`
    ${future?'<div style="background:#fef3c7;color:#92400e;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px">⚠️ งวดนี้เป็นเดือนที่ยังมาไม่ถึง</div>':''}
    <p>กำลังจะลบข้อมูลเงินเดือนของงวด <strong>${periodLabel(p)}</strong> ทั้งหมด</p>
    <div class="tbl-wrap" style="max-height:190px;overflow:auto;margin:10px 0">
      <table style="font-size:13px"><tbody>
        ${named.map(n=>'<tr><td>'+n+'</td></tr>').join('')}
      </tbody></table></div>
    <div style="display:flex;justify-content:space-between;font-size:13px"><span>พนักงาน</span><strong>${num(ids.length)} คน</strong></div>
    <div style="display:flex;justify-content:space-between;font-size:13px"><span>เงินได้รวม</span><strong>${money(gross)}</strong></div>
    <div style="display:flex;justify-content:space-between;font-size:13px"><span>เงินสุทธิรวม</span><strong>${money(net)}</strong></div>
    <p class="muted" style="font-size:12px;margin-top:12px">ข้อมูลพนักงาน การลา และเวลาเข้างาน <strong>จะไม่ถูกลบ</strong> — ลบเฉพาะตัวเลขเงินเดือนของงวดนี้เท่านั้น</p>`;
  openModal('ล้างข้อมูลงวด '+periodLabel(p), body, [
    ['ยกเลิก','ghost',closeModal],
    ['ลบข้อมูลงวดนี้','danger',()=>{
      delete DB.payroll[p];
      save(); closeModal(); render();
      toast('ล้างข้อมูลงวด '+periodLabel(p)+' แล้ว ('+num(ids.length)+' คน)');
    }]
  ]);
}
function vPayrollAll(v, list){
  const panel=el(`<div class="panel">
    <div class="phead"><h2>เงินได้ / เงินหัก ทุกคน — ${periodLabel(PERIOD)}</h2>
      <div class="sp"><span class="muted" style="font-size:12px">💡 แก้ตัวเลขในตารางได้เลย · ช่องสีเขียวคำนวณอัตโนมัติ</span></div></div>
    <div class="pbody" style="padding:0"><div class="tbl-wrap" id="allTbl"></div></div></div>`);
  v.appendChild(panel);

  const inp=(v2,attrs)=>`<input type="number" step="0.01" value="${v2||0}" ${attrs} style="width:92px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;text-align:right">`;

  const rows=list.map(e=>{
    const r=getRec(PERIOD,e.id); autoDeductions(e,r); const c=calc(e,PERIOD);
    return `<tr data-row="${e.id}">
      <td><span class="chip">${esc(e.code)}</span></td>
      <td><strong>${esc(e.name)}</strong>${e.payType==='daily'?' <span class="chip" style="background:#fef3c7;color:#b45309">รายวัน</span>':''}</td>
      ${e.payType==='daily'?`<td class="num">${inp(r.days,`data-days="${e.id}"`)}</td>`:'<td class="num muted">-</td>'}
      <td class="num" data-base="${e.id}">${money(c.base)}</td>
      ${EARN_FIELDS.map(f=>`<td class="num">${inp(r.earn[f[0]],`data-e="${f[0]}" data-id="${e.id}"`)}</td>`).join('')}
      <td class="num pos" data-gross="${e.id}"><strong>${money(c.gross)}</strong></td>
      ${['tax','sso','pvd'].map(k=>`<td class="num">${inp(r.ded[k],`data-a="${k}" data-id="${e.id}"`)}</td>`).join('')}
      ${MANUAL_DED.map(k=>`<td class="num">${inp(r.ded[k],`data-d="${k}" data-id="${e.id}"`)}</td>`).join('')}
      <td class="num neg" data-ded="${e.id}">${money(c.dedTotal)}</td>
      <td class="num" data-net="${e.id}"><strong>${money(c.net)}</strong></td>
    </tr>`;
  }).join('');

  const dedLabel=k=>DED_FIELDS.find(f=>f[0]===k)[1];
  const tbl=el(`<table style="font-size:13px">
    <thead><tr>
      <th>รหัส</th><th>ชื่อ</th><th class="num">วันทำงาน</th><th class="num">ค่าจ้างฐาน</th>
      ${EARN_FIELDS.map(f=>`<th class="num">${FL(f)}</th>`).join('')}
      <th class="num">รายได้รวม</th>
      <th class="num">ภาษี</th><th class="num">ปกส.</th><th class="num">กสล.</th>
      ${MANUAL_DED.map(k=>`<th class="num">${dedLabel(k)}</th>`).join('')}
      <th class="num">หักรวม</th><th class="num">สุทธิ</th>
    </tr></thead><tbody>${rows}</tbody></table>`);
  const box=$('#allTbl'); box.innerHTML=''; box.appendChild(tbl);

  // อัปเดตแถวเดียวเมื่อแก้ตัวเลข
  const refreshRow=(id)=>{
    const e=DB.employees.find(x=>x.id===id), r=getRec(PERIOD,e.id);
    autoDeductions(e,r); const c=calc(e,PERIOD);
    const q=s=>tbl.querySelector(s);
    q(`[data-base="${id}"]`).textContent=money(c.base);
    q(`[data-gross="${id}"]`).innerHTML=`<strong>${money(c.gross)}</strong>`;
    q(`[data-ded="${id}"]`).textContent=money(c.dedTotal);
    q(`[data-net="${id}"]`).innerHTML=`<strong>${money(c.net)}</strong>`;
    // อัปเดตช่องอัตโนมัติที่ยังไม่ได้แก้เอง (ไม่ทับค่าที่ผู้ใช้พิมพ์)
    ['tax','sso','pvd','absent'].forEach(k=>{ if(r.manual&&r.manual[k]) return;
      const f=q(`input[data-a="${k}"][data-id="${id}"]`);
      if(f && document.activeElement!==f) f.value=r.ded[k];
    });
    save(); drawAllTot(list);
  };
  tbl.querySelectorAll('input[data-e]').forEach(i=>i.oninput=()=>{ const id=i.dataset.id;
    getRec(PERIOD,id).earn[i.dataset.e]=+i.value||0; refreshRow(id); });
  tbl.querySelectorAll('input[data-d]').forEach(i=>i.oninput=()=>{ const id=i.dataset.id;
    getRec(PERIOD,id).ded[i.dataset.d]=+i.value||0; refreshRow(id); });
  // แก้ทับช่องอัตโนมัติในตาราง
  tbl.querySelectorAll('input[data-a]').forEach(i=>{
    const id=i.dataset.id, k=i.dataset.a, r0=getRec(PERIOD,id), man=r0.manual&&r0.manual[k];
    i.style.background = man?'#fffbeb':'#f0fdf4';
    i.title = man?'แก้เอง — ดับเบิลคลิกเพื่อคืนค่าอัตโนมัติ':'คำนวณอัตโนมัติ (พิมพ์ทับได้)';
    i.oninput=()=>{ setManualDed(getRec(PERIOD,id),k,+i.value||0); i.style.background='#fffbeb'; refreshRow(id); };
    i.ondblclick=()=>{ const e2=DB.employees.find(x=>x.id===id);
      clearManualDed(e2,getRec(PERIOD,id),k); i.style.background='#f0fdf4'; i.value=getRec(PERIOD,id).ded[k]; refreshRow(id); toast('คืนค่าอัตโนมัติแล้ว'); };
  });
  tbl.querySelectorAll('input[data-days]').forEach(i=>i.oninput=()=>{ const id=i.dataset.days;
    getRec(PERIOD,id).days=+i.value||0; refreshRow(id); });

  v.appendChild(el(`<div class="cards" id="allTot"></div>`));
  drawAllTot(list);
}
function drawAllTot(list){
  let g=0,d=0,n=0;
  list.forEach(e=>{ const c=calc(e,PERIOD); g+=c.gross; d+=c.dedTotal; n+=c.net; });
  const box=$('#allTot'); if(!box) return;
  box.innerHTML=`<div class="kpi b3"><div class="lab">รายได้รวม (${list.length} คน)</div><div class="val money">${money(g)}</div></div>
    <div class="kpi b4"><div class="lab">หักรวม</div><div class="val money">${money(d)}</div></div>
    <div class="kpi b5"><div class="lab">เงินสุทธิรวม</div><div class="val money">${money(n)}</div></div>`;
}
/* ---------- ส่งออก CSV หน้าเงินได้/เงินหัก ---------- */
function exportPayrollCSV(list){
  const head=['รหัส','ชื่อ-นามสกุล','ประเภท','วันทำงาน','ค่าจ้างฐาน',
    ...EARN_FIELDS.map(f=>f[1]),'รายได้รวม',...DED_FIELDS.map(f=>f[1]),'หักรวม','เงินสุทธิ'];
  const lines=[head.map(csvEsc).join(',')];
  let tg=0,td=0,tn=0;
  list.forEach(e=>{ const r=getRec(PERIOD,e.id); autoDeductions(e,r); const c=calc(e,PERIOD);
    tg+=c.gross; td+=c.dedTotal; tn+=c.net;
    lines.push([e.code, e.name, e.payType==='daily'?'รายวัน':'รายเดือน',
      e.payType==='daily'?(r.days||0):'', c.base,
      ...EARN_FIELDS.map(f=>r.earn[f[0]]||0), c.gross,
      ...DED_FIELDS.map(f=>r.ded[f[0]]||0), c.dedTotal, c.net].map(csvEsc).join(','));
  });
  lines.push(['รวม','','','','',...EARN_FIELDS.map(()=>''),tg,...DED_FIELDS.map(()=>''),td,tn].map(csvEsc).join(','));
  const tag = payrollFilter==='daily'?'_รายวัน' : payrollFilter==='monthly'?'_รายเดือน' : '';
  downloadFile(`payroll${tag}_${PERIOD}.csv`, '﻿'+lines.join('\r\n'),'text/csv;charset=utf-8');
  toast(`ส่งออก CSV แล้ว (${list.length} คน)`);
}
/* ---------- นำเข้า CSV หน้าคำนวณเงินได้ ----------
   ใช้ไฟล์ที่ "ส่งออก CSV" ออกมาได้เลย — จับคู่คนด้วยรหัสพนักงาน และจับช่องด้วยชื่อหัวคอลัมน์
   ช่องที่คำนวณเอง (ค่าจ้างฐาน/รายได้รวม/หักรวม/เงินสุทธิ) ข้ามไป ไม่เขียนทับ                */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  text=text.replace(/^\ufeff/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===','){ row.push(cur); cur=''; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(ch!=='\r') cur+=ch;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function importPayrollCSV(text, list){
  const rows=parseCSV(text);
  if(rows.length<2){ toast('ไฟล์ว่างหรืออ่านไม่ได้'); return; }
  const head=rows[0].map(h=>String(h).trim());
  const iCode=head.findIndex(h=>/^(รหัส|code)$/i.test(h));
  if(iCode<0){ toast('ไม่พบคอลัมน์ "รหัส" ในไฟล์'); return; }
  const iDays=head.findIndex(h=>/^(วันทำงาน|days)$/i.test(h));
  /* จับคอลัมน์เงินได้/เงินหักจากชื่อป้าย (ทั้งไทยและอังกฤษ) */
  const mapEarn={}, mapDed={};
  EARN_FIELDS.forEach(f=>{ const i=head.findIndex(h=>h===f[1]||h===f[2]); if(i>=0) mapEarn[f[0]]=i; });
  DED_FIELDS.forEach(f=>{ const i=head.findIndex(h=>h===f[1]||h===f[2]); if(i>=0) mapDed[f[0]]=i; });
  if(!Object.keys(mapEarn).length && !Object.keys(mapDed).length){ toast('ไม่พบคอลัมน์เงินได้หรือเงินหักที่รู้จัก'); return; }

  const byCode={}; DB.employees.forEach(e=>byCode[String(e.code).trim().toLowerCase()]=e);
  const inList=new Set(list.map(e=>e.id));
  const numOf=v=>{ const n=Number(String(v??'').replace(/[, ]/g,'')); return isFinite(n)?n:0; };
  let ok=0, skipped=0, notFound=[];

  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    const code=String(r[iCode]??'').trim();
    if(!code || /^(รวม|total)$/i.test(code)) continue;        // แถวรวมท้ายตาราง
    const e=byCode[code.toLowerCase()];
    if(!e){ notFound.push(code); continue; }
    if(!inList.has(e.id)){ skipped++; continue; }             // ไม่อยู่ในงวด/ตัวกรองนี้
    const rec=getRec(PERIOD, e.id);
    rec.manual=rec.manual||{};
    if(iDays>=0 && e.payType==='daily' && String(r[iDays]??'').trim()!=='') rec.days=numOf(r[iDays]);
    Object.entries(mapEarn).forEach(([k,idx])=>{ if(String(r[idx]??'').trim()!=='') rec.earn[k]=numOf(r[idx]); });
    Object.entries(mapDed).forEach(([k,idx])=>{
      if(String(r[idx]??'').trim()==='') return;
      const v=numOf(r[idx]);
      rec.ded[k]=v;
      /* ช่องที่ระบบคิดเอง (ภาษี/ปกส./กสล./กองทุนสงเคราะห์) — ทำเครื่องหมายว่าคนกรอกเอง
         เฉพาะเมื่อค่าต่างจากที่ระบบคำนวณ ไม่งั้นปล่อยให้ระบบคิดต่อเหมือนเดิม */
      if(['tax','sso','pvd','wf'].includes(k)){
        const auto=JSON.parse(JSON.stringify(rec));
        autoDeductions(e, auto);
        if(Math.abs(Number(auto.ded[k]||0)-v)>0.005) rec.manual[k]=1; else delete rec.manual[k];
        rec.ded[k]=v;
      } else rec.manual[k]=1;
    });
    autoDeductions(e, rec);
    ok++;
  }
  save(); render();
  let msg=`นำเข้าแล้ว ${ok} คน`;
  if(skipped) msg+=` · ข้าม ${skipped} คน (ไม่อยู่ในงวดนี้)`;
  if(notFound.length) msg+=` · ไม่พบรหัส ${notFound.slice(0,3).join(', ')}${notFound.length>3?'…':''}`;
  toast(msg);
}

  if(!whtEmpId||(whtEmpId!=='ALL'&&!DB.employees.find(e=>e.id===whtEmpId))) whtEmpId=DB.employees[0].id;
  if(!whtYear) whtYear=+PERIOD.split('-')[0];

function yearAgg(e, year){
  let income=0, tax=0, sso=0, pvd=0;
  for(let m=1;m<=12;m++){ const p=`${year}-${String(m).padStart(2,'0')}`; if(!DB.payroll[p]||!DB.payroll[p][e.id]) continue;
    const c=calc(e,p); income+=c.gross; tax+=+c.r.ded.tax||0; sso+=+c.r.ded.sso||0; pvd+=+c.r.ded.pvd||0; }
  return {income,tax,sso,pvd};
}

function pndPayDate(p){   // วันที่จ่ายของงวด (แก้เองได้ ค่าเริ่มต้น=สิ้นเดือน)
  if(DB.payDates && DB.payDates[p]) return DB.payDates[p];
  const [y,m]=p.split('-').map(Number);
  return `${y}-${String(m).padStart(2,'0')}-${String(daysInMonth(y,m)).padStart(2,'0')}`;
}

/* ============================================================
   ⏰ เวลาเข้างาน — บันทึกเวลาเข้า/ออก นำเข้าจาก CSV
   ผูกกับข้อมูลพนักงาน และส่งวันทำงาน/ชั่วโมง OT เข้าหน้าเงินได้-เงินหัก
   ============================================================ */
function ensureAttend(p){ if(!DB.attend) DB.attend={}; if(!DB.attend[p]) DB.attend[p]={}; return DB.attend[p]; }
function attendOf(p, empId){ const a=DB.attend&&DB.attend[p]; return (a&&a[empId])||{}; }
function hm2min(s){ const m=/^(\d{1,2}):(\d{2})/.exec(String(s||'').trim()); if(!m) return null;
  const h=+m[1], mi=+m[2]; if(h>23||mi>59) return null; return h*60+mi; }
function pad2(n){ return String(n).padStart(2,'0'); }
/* ---------- ช่องกรอกเวลาแบบ 24 ชม. ----------
   input[type=time] ของเบราว์เซอร์แสดง AM/PM ตาม locale ของเครื่อง บังคับไม่ได้
   จึงใช้ช่องข้อความที่ควบคุมเอง — เก็บค่าเป็น "HH:MM" 24 ชม. เหมือนเดิมทุกประการ */
function t24Norm(s){
  s=String(s??'').trim();
  if(!s) return '';
  let d=s.replace(/\D/g,'');
  if(!d) return null;
  if(d.length<=2){ const h=+d; return h>23 ? null : pad2(h)+':00'; }   // "8" → 08:00 · "17" → 17:00
  if(d.length===3) d='0'+d;                                            // "830" → 0830
  d=d.slice(0,4);
  const h=+d.slice(0,2), m=+d.slice(2,4);
  return (h>23||m>59) ? null : pad2(h)+':'+pad2(m);
}
function t24(attrs, val, style){
  return `<input type="text" class="t24" inputmode="numeric" autocomplete="off" maxlength="5"
    placeholder="--:--" ${attrs||''} value="${esc(val||'')}" style="${style||''}">`;
}
function wireT24(root){
  (root||document).querySelectorAll('input.t24').forEach(inp=>{
    if(inp._t24) return; inp._t24=1;
    inp.addEventListener('focus', ()=>setTimeout(()=>inp.select(),0));
    inp.addEventListener('input', ()=>{
      const d=inp.value.replace(/\D/g,'').slice(0,4);
      inp.value = d.length>2 ? d.slice(0,2)+':'+d.slice(2) : d;
      inp.classList.remove('bad');
    });
    inp.addEventListener('blur', ()=>{
      const n=t24Norm(inp.value);
      if(n===null){ inp.classList.add('bad'); toast('เวลาไม่ถูกต้อง — กรอกแบบ 24 ชม. เช่น 08:30 หรือ 17:45'); }
      else { inp.value=n; inp.classList.remove('bad'); }
    });
  });
}
function min2hm(v){ if(v==null) return ''; return pad2(Math.floor(v/60))+':'+pad2(v%60); }
function isoOf(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
// วันที่ทุกวันในงวด (อิงวันตัดรอบ)
function periodDates(p){
  const {from,to}=periodRange(p); const out=[]; const d=new Date(from);
  while(d<=to){ out.push(isoOf(d)); d.setDate(d.getDate()+1); }
  return out;
}
function inPeriod(iso, p){
  if(!iso) return false;
  const {from,to}=periodRange(p);
  const [y,m,dd]=iso.split('-').map(Number); const D=new Date(y,m-1,dd);
  return D>=from && D<=to;
}
const WD_TH=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const WD_S=['อา','จ','อ','พ','พฤ','ศ','ส'];
function weekdayOf(iso){ return new Date(iso+'T00:00:00').getDay(); }
// วันนี้เปิดให้คิด OT ไหม — กำหนดเฉพาะวัน (ถ้ามี) ทับค่ารายสัปดาห์
function otAllowed(iso){
  if(DB.otDates && Object.prototype.hasOwnProperty.call(DB.otDates, iso)) return !!DB.otDates[iso];
  const arr=DB.otWeekdays;
  return Array.isArray(arr) ? !!arr[weekdayOf(iso)] : true;   // ยังไม่ตั้งค่า = เปิดทุกวัน
}
function otOverridden(iso){ return !!(DB.otDates && Object.prototype.hasOwnProperty.call(DB.otDates, iso)); }
/* ตัวคูณ OT ของแต่ละวัน — ตั้งตามวันในสัปดาห์ได้ และกำหนดเฉพาะวันทับได้
   ไม่ตั้งค่า = 1.5 เท่า (ล่วงเวลาวันทำงานปกติ) */
const OT_MULT_STEPS=[1,1.5,2,2.5,3];
function otMultWeekday(i){
  const a=DB.otMultWeekdays;
  const v=Array.isArray(a)?+a[i]:0;
  return v>0?v:1.5;
}
function otMultFor(iso){
  if(DB.otMultDates && DB.otMultDates[iso]!=null){ const v=+DB.otMultDates[iso]; if(v>0) return v; }
  return otMultWeekday(weekdayOf(iso));
}
function otMultOverridden(iso){ return !!(DB.otMultDates && DB.otMultDates[iso]!=null); }
// พนักงานคนนี้เปิดให้คิด OT ไหม (ไม่ตั้งค่า = เปิด)
function otPerson(emp){ return !(emp && emp.noOT); }
// แปลงนาทีที่อยู่เกินเป็นชั่วโมง OT — ปัดลงทีละครึ่งชั่วโมง ไม่ปัดขึ้น
// 45 นาที → 0.5 · 29 นาที → 0 · 59 นาที → 0.5 · 90 นาที → 1.5
function otHalfHours(mins){ return Math.max(0, Math.floor((+mins||0)/30)/2); }
// เพดาน OT ต่อวันของคนนี้ — ตั้งรายคนได้ ถ้าไม่ตั้งใช้ค่าส่วนกลาง (0 = ไม่จำกัด)
function otCapFor(emp){
  const own=+((emp&&emp.otMaxDay)||0);
  return own>0 ? own : (+DB.otMaxDay||0);
}
// เปิด OT จริงเมื่อ "คนเปิด" และ "วันเปิด" พร้อมกัน
function otAllowedFor(emp, iso){ return otPerson(emp) && otAllowed(iso); }


/* ============================================================
   🕐 ระบบกะการทำงาน (Shift)
   - แต่ละคนมีกะประจำของตัวเอง
   - สลับกะรายวันได้ (ตารางกะ)
   - รองรับกะข้ามคืน เช่น 22:00–06:00
   ============================================================ */
const SHIFT_COLORS=['#0891b2','#f59e0b','#6366f1','#10b981','#ec4899','#8b5cf6','#ef4444','#64748b'];

// สร้างกะเริ่มต้นจากเวลามาตรฐานเดิม (ผู้ใช้เก่าไม่มีอะไรเปลี่ยน)
function ensureShifts(){
  if(!Array.isArray(DB.shifts) || !DB.shifts.length){
    DB.shifts=[{ id:'sh_def', name:'กะปกติ', start:DB.workStart||'08:00',
                 end:DB.workEnd||'17:00', grace:+DB.lateGrace||0, color:SHIFT_COLORS[0] }];
  }
  if(!DB.shiftPlan || typeof DB.shiftPlan!=='object') DB.shiftPlan={};
  return DB.shifts;
}
function shiftById(id){ const l=ensureShifts(); return l.find(s=>s.id===id)||null; }
// กะของพนักงานคนนี้ในวันนี้ — ตารางกะรายวัน (ถ้ามี) ทับกะประจำตัว
function shiftFor(emp, iso){
  const l=ensureShifts();
  const plan=DB.shiftPlan[iso];
  const id=(plan && plan[emp.id]) || emp.shiftId;
  return l.find(s=>s.id===id) || l[0];
}
function shiftPlanned(emp, iso){ const p=DB.shiftPlan&&DB.shiftPlan[iso]; return !!(p && p[emp.id]); }
function shiftShort(sh){ return sh.short || String(sh.name||'').replace(/^กะ/,'').slice(0,3) || '?'; }

// ช่วงเวลาของกะ (นาทีจากเที่ยงคืน) — กะข้ามคืนจะได้ E > 1440
function shiftSpan(sh){
  const S=hm2min(sh.start)??480;
  const E0=hm2min(sh.end)??1020;
  const over=E0<=S;                       // เลิกงานเวลาน้อยกว่าหรือเท่าเข้างาน = ข้ามคืน
  return { S, E0, E:over?E0+1440:E0, over, grace:+sh.grace||0 };
}
// ปรับเวลาปั๊มเข้า-ออกให้อยู่บนแกนเดียวกับกะ (รองรับข้ามเที่ยงคืน)
function punchMinutes(sh, i, o){
  const sp=shiftSpan(sh);
  let IM=hm2min(i), OM=hm2min(o);
  // กะข้ามคืน: ปั๊มเข้าหลังเที่ยงคืน (เช่นกะ 22:00 แต่มาถึง 00:30) → บวกอีกวัน
  if(IM!=null && sp.over && IM < sp.E0) IM+=1440;
  if(OM!=null){
    if(IM!=null){ let g=0; while(OM<IM && g++<2) OM+=1440; }   // ออกงานต้องหลังเข้างานเสมอ
    else if(sp.over && OM < sp.E0) OM+=1440;
  }
  return { IM, OM, ...sp };
}
function shiftHours(sh){ const sp=shiftSpan(sh); return Math.round((sp.E-sp.S)/6)/10; }

// สรุปสถิติเวลาเข้างานของพนักงาน 1 คนในงวด
/* ข้อความแยก OT ตามตัวคูณ ใช้ใต้ยอดรวมในตาราง */
function otByLabel(by){
  const ks=Object.keys(by||{}).filter(k=>+by[k]>0).sort((a,b)=>a-b);
  if(!ks.length) return '';
  return '<br><span class="muted" style="font-size:11.5px;line-height:1.5">'
    + ks.map(function(k){ return k+'× '+num(Math.round(by[k]*100)/100); }).join('<br>')
    + '</span>';
}
function attendStats(emp, p){
  const rec=attendOf(p, emp.id);
  ensureShifts();
  let days=0, late=0, lateMin=0, otH=0, skipH=0, skipDays=0, capH=0, capDays=0, early=0, noOut=0;
  const otBy={};                                   // แยกชั่วโมงตามตัวคูณ เช่น {1.5:8, 3:4}
  Object.keys(rec).forEach(d=>{
    if(!inPeriod(d,p)) return;
    // ใช้กะของคนนี้ในวันนี้ (รองรับสลับกะ + กะข้ามคืน)
    const sh=shiftFor(emp, d);
    const {IM:im, OM:om, S:ws, E:we, grace}=punchMinutes(sh, rec[d].i, rec[d].o);
    if(im==null && om==null) return;
    days++;
    if(im!=null && im>ws+grace){ late++; lateMin+=im-(ws+grace); }
    if(om==null){ noOut++; return; }
    if(om>we){
      // ปัดลงทีละครึ่งชั่วโมง "รายวัน" แล้วค่อยรวม
      // (ถ้ารวมนาทีทั้งเดือนก่อนปัด เศษของวันที่ทำไม่ถึง 30 นาทีจะถูกสะสมกลายเป็น OT)
      const raw=otHalfHours(om-we);
      if(raw>0){
        if(otAllowedFor(emp, d)){
          const cap=otCapFor(emp);
          const h=(cap>0 && raw>cap) ? cap : raw;   // เกินเพดานต่อวัน → ตัดเหลือเท่าเพดาน
          otH+=h;
          const mul=otMultFor(d);
          otBy[mul]=Math.round(((otBy[mul]||0)+h)*100)/100;
          if(h<raw){ capH+=raw-h; capDays++; }
        }
        else { skipH+=raw; skipDays++; }          // ปิดที่คนหรือที่วัน → ไม่คิด
      }
    }
    else if(om<we) early++;
  });
  return { days, late, lateMin, otHours:Math.round(otH*100)/100, otBy,
           skipHours:Math.round(skipH*100)/100, skipDays,
           capHours:Math.round(capH*100)/100, capDays, early, noOut,
           otOff:!otPerson(emp) };
}

      <div class="tbl-wrap" style="max-height:340px;overflow:auto">

/* ---------- เครื่องมือจัดกะแบบยกชุด ---------- */
// เขียนกะลงตาราง — ถ้าตรงกับกะประจำตัวอยู่แล้วก็ไม่ต้องเก็บ (กันข้อมูลบวม)
function setShiftPlan(iso, emp, shId){
  const def=emp.shiftId||ensureShifts()[0].id;
  DB.shiftPlan[iso]=DB.shiftPlan[iso]||{};
  if(shId===def) delete DB.shiftPlan[iso][emp.id];
  else DB.shiftPlan[iso][emp.id]=shId;
  if(!Object.keys(DB.shiftPlan[iso]).length) delete DB.shiftPlan[iso];
}
// เขียนแบบดิบ (ใช้ตอนตรึงอดีต — ต้องเก็บแม้ค่าจะตรงกับกะประจำ)
function setShiftPlanRaw(iso, emp, shId){
  DB.shiftPlan[iso]=DB.shiftPlan[iso]||{};
  DB.shiftPlan[iso][emp.id]=shId;
}
// ทุกวันที่พนักงานคนนี้มีข้อมูลลงเวลา (ทุกงวด)
function attendDatesOf(emp){
  const out=[];
  Object.keys(DB.attend||{}).forEach(p=>{
    const m=DB.attend[p] && DB.attend[p][emp.id];
    if(m) out.push(...Object.keys(m));
  });
  return out;
}
/* เปลี่ยน "กะประจำ" แบบถาวร โดยไม่ให้กระทบวันที่คำนวณไปแล้ว
   วันเก่าที่มีข้อมูลลงเวลาและอยู่ก่อนวันเริ่ม จะถูกล็อกกะเดิมไว้ก่อนเปลี่ยน */
function applyPermanentShift(emps, fromIso, mapFn){
  // 1) ตรึงอดีต — เฉพาะวันที่มีข้อมูลลงเวลาจริง (วันอื่นไม่มีผลต่อการคำนวณ)
  emps.forEach(e=>{
    attendDatesOf(e).forEach(iso=>{
      if(iso < fromIso && !shiftPlanned(e,iso)) setShiftPlanRaw(iso, e, shiftFor(e,iso).id);
    });
  });
  // 2) จำค่าที่ตั้งไว้รายวันตั้งแต่วันเริ่มเป็นต้นไป แล้วแปลงตามกฎเดียวกัน
  const pend=[];
  emps.forEach(e=>{
    Object.keys(DB.shiftPlan).forEach(iso=>{
      if(iso < fromIso) return;
      const cur=DB.shiftPlan[iso][e.id]; if(!cur) return;
      const next=mapFn(cur); if(next && next!==cur) pend.push([iso,e,next]);
    });
  });
  // 3) เปลี่ยนกะประจำ
  emps.forEach(e=>{
    const def=e.shiftId||ensureShifts()[0].id;
    const next=mapFn(def); if(next) e.shiftId=next;
  });
  // 4) เขียนค่าที่ค้าง แล้วเก็บกวาดตัวที่ตรงกับกะประจำใหม่
  pend.forEach(([iso,e,id])=>setShiftPlan(iso,e,id));
  emps.forEach(e=>{
    Object.keys(DB.shiftPlan).forEach(iso=>{
      if(iso < fromIso) return;
      if(DB.shiftPlan[iso][e.id]===(e.shiftId||ensureShifts()[0].id)){
        delete DB.shiftPlan[iso][e.id];
        if(!Object.keys(DB.shiftPlan[iso]).length) delete DB.shiftPlan[iso];
      }
    });
  });
}

// วนทุกวันในช่วง เลือกเฉพาะวันในสัปดาห์ที่ติ๊กไว้
function eachDate(f, t, wds, fn){
  const [y1,m1,d1]=String(f).split('-').map(Number);
  const [y2,m2,d2]=String(t).split('-').map(Number);
  const D=new Date(y1,m1-1,d1), end=new Date(y2,m2-1,d2);
  let n=0, guard=0;
  while(D<=end && guard++<800){ if(!wds || wds.has(D.getDay())){ fn(isoOf(D)); n++; } D.setDate(D.getDate()+1); }
  return n;
}

function wireEmpPicker(){
  const rows=[...document.querySelectorAll('.epRow')];
  const upd=()=>{ const n=document.querySelectorAll('.epChk:checked').length;
    const c=$('#epCount'); if(c) c.textContent=`เลือกแล้ว ${num(n)} คน`; };
  const filt=()=>{ const d=$('#epDept').value, s=$('#epShift').value;
    rows.forEach(r=>{ const ok=(!d||r.dataset.dept===d)&&(!s||r.dataset.shift===s);
      r.style.display=ok?'block':'none'; r.querySelector('.epChk').checked=ok; });
    upd(); };
  const dp=$('#epDept'), sp=$('#epShift');
  if(dp) dp.onchange=filt;
  if(sp) sp.onchange=filt;
  const ba=$('#epAll'), bn=$('#epNone');
  if(ba) ba.onclick=()=>{ rows.forEach(r=>{ if(r.style.display!=='none') r.querySelector('.epChk').checked=true; }); upd(); };
  if(bn) bn.onclick=()=>{ rows.forEach(r=>r.querySelector('.epChk').checked=false); upd(); };
  document.querySelectorAll('.epChk').forEach(x=>x.onchange=upd);
  upd();
}
function pickedEmps(){ return [...document.querySelectorAll('.epChk:checked')]
  .map(x=>DB.employees.find(e=>e.id===x.value)).filter(Boolean); }

/* ช่องติ๊กเปลี่ยนกะประจำด้วย */
function permaHtml(label){

      border:1px solid #fed7aa;border-radius:9px;padding:10px 12px;cursor:pointer">

      วันก่อนหน้าที่ลงเวลาไว้แล้วจะถูกล็อกกะเดิมไว้ ตัวเลขเดิมไม่เปลี่ยน</span></label>`;
}
function isPerma(){ const x=$('#brPerma'); return !!(x && x.checked); }

/* ช่วงวันที่ + วันในสัปดาห์ */
function dateRangeHtml(){
  const {from,to}=periodRange(PERIOD);
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
      <div class="field"><label>ตั้งแต่วันที่</label><input type="date" id="brFrom" value="${isoOf(from)}"></div>
      <div class="field"><label>ถึงวันที่</label><input type="date" id="brTo" value="${isoOf(to)}"></div>
    </div>

      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">
        ${WD_S.map((w,i)=>`<label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;
          border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer">
          <input type="checkbox" class="brWd" value="${i}" checked> ${w}</label>`).join('')}
      </div></div>`;
}
function readRange(){
  const f=$('#brFrom').value, t=$('#brTo').value;
  if(!f||!t||daysBetween(f,t)===0){ toast('ช่วงวันที่ไม่ถูกต้อง'); return null; }
  const wds=new Set([...document.querySelectorAll('.brWd:checked')].map(x=>+x.value));
  if(!wds.size){ toast('ยังไม่ได้เลือกวันในสัปดาห์'); return null; }
  return {f,t,wds};
}

/* 1) ตั้งกะเป็นช่วงวันที่ */
function shiftBulkModal(shown){
  const list=ensureShifts();
  openModal('📅 ตั้งกะเป็นช่วงวันที่',
    `<div class="field"><label>ตั้งเป็นกะ</label><select id="sbShift">
      ${list.map(s=>`<option value="${s.id}">${esc(s.name)} (${esc(s.start)}–${esc(s.end)})</option>`).join('')}</select></div>
     ${dateRangeHtml()}${permaHtml('ตั้งเป็นกะประจำถาวร')}${empPickerHtml(shown)}`,
    [['ยกเลิก','ghost',closeModal],['ตั้งกะ','',()=>{
      const r=readRange(); if(!r) return;
      const emps=pickedEmps(); if(!emps.length){ toast('ยังไม่ได้เลือกพนักงาน'); return; }
      const shId=$('#sbShift').value;
      if(isPerma()){
        applyPermanentShift(emps, r.f, ()=>shId);
        save(); closeModal(); render();
        toast(`ตั้งกะประจำถาวรแล้ว ${num(emps.length)} คน`);
        return;
      }
      let n=0;
      eachDate(r.f,r.t,r.wds,iso=>{ emps.forEach(e=>{ setShiftPlan(iso,e,shId); n++; }); });
      save(); closeModal(); render(); toast(`ตั้งกะแล้ว ${num(n)} รายการ`);
    }]]);
  wireEmpPicker();
}

     </div>
     ${dateRangeHtml()}${permaHtml('สลับกะประจำถาวร')}${empPickerHtml(shown)}`,
    [['ยกเลิก','ghost',closeModal],['สลับกะ','',()=>{
      const A=$('#swA').value, B=$('#swB').value;
      if(A===B){ toast('เลือกกะให้ต่างกัน'); return; }
      const r=readRange(); if(!r) return;
      const emps=pickedEmps(); if(!emps.length){ toast('ยังไม่ได้เลือกพนักงาน'); return; }
      const swap=id=> id===A?B : id===B?A : null;
      if(isPerma()){
        const affected=emps.filter(e=>{ const d=e.shiftId||list[0].id; return d===A||d===B; });
        applyPermanentShift(emps, r.f, swap);
        save(); closeModal(); render();
        toast(affected.length?`สลับกะประจำถาวรแล้ว ${num(affected.length)} คน`:'ไม่มีใครอยู่ในสองกะนี้');
        return;
      }
      let n=0;
      eachDate(r.f,r.t,r.wds,iso=>{
        // อ่านกะเดิมของทุกคนก่อน แล้วค่อยเขียน — กันเขียนทับกันเองระหว่างสลับ
        const cur=emps.map(e=>[e, shiftFor(e,iso).id]);
        cur.forEach(([e,id])=>{
          const nx=swap(id); if(nx){ setShiftPlan(iso,e,nx); n++; }
        });
      });
      save(); closeModal(); render();
      toast(n?`สลับกะแล้ว ${num(n)} รายการ`:'ไม่มีใครอยู่ในสองกะนี้ในช่วงที่เลือก');
    }]]);
  wireEmpPicker();
}

/* 3) หมุนเวียนกะอัตโนมัติ — วนกะทุก N วัน แต่ละคนเริ่มจากกะประจำตัวเอง (กลุ่มจึงเหลื่อมกันเอง) */
function shiftRotateModal(shown){
  const list=ensureShifts();
  if(list.length<2){ toast('ต้องมีอย่างน้อย 2 กะ'); return; }
  openModal('♻️ หมุนเวียนกะอัตโนมัติ',
    `<p class="muted" style="font-size:13px;margin-bottom:8px">
       สร้างตารางหมุนกะให้ทั้งช่วงในครั้งเดียว — แต่ละคน<strong>เริ่มจากกะประจำตัวเอง</strong>
       แล้ววนไปกะถัดไปทุก ๆ รอบ กลุ่มที่ตั้งกะประจำต่างกันจึงหมุนเหลื่อมกันโดยอัตโนมัติ</p>
     <div class="field"><label>กะที่ร่วมหมุนเวียน (ตามลำดับ)</label>
       <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">
         ${list.map((s,i)=>`<label style="display:inline-flex;align-items:center;gap:5px;font-size:13px;
           border:1.5px solid ${s.color};border-radius:8px;padding:5px 10px;cursor:pointer;background:${s.color}14">
           <input type="checkbox" class="roSh" value="${s.id}" checked> ${i+1}. ${esc(s.name)}</label>`).join('')}
       </div></div>
     <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
       <div class="field"><label>เปลี่ยนกะทุก ๆ</label>
         <select id="roEvery">
           <option value="7" selected>7 วัน (รายสัปดาห์)</option>
           <option value="1">1 วัน</option>
           <option value="2">2 วัน</option>
           <option value="3">3 วัน</option>
           <option value="14">14 วัน (2 สัปดาห์)</option>
         </select></div>
       <div class="field"><label>เริ่มนับรอบจากวันที่</label><input type="date" id="roAnchor" value="${isoOf(periodRange(PERIOD).from)}"></div>
     </div>
     ${dateRangeHtml()}${empPickerHtml(shown)}`,
    [['ยกเลิก','ghost',closeModal],['สร้างตารางหมุนกะ','',()=>{
      const ids=[...document.querySelectorAll('.roSh:checked')].map(x=>x.value);
      if(ids.length<2){ toast('เลือกกะที่ร่วมหมุนอย่างน้อย 2 กะ'); return; }
      const every=+$('#roEvery').value||7;
      const anchor=$('#roAnchor').value;
      if(!anchor){ toast('ยังไม่ได้เลือกวันเริ่มนับรอบ'); return; }
      const r=readRange(); if(!r) return;
      const emps=pickedEmps(); if(!emps.length){ toast('ยังไม่ได้เลือกพนักงาน'); return; }
      const [ay,am,ad]=anchor.split('-').map(Number); const A0=new Date(ay,am-1,ad);
      let n=0;
      eachDate(r.f,r.t,r.wds,iso=>{
        const [y,m,d]=iso.split('-').map(Number);
        const block=Math.floor(Math.round((new Date(y,m-1,d)-A0)/86400000)/every);
        emps.forEach(e=>{
          const def=e.shiftId||list[0].id;
          let start=ids.indexOf(def); if(start<0) start=0;      // กะประจำไม่ได้ร่วมหมุน → เริ่มที่ตัวแรก
          const idx=(((start+block)%ids.length)+ids.length)%ids.length;
          setShiftPlan(iso,e,ids[idx]); n++;
        });
      });
      save(); closeModal(); render(); toast(`สร้างตารางหมุนกะแล้ว ${num(n)} รายการ`);
    }]]);
  wireEmpPicker();
  /* ติ๊กกะออก = กะนั้นไม่ร่วมหมุนเวียน คนที่มีกะประจำเป็นกะนั้นจึงไม่ควรถูกจัดตารางด้วย
     จึงติ๊กชื่อออกให้อัตโนมัติ และติ๊กกลับให้เมื่อเลือกกะนั้นคืน */
  (function(){
    const rows=[...document.querySelectorAll('.epRow')];
    const refresh=()=>{ const ck=document.querySelector('.epChk'); if(ck) ck.dispatchEvent(new Event('change')); };
    document.querySelectorAll('.roSh').forEach(sh=>{
      sh.addEventListener('change', ()=>{
        rows.forEach(r=>{
          if(r.dataset.shift!==sh.value) return;
          if(r.style.display==='none') return;          /* ถูกกรองซ่อนอยู่ ไม่ต้องยุ่ง */
          const ck=r.querySelector('.epChk'); if(ck) ck.checked=sh.checked;
        });
        refresh();
      });
    });
  })();
}

/* 4) คัดลอกตารางกะจากงวดก่อน (จับคู่ตามลำดับวันในงวด) */
function shiftCopyPrev(){
  const [y,m]=PERIOD.split('-').map(Number);
  const prev=`${m===1?y-1:y}-${pad2(m===1?12:m-1)}`;
  const src=periodDates(prev), dst=periodDates(PERIOD);
  let found=0;
  src.forEach(d=>{ if(DB.shiftPlan[d]) found+=Object.keys(DB.shiftPlan[d]).length; });
  if(!found){ toast(`งวด ${periodLabel(prev)} ไม่มีการสลับกะให้คัดลอก`); return; }
  openModal('📋 คัดลอกตารางกะจากงวดก่อน',
    `<p>คัดลอกการสลับกะจากงวด <strong>${esc(periodLabel(prev))}</strong> (${num(found)} รายการ)
       มาที่งวด <strong>${esc(periodLabel(PERIOD))}</strong></p>
     <p class="muted" style="font-size:12.5px">จับคู่ตามลำดับวันในงวด — วันแรกของงวดก่อน → วันแรกของงวดนี้
       ${src.length!==dst.length?`<br>⚠️ งวดก่อนมี ${src.length} วัน งวดนี้มี ${dst.length} วัน — วันที่เกินจะถูกข้าม`:''}</p>
     <p style="color:#b45309;font-size:13px">การสลับกะเดิมในงวดนี้จะถูกแทนที่ทั้งหมด</p>`,
    [['ยกเลิก','ghost',closeModal],['คัดลอก','',()=>{
      dst.forEach(d=>delete DB.shiftPlan[d]);
      let n=0;
      const len=Math.min(src.length,dst.length);
      for(let i=0;i<len;i++){
        const s=DB.shiftPlan[src[i]]; if(!s) continue;
        Object.keys(s).forEach(eid=>{
          const emp=DB.employees.find(x=>x.id===eid); if(!emp) return;
          setShiftPlan(dst[i], emp, s[eid]); n++;
        });
      }
      save(); closeModal(); render(); toast(`คัดลอกแล้ว ${num(n)} รายการ`);
    }]]);
}

// แผงตั้งค่า "วันไหนเปิด OT" — รายสัปดาห์ + กำหนดเฉพาะวันในงวดนี้

    return `<div style="text-align:center">
      <div class="muted" style="font-size:12px;margin-bottom:3px">${WD_S[i]}</div>
      <select data-wdm="${i}" style="padding:5px 4px;font-size:12.5px;width:66px">
        ${OT_MULT_STEPS.map(v=>`<option value="${v}" ${cur===v?'selected':''}>${v}×</option>`).join('')}
      </select></div>`;
  }).join('');
  const nMulOver=dates.filter(otMultOverridden).length;
  const mulChips=dates.map(d=>{
    if(!otAllowed(d)) return '';                       // วันที่ปิด OT ไม่ต้องตั้งตัวคูณ
    const m=otMultFor(d), ov=otMultOverridden(d);
    return `<button type="button" data-otm="${d}" title="${d} (${WD_TH[weekdayOf(d)]}) — ตัวคูณ ${m}× ${ov?'(กำหนดเอง)':'(ตามวันในสัปดาห์)'} · กดเพื่อเปลี่ยน"
      style="min-width:50px;padding:5px 3px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;line-height:1.35;
        border:1.5px ${ov?'solid':'dashed'} #0f766e;background:${ov?'#ccfbf1':'#fff'};color:#0f766e">
      ${+d.slice(8)}<br><span style="font-size:11px;font-weight:600">${m}×</span></button>`;
  }).join('');

  const panel=el(`<div class="panel" style="margin-bottom:16px">
    <div class="phead" style="padding:12px 16px;font-weight:700">⚡ วันที่เปิดให้คิด OT
      <span class="muted" style="font-weight:400;font-size:13px">— งวดนี้เปิด ${num(nOpen)} / ${num(dates.length)} วัน${nOver?` · กำหนดเอง ${num(nOver)} วัน`:''}</span></div>
    <div class="pbody">
      <div style="font-size:13.5px;font-weight:700;margin-bottom:7px">เปิด OT ตามวันในสัปดาห์</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">${wdBtns}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
        <button class="btn ghost sm" id="otAllOn">เปิดทุกวัน</button>
        <button class="btn ghost sm" id="otWorkOnly">จ–ศ เท่านั้น</button>
        <button class="btn ghost sm" id="otAllOff">ปิดทุกวัน</button>
      </div>

      <div style="font-size:13.5px;font-weight:700;margin-bottom:4px">กำหนดเฉพาะวัน — งวด ${esc(periodLabel(PERIOD))}</div>
      <div class="muted" style="font-size:12.5px;margin-bottom:8px">กดที่วันที่เพื่อสลับเปิด/ปิด (ทับค่ารายสัปดาห์) · จุดสีเหลือง = กำหนดเอง</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">${chips}</div>
      ${nOver?`<button class="btn ghost sm" id="otClr" style="margin-top:11px">↺ ล้างที่กำหนดเองในงวดนี้ (${num(nOver)} วัน)</button>`:''}

      <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px">
        <div style="font-size:13.5px;font-weight:700;margin-bottom:4px">ตัวคูณ OT — วันไหนคูณเท่าไร</div>
        <div class="muted" style="font-size:12.5px;margin-bottom:8px">
          ตั้งตามวันในสัปดาห์ก่อน แล้วกดที่วันที่ด้านล่างเพื่อกำหนดเฉพาะวัน (เช่น วันหยุดนักขัตฤกษ์)</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${wdMulBtns}</div>
        <div class="muted" style="font-size:12.5px;margin-bottom:6px">กำหนดเฉพาะวัน — กดที่วันที่เพื่อวนเปลี่ยนตัวคูณ · กรอบทึบ = กำหนดเอง</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">${mulChips}</div>
        ${nMulOver?`<button class="btn ghost sm" id="otMulClr" style="margin-top:11px">↺ ล้างตัวคูณที่กำหนดเองในงวดนี้ (${num(nMulOver)} วัน)</button>`:''}
      </div>

      <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px">
        <div style="font-size:13.5px;font-weight:700;margin-bottom:6px">เพดาน OT ต่อวัน</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
          <div class="field" style="max-width:150px"><label>ไม่เกินวันละ (ชม.)</label>
            <input type="number" id="otCap" min="0" step="0.5" value="${+DB.otMaxDay||0}"></div>
          <button class="btn ghost sm" id="otCapSave">💾 บันทึกเพดาน</button>
          <span class="muted" style="font-size:12.5px">ใส่ <strong>0</strong> = ไม่จำกัด · ชั่วโมงที่เกินจะถูกตัดออก ไม่นำไปคิดเงิน<br>
            ตั้งเฉพาะบางคนต่างจากนี้ได้ที่ฟอร์ม “ข้อมูลพนักงาน”</span>
        </div>
      </div>

      <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px">
        <div style="font-size:13.5px;font-weight:700;margin-bottom:4px">เปิด OT เฉพาะบางคน</div>
        <div class="muted" style="font-size:12.5px;margin-bottom:8px">
          ปัจจุบันเปิดให้ <strong>${num(DB.employees.filter(otPerson).length)}</strong> / ${num(DB.employees.length)} คน
          — กดสลับรายคนได้ที่คอลัมน์ <strong>“สิทธิ์ OT”</strong> ในตารางด้านล่าง</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn ghost sm" id="otpAll">เปิดให้ทุกคน</button>
          <button class="btn ghost sm" id="otpNone">ปิดทุกคน</button>
          <button class="btn ghost sm" id="otpDaily">เปิดเฉพาะพนักงานรายวัน</button>
          <button class="btn ghost sm" id="otpMonthly">เปิดเฉพาะพนักงานรายเดือน</button>
        </div>
      </div>

      <div style="margin-top:14px;padding:11px 13px;background:#f8fafc;border-radius:10px;font-size:12.5px;color:var(--muted)">
        คิด OT ให้เมื่อ <strong>คนนั้นเปิดสิทธิ์</strong> และ <strong>วันนั้นเปิด OT</strong> พร้อมกัน<br>
        วันที่ <strong>ปิด OT</strong> ระบบจะไม่นำเวลาที่อยู่เกินเวลาเลิกงานมาคิดเป็น OT
        แต่ยังนับวันทำงาน มาสาย และออกก่อนตามปกติ — ชั่วโมงที่ถูกตัดออกดูรวมได้ที่การ์ด <strong>“รวม OT”</strong> ด้านบน
      </div>
    </div></div>`);

  panel.querySelectorAll('[data-wd]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.wd; DB.otWeekdays[i]=!DB.otWeekdays[i]; save(); render();
  });
  // ตัวคูณตามวันในสัปดาห์
  panel.querySelectorAll('[data-wdm]').forEach(s=>s.onchange=()=>{
    if(!Array.isArray(DB.otMultWeekdays)) DB.otMultWeekdays=[1.5,1.5,1.5,1.5,1.5,1.5,1.5];
    DB.otMultWeekdays[+s.dataset.wdm]=+s.value||1.5; save(); render();
    toast('ตั้งตัวคูณวัน'+WD_TH[+s.dataset.wdm]+' = '+(+s.value)+'×');
  });
  // ตัวคูณเฉพาะวัน — กดวนไปเรื่อย ๆ ถ้าวนมาตรงกับค่ารายสัปดาห์จะล้างการกำหนดเอง
  panel.querySelectorAll('[data-otm]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.otm;
    DB.otMultDates=DB.otMultDates||{};
    const cur=otMultFor(d);
    const i=OT_MULT_STEPS.indexOf(cur);
    const next=OT_MULT_STEPS[(i+1)%OT_MULT_STEPS.length];
    if(next===otMultWeekday(weekdayOf(d))) delete DB.otMultDates[d];
    else DB.otMultDates[d]=next;
    save(); render();
  });
  const mulClr=panel.querySelector('#otMulClr');
  if(mulClr) mulClr.onclick=()=>{
    dates.forEach(d=>{ if(DB.otMultDates) delete DB.otMultDates[d]; });
    save(); render(); toast('ล้างตัวคูณที่กำหนดเองแล้ว');
  };
  panel.querySelector('#otAllOn').onclick=()=>{ DB.otWeekdays=[true,true,true,true,true,true,true]; save(); render(); };
  panel.querySelector('#otWorkOnly').onclick=()=>{ DB.otWeekdays=[false,true,true,true,true,true,false]; save(); render(); };
  panel.querySelector('#otAllOff').onclick=()=>{ DB.otWeekdays=[false,false,false,false,false,false,false]; save(); render(); };
  panel.querySelectorAll('[data-otd]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.otd, wdDefault=!!DB.otWeekdays[weekdayOf(d)];
    const next=!otAllowed(d);
    if(next===wdDefault) delete DB.otDates[d];   // กลับไปตรงกับค่ารายสัปดาห์ → ไม่ต้องเก็บ
    else DB.otDates[d]=next;
    save(); render();
  });
  const clr=panel.querySelector('#otClr');
  if(clr) clr.onclick=()=>{ dates.forEach(d=>delete DB.otDates[d]); save(); render(); toast('ล้างที่กำหนดเองแล้ว'); };
  const setAll=(fn)=>{ DB.employees.forEach(e=>{ if(fn(e)) delete e.noOT; else e.noOT=1; });
    save(); render(); toast('ตั้งสิทธิ์ OT รายคนแล้ว'); };
  panel.querySelector('#otCapSave').onclick=()=>{
    DB.otMaxDay=Math.max(0,+panel.querySelector('#otCap').value||0);
    save(); render(); toast(DB.otMaxDay? `ตั้งเพดาน OT วันละ ${num(DB.otMaxDay)} ชม.` : 'ยกเลิกเพดาน OT แล้ว');
  };
  panel.querySelector('#otpAll').onclick=()=>setAll(()=>true);
  panel.querySelector('#otpNone').onclick=()=>setAll(()=>false);
  panel.querySelector('#otpDaily').onclick=()=>setAll(e=>e.payType==='daily');
  panel.querySelector('#otpMonthly').onclick=()=>setAll(e=>e.payType!=='daily');
  return panel;
}

// ตารางเวลารายวันของพนักงาน 1 คน — แก้ไขได้ทีละช่อง
function attendDetailModal(empId){
  const emp=DB.employees.find(e=>e.id===empId); if(!emp) return;
  const rec=attendOf(PERIOD, empId);
  ensureShifts();

function importAttendCSV(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{
      const rows=parseCSV(decodeTextBytes(rd.result));
      if(rows.length<2){ toast('ไฟล์ CSV ว่างเปล่า'); return; }
      let ok=0; const bad=[], outside=[], unknown=new Set();
      for(let r=1;r<rows.length;r++){
        const c=rows[r]; if(!c||!String(c[0]||'').trim()) continue;
        const code=String(c[0]).trim();
        const emp=DB.employees.find(x=>String(x.code).trim()===code);
        if(!emp){ unknown.add(code); continue; }
        const d=String(c[1]||'').trim();
        if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ bad.push(`บรรทัด ${r+1}: วันที่ "${d}"`); continue; }
        const i=String(c[2]||'').trim(), o=String(c[3]||'').trim();
        if(i && hm2min(i)==null){ bad.push(`บรรทัด ${r+1}: เวลาเข้า "${i}"`); continue; }
        if(o && hm2min(o)==null){ bad.push(`บรรทัด ${r+1}: เวลาออก "${o}"`); continue; }
        if(!i && !o){ continue; }
        // เก็บลงงวดที่วันที่นั้นสังกัด (รองรับไฟล์ที่คร่อมหลายงวด)
        const p = periodOfDate(d);
        const box=ensureAttend(p); if(!box[emp.id]) box[emp.id]={};
        box[emp.id][d]={i,o};
        if(p!==PERIOD) outside.push(p);
        ok++;
      }
      save(); render();
      let msg=`นำเข้าสำเร็จ ${ok} รายการ`;
      if(unknown.size) msg+=` · ไม่พบรหัส ${[...unknown].slice(0,3).join(', ')}${unknown.size>3?'…':''}`;
      if(bad.length) msg+=` · ข้อมูลผิด ${bad.length} บรรทัด`;
      toast(msg);
      if(bad.length||unknown.size){
        openModal('ผลการนำเข้า CSV',
          `<p>สำเร็จ <strong>${ok}</strong> รายการ${outside.length?` (มี ${new Set(outside).size} งวดอื่นด้วย)`:''}</p>
           ${unknown.size?`<p style="color:#b45309">ไม่พบรหัสพนักงานเหล่านี้ในระบบ: <strong>${esc([...unknown].join(', '))}</strong><br>
             <span class="muted" style="font-size:12.5px">ต้องเพิ่มพนักงานในเมนู “ข้อมูลพนักงาน” ให้รหัสตรงกันก่อน</span></p>`:''}
           ${bad.length?`<p style="color:#dc2626">รูปแบบไม่ถูกต้อง:</p><ul style="margin-left:18px;font-size:13px">${bad.slice(0,12).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>${bad.length>12?`<p class="muted">…และอีก ${bad.length-12} บรรทัด</p>`:''}`:''}`,
          [['ปิด','ghost',closeModal]]);
      }
    };
    rd.readAsArrayBuffer(f); };
  inp.click();
}
// งวดที่วันที่นี้สังกัด (อิงวันตัดรอบ)
function periodOfDate(iso){
  const [y,m,d]=iso.split('-').map(Number);
  const cut=+DB.cutoffDay||0;
  if(!cut) return `${y}-${pad2(m)}`;
  // ถ้าเลยวันตัดรอบ → นับเป็นงวดเดือนถัดไป
  if(d>cut){ const nm=m===12?1:m+1, ny=m===12?y+1:y; return `${ny}-${pad2(nm)}`; }
  return `${y}-${pad2(m)}`;
}
// ส่งวันทำงาน + ชั่วโมง OT เข้าหน้าเงินได้/เงินหักของงวดนี้
function pushAttendToPayroll(){
  const list=DB.employees.filter(e=>!resignedBefore(e,PERIOD));
  const targets=list.map(e=>({e, s:attendStats(e,PERIOD)})).filter(x=>x.s.days||x.s.otHours);
  if(!targets.length){ toast('ยังไม่มีข้อมูลเวลาในงวดนี้'); return; }
  const nDaily=targets.filter(x=>x.e.payType==='daily').length;
  const nOT=targets.filter(x=>x.s.otHours>0).length;
  // รวมชั่วโมงตามตัวคูณของทุกคน เพื่อให้เห็นก่อนกดยืนยัน
  const sumBy={};
  targets.forEach(({s})=>Object.keys(s.otBy||{}).forEach(k=>{
    sumBy[k]=Math.round(((sumBy[k]||0)+ +s.otBy[k])*100)/100;
  }));
  const byKeys=Object.keys(sumBy).filter(k=>sumBy[k]>0).sort((a,b)=>a-b);
  const byLine=byKeys.length
    ? '<ul style="margin:6px 0 0 18px">'+byKeys.map(k=>'<li><strong>'+k+'×</strong> รวม '+num(sumBy[k])+' ชม.</li>').join('')+'</ul>'
    : '';
  openModal('➡️ ส่งข้อมูลเข้าเงินได้ / เงินหัก',
    `<p>จากเวลาเข้างานงวด <strong>${esc(periodLabel(PERIOD))}</strong> จะเขียนข้อมูลลงหน้า “เงินได้ / เงินหัก”:</p>
     <ul style="margin-left:18px">
       <li>ตั้ง <strong>จำนวนวันทำงาน</strong> ให้พนักงานรายวัน <strong>${nDaily}</strong> คน</li>
       <li>สร้าง <strong>แถว OT แยกตามตัวคูณ</strong> ให้ <strong>${nOT}</strong> คน แล้วคำนวณเงิน OT ใหม่${byLine}</li>
     </ul>
     <p class="muted" style="font-size:12.5px">
       ตัวคูณมาจากที่ตั้งไว้ในหัวข้อ <strong>“ตัวคูณ OT — วันไหนคูณเท่าไร”</strong><br>
       แถว OT และจำนวนวันทำงานเดิมจะถูกเขียนทับ ช่องอื่นไม่ถูกแตะ</p>`,
    [['ยกเลิก','ghost',closeModal],['เขียนข้อมูล','',()=>{
      let d=0, o=0;
      targets.forEach(({e,s})=>{
        const r=getRec(PERIOD, e.id);
        if(e.payType==='daily'){ r.days=s.days; d++; }
        if(s.otHours>0){
          // แยกเป็นแถวละตัวคูณ เรียงจากน้อยไปมาก
          const by=s.otBy||{};
          const ks=Object.keys(by).filter(k=>+by[k]>0).sort((a,b)=>a-b);
          r.earn.otRows = ks.length ? ks.map(k=>({h:+by[k], m:+k}))
                                    : [{h:s.otHours, m:1.5}];
          delete r.earn.otHours; delete r.earn.otMult;   // เลิกใช้รูปแบบแถวเดียว
          r.earn.ot=otTotal(e, r);
          o++;
        }
        autoDeductions(e, r);   // ภาษี/ประกันสังคม/กสล. คำนวณใหม่ตามเงินได้ที่เปลี่ยน
      });
      save(); closeModal(); toast(`ส่งข้อมูลแล้ว · วันทำงาน ${d} คน · OT ${o} คน`);
    }]]);
}

const LEAVE_TYPES=[
  ['sick','ลาป่วย','#ef4444'],
  ['personal','ลากิจ','#f59e0b'],
  ['vacation','ลาพักร้อน','#10b981'],
  ['maternity','ลาคลอด','#ec4899'],
  ['ordination','ลาอุปสมบท','#8b5cf6'],
  ['unpaid','ขาดงาน / ลาไม่รับค่าจ้าง','#64748b'],
];
const LEAVE_LAB=k=>{ const t=LEAVE_TYPES.find(x=>x[0]===k); return t?t[1]:k; };
const LEAVE_COL=k=>{ const t=LEAVE_TYPES.find(x=>x[0]===k); return t?t[2]:'#64748b'; };
const QUOTA_TYPES=['sick','personal','vacation'];

function leaveList(){ if(!Array.isArray(DB.leave)) DB.leave=[]; return DB.leave; }
// ชั่วโมงทำงานต่อวัน (ใช้แปลงวันลา ↔ ชั่วโมงลา)
function lvHPD(){ return +DB.leaveHoursPerDay || +DB.otHours || 8; }
function hrsToDays(h){ return Math.round((+h||0)/lvHPD()*10000)/10000; }
function daysToHrs(d){ return Math.round((+d||0)*lvHPD()*100)/100; }
// แสดงจำนวนวันลาให้อ่านง่าย — ถ้าไม่เต็มวันบอกเป็นชั่วโมงกำกับ
function leaveAmountText(l){
  const d=Number(l.days||daysBetween(l.from,l.to||l.from)||0);
  const h=(l.hours!=null && l.hours!=='') ? Number(l.hours) : null;
  if(h!=null) return `${num(h)} ชม.<br><span class="muted" style="font-size:11.5px">= ${num(Math.round(d*100)/100)} วัน</span>`;
  return num(d);
}
function daysBetween(a,b){
  if(!a||!b) return 0;
  const [y1,m1,d1]=a.split('-').map(Number), [y2,m2,d2]=b.split('-').map(Number);
  const A=new Date(y1,m1-1,d1), B=new Date(y2,m2-1,d2);
  if(B<A) return 0;
  return Math.round((B-A)/86400000)+1;
}
// จำนวนวันลาของใบลานี้ที่ตกอยู่ในงวด p
function leaveDaysInPeriod(lv, p){
  const {from,to}=periodRange(p);
  const [y1,m1,d1]=lv.from.split('-').map(Number), [y2,m2,d2]=(lv.to||lv.from).split('-').map(Number);
  let A=new Date(y1,m1-1,d1), B=new Date(y2,m2-1,d2);
  if(A<from) A=from; if(B>to) B=to;
  if(A>B) return 0;
  const span=Math.round((B-A)/86400000)+1;
  const total=daysBetween(lv.from, lv.to||lv.from) || 1;
  // ถ้าผู้ใช้ระบุจำนวนวันเอง (เช่นลาครึ่งวัน) เฉลี่ยตามสัดส่วน
  return Math.round((Number(lv.days||total) * span/total)*100)/100;
}
// วันครบ 1 ปีของพนักงาน (วันเริ่มงาน + 1 ปี)
function anniversary1Y(emp){
  if(!emp || !emp.startDate) return null;
  const [y,m,d]=String(emp.startDate).split('-').map(Number);
  if(!y||!m||!d) return null;
  return new Date(y+1, m-1, d);
}
// สิทธิ์ลาพักร้อนของปีที่ดู: ต้องทำงานครบ 1 ปีแล้ว
//   ปีที่ผ่านมา/ปีอนาคต → วัดที่สิ้นปีนั้น · ปีปัจจุบัน → วัดที่วันนี้
function vacationEligible(emp, year){
  const ann=anniversary1Y(emp);
  if(!ann) return { ok:false, ann:null, reason:'ไม่ได้ระบุวันเริ่มงาน' };
  const nowY=new Date().getFullYear();
  const asOf = (year===nowY) ? new Date() : new Date(year,11,31);
  return { ok: ann<=asOf, ann, asOf };
}
function fmtThaiDate(d){ return d? `${d.getDate()} ${THAI_MONTHS_ABBR[d.getMonth()]} ${d.getFullYear()+543}` : '-'; }
// อายุงาน ณ วันที่อ้างอิง — คืนข้อความอ่านง่าย
function serviceText(emp, year){
  if(!emp.startDate) return '-';
  const [y,m,d]=String(emp.startDate).split('-').map(Number);
  const S=new Date(y,m-1,d);
  const nowY=new Date().getFullYear();
  const asOf=(year===nowY)?new Date():new Date(year,11,31);
  if(S>asOf) return 'ยังไม่เริ่มงาน';
  let yy=asOf.getFullYear()-S.getFullYear();
  let mm=asOf.getMonth()-S.getMonth();
  if(asOf.getDate()<S.getDate()) mm--;
  if(mm<0){ yy--; mm+=12; }
  return (yy>0? yy+' ปี ':'') + mm + ' เดือน';
}
/* ตั้งโควตาเฉพาะพนักงานคนหนึ่ง — เว้นว่าง = ใช้ค่าส่วนกลาง */

}
/* โควตารายคน — ตั้งทับค่าส่วนกลางได้ (เช่น ลาพักร้อนเพิ่มตามอายุงานหรือตามสัญญาจ้าง)
   เก็บที่ emp.quota = { sick, personal, vacation } · ค่าว่าง/ไม่ได้ตั้ง = ใช้ค่าส่วนกลาง */
function ownQuota(emp, type){
  const v=emp && emp.quota && emp.quota[type];
  return (v===''||v===null||v===undefined) ? null : (+v||0);
}
function hasOwnQuota(emp, type){ return ownQuota(emp,type)!==null; }
// โควตาที่ได้จริงของพนักงานคนนี้ในปีนี้ (ลาพักร้อนผูกกับอายุงานครบ 1 ปี)
function quotaFor(emp, type, year){
  const own=ownQuota(emp,type);
  const base = own!==null ? own : (+((DB.leaveQuota||{})[type])||0);
  if(type!=='vacation') return base;
  return vacationEligible(emp, year).ok ? base : 0;
}

function leaveUsed(empId, year, type){
  return leaveList().filter(l=>l.empId===empId && l.type===type && l.status!=='rejected'
      && String(l.from||'').slice(0,4)===String(year))
    .reduce((s,l)=>s+Number(l.days||daysBetween(l.from,l.to||l.from)||0),0);
}
/* จำนวนวันลาไม่รับค่าจ้าง/ขาดงานที่ตกอยู่ในงวดนี้ (ใบที่ไม่อนุมัติไม่นับ) */
function unpaidDays(emp, p){
  if(!Array.isArray(DB.leave)) return 0;
  return Math.round(DB.leave.filter(l=>l.empId===emp.id && l.type==='unpaid' && l.status!=='rejected')
    .reduce((s,l)=>s+leaveDaysInPeriod(l,p),0)*100)/100;
}
function unpaidDeduction(emp, p){
  if(emp.payType==='daily') return 0;   // รายวันไม่จ่ายวันที่ไม่มา อยู่แล้ว
  const d=unpaidDays(emp, p);
  if(!d) return 0;
  return Math.round(Number(emp.salary||0)/30*d);
}

      if(!vac.ok){
        box.style.display='block';
        box.innerHTML=`⚠️ <strong>${esc(e.name)}</strong> ยังทำงานไม่ครบ 1 ปี จึงยังไม่มีสิทธิ์ลาพักร้อน`
          + (vac.ann? ` — จะครบ 1 ปีวันที่ <strong>${fmtThaiDate(vac.ann)}</strong>` : ` (${esc(vac.reason||'')})`)
          + `<br>บันทึกได้ แต่จะแสดงเป็น “ใช้เกินสิทธิ์” ในตารางโควตา`;
        return;
      }
    }
    box.style.display='none';
  };
  ['#lvE','#lvT','#lvF'].forEach(s=>{ const n=$(s); if(n) n.addEventListener('change', chkVac); });
  chkVac();
  // กรอกช่องไหน อีกช่องคำนวณตาม + เติมจำนวนวันจากช่วงวันที่ให้เอง
  const dIn=$('#lvD'), hIn=$('#lvH'), fIn=$('#lvF'), tIn=$('#lvTo'), note=$('#lvAuto');
  if(dIn&&hIn){
    let lock=false;
    // โหมดอัตโนมัติ = ผู้ใช้ยังไม่ได้พิมพ์จำนวนวัน/ชั่วโมงเอง
    // ใบลาเดิมที่มีตัวเลขบันทึกไว้แล้วถือว่ากรอกเอง จะได้ไม่ถูกเขียนทับตอนเปิดแก้ไข
    let auto = !(cur && (cur.days!=null || cur.hours!=null));
    const showNote=(txt)=>{ if(note){ note.textContent=txt||''; note.style.display=txt?'':'none'; } };
    const syncFromDates=()=>{
      if(!auto) return;
      const f=fIn?fIn.value:'', t=(tIn&&tIn.value)||f;
      const d=daysBetween(f,t);
      if(d>0){
        lock=true; dIn.value=String(d); hIn.value=''; lock=false;
        showNote('นับจากช่วงวันที่ให้ — พิมพ์ทับได้ถ้าลาไม่เต็มวัน');
      }else{
        lock=true; dIn.value=''; hIn.value=''; lock=false;
        showNote('');
      }
    };
    // แตะช่องไหนก็ตาม (รวมถึงลบทิ้ง) = ผู้ใช้คุมเอง ระบบจะไม่เติมกลับ
    // จำเป็นสำหรับการลาเป็นชั่วโมง — ต้องลบจำนวนวันทิ้งก่อนแล้วพิมพ์ชั่วโมง
    const markManual=()=>{
      auto=false;
      showNote(dIn.value.trim()==='' && hIn.value.trim()===''
        ? 'ลบจำนวนวันแล้ว — พิมพ์จำนวนชั่วโมงในช่องถัดไป หรือเปลี่ยนวันที่เพื่อให้นับใหม่'
        : '');
    };
    dIn.addEventListener('input',()=>{ if(lock) return; lock=true;
      hIn.value = dIn.value.trim()===''?'':String(daysToHrs(+dIn.value||0)); lock=false; markManual(); });
    hIn.addEventListener('input',()=>{ if(lock) return; lock=true;
      dIn.value = hIn.value.trim()===''?'':String(Math.round(hrsToDays(+hIn.value||0)*10000)/10000); lock=false; markManual(); });
    // เลือกวันที่ใหม่ = ตั้งใจลาเป็นวัน ให้กลับมานับให้อัตโนมัติ
    const onDate=()=>{ auto=true; syncFromDates(); };
    [fIn,tIn].forEach(n=>{ if(n){ n.addEventListener('change',onDate); n.addEventListener('input',onDate); } });
    syncFromDates();
  }
}

function importLeaveCSV(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{
      const rows=parseCSV(decodeTextBytes(rd.result));
      if(rows.length<2){ toast('ไฟล์ CSV ว่างเปล่า'); return; }
      let ok=0; const unknown=new Set(); const bad=[];
      for(let r=1;r<rows.length;r++){
        const c=rows[r]; if(!c||!String(c[0]||'').trim()) continue;
        const code=String(c[0]).trim();
        const emp=DB.employees.find(x=>String(x.code).trim()===code);
        if(!emp){ unknown.add(code); continue; }
        const tTxt=String(c[1]||'').trim();
        const t=(LEAVE_TYPES.find(([k,l])=>l===tTxt||k===tTxt)||['unpaid'])[0];
        const fr=String(c[2]||'').trim(), to=String(c[3]||'').trim()||fr;
        if(!/^\d{4}-\d{2}-\d{2}$/.test(fr)){ bad.push(`บรรทัด ${r+1}: วันที่ "${fr}"`); continue; }
        if(daysBetween(fr,to)===0){ bad.push(`บรรทัด ${r+1}: ช่วงวันที่ไม่ถูกต้อง`); continue; }
        const hTxt=String(c[5]||'').trim();
        const hours = hTxt!=='' ? +hTxt : null;
        const days = hours!=null ? hrsToDays(hours) : (+c[4]||daysBetween(fr,to));
        const stTxt=String(c[7]||'').trim();
        const status=/รออนุมัติ|pending/i.test(stTxt)?'pending':/ไม่อนุมัติ|reject/i.test(stTxt)?'rejected':'approved';
        leaveList().push({ id:uid(), empId:emp.id, type:t, from:fr, to, days, hours,
          reason:String(c[6]||'').trim(), status });
        ok++;
      }
      save(); render();
      let msg=`นำเข้าใบลา ${ok} ใบ`;
      if(unknown.size) msg+=` · ไม่พบรหัส ${[...unknown].slice(0,3).join(', ')}`;
      if(bad.length) msg+=` · ผิดรูปแบบ ${bad.length} บรรทัด`;
      toast(msg);
    };
    rd.readAsArrayBuffer(f); };
  inp.click();
}

/* ---------- นำเข้า/ส่งออก พนักงาน เป็น CSV ---------- */
const EMP_CSV_HEAD=['รหัส','ชื่อ-นามสกุล','เพศ','สัญชาติ','ตำแหน่ง','เบอร์โทร','แผนก','ประเภท','ค่าจ้าง','วันเริ่มงาน(ปปปป-ดด-วว)','วันที่ลาออก(ปปปป-ดด-วว)','เหตุผลในการลาออก','รายละเอียดการลาออก','เลขบัตรประชาชน','ที่อยู่','ธนาคาร','เลขที่บัญชี','อัตรากสล.%','กองทุนสงเคราะห์%','คิดOT(ใช่/ไม่)','กะประจำ','เพดานOT/วัน'];
function csvEsc(v){ v=String(v??''); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
/* ---------- ช่องที่ Excel ชอบแปลงค่าให้เอง ----------
   เลขบัตร 13 หลัก -> 1.23457E+11 · เบอร์โทร 0812345678 -> 812345678 (เลข 0 หน้าหาย)
   วันที่ 2026-07-15 -> 15/7/2026 แล้วพอบันทึกกลับก็นำเข้าไม่ได้
   แก้ด้วยการเขียนเป็นสูตร ="..." ซึ่ง Excel/Sheets/LibreOffice อ่านเป็นข้อความล้วน */
function csvKeepText(v){
  v=String(v??'');
  if(v==='') return '';
  return '="'+v.replace(/"/g,'""')+'"';
}
/* ถอด ="..." หรือ '... ที่ติดมาจากไฟล์ Excel ออกก่อนใช้งาน */
function csvUnText(v){
  let s=String(v??'').trim();
  const m=s.match(/^=\s*"([\s\S]*)"$/);
  if(m) s=m[1].replace(/""/g,'"');
  else if(s.startsWith("'")) s=s.slice(1);
  return s.trim();
}
/* ---------- อ่านวันที่จากรูปแบบที่คนกรอกกันจริง ----------
   รับ 2026-07-15 · 15/7/2026 · 15-07-2026 · 2569-07-15 (พ.ศ.) · 15/7/2569
   คืนค่าเป็น YYYY-MM-DD เสมอ อ่านไม่ออกคืนค่าว่าง ดีกว่าเก็บค่าที่ใช้ไม่ได้ */
function csvDate(v){
  const s=csvUnText(v);
  if(!s) return '';
  const p=s.split(/[-/.]/).map(x=>x.trim()).filter(Boolean);
  if(p.length!==3) return '';
  let y,m,d;
  if(p[0].length===4){ y=+p[0]; m=+p[1]; d=+p[2]; }   // ปีมาก่อน
  else { d=+p[0]; m=+p[1]; y=+p[2]; }                  // วันมาก่อน (แบบไทย/ยุโรป)
  if(!(y>0&&m>0&&d>0)) return '';
  if(y<100) y+=2000;
  if(y>2400) y-=543;                                   // พ.ศ. -> ค.ศ.
  if(m>12||d>31) return '';
  const dt=new Date(y,m-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d) return '';   // 31/2 ไม่มีจริง
  return y+'-'+pad2(m)+'-'+pad2(d);
}
function parseCSV(text){
  const rows=[]; let field='', row=[], inQ=false; text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
    else if(c==='"') inQ=true;
    else if(c===',') { row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows;
}

/* ---------- จับคู่คอลัมน์ CSV จากชื่อหัวตาราง ----------
   เดิมอ่านตามลำดับคอลัมน์ตายตัว ไฟล์ที่เรียงคอลัมน์ต่างออกไปจึงเข้าช่องผิดหมด
   (เช่น เบอร์โทรไปอยู่ช่องตำแหน่ง) ตอนนี้อ่านชื่อหัวตารางก่อน
   ถ้าอ่านชื่อไม่ออกเลยค่อยถอยไปใช้ลำดับแบบเดิม */
const EMP_FIELDS=[
  ['code','รหัส',            [/^รหัส/,/^เลขที่?พนักงาน/,/\b(emp(loyee)?[ _-]?)?(code|id|no)\b/i]],
  ['name','ชื่อ-นามสกุล',     [/^ชื่อ/,/^นาม/,/\bname\b/i]],
  ['gender','เพศ',           [/^เพศ/,/\b(gender|sex)\b/i]],
  ['nationality','สัญชาติ',   [/^สัญชาติ/,/\bnationality\b/i]],
  ['position','ตำแหน่ง',      [/^ตำแหน่ง/,/\b(position|job ?title|title)\b/i]],
  ['phone','เบอร์โทร',        [/เบอร์|โทรศัพท์|^โทร/,/\b(phone|mobile|tel)\b/i]],
  ['dept','แผนก',            [/^แผนก/,/^ฝ่าย/,/\b(dept|department)\b/i]],
  ['payType','ประเภท',        [/^ประเภท/,/\b(pay ?type|employment ?type)\b/i]],
  ['salary','ค่าจ้าง',        [/^ค่าจ้าง/,/^เงินเดือน/,/^ฐานเงินเดือน/,/\b(salary|wage|rate)\b/i]],
  ['startDate','วันเริ่มงาน',  [/เริ่มงาน|วันที่เริ่ม|วันเข้างาน/,/\b(start|hire)[ _-]?date\b/i]],
  ['resignDate','วันที่ลาออก', [/ลาออก|สิ้นสุด|พ้นสภาพ/,/\b(resign|end|termination)[ _-]?date\b/i]],
  ['resignReason','เหตุผลในการลาออก',[/เหตุผล.*ลาออก|สาเหตุ.*ออก/,/\b(resign|leaving|termination) ?reason\b/i]],
  ['resignNote','รายละเอียดการลาออก',[/รายละเอียด.*ลาออก/,/\bresign ?note\b/i]],
  ['taxId','เลขบัตรประชาชน',  [/บัตรประชาชน|ประจำตัวประชาชน|^เลขประจำตัว/,/\b(national ?id|id ?card|citizen)\b/i]],
  ['address','ที่อยู่',        [/^ที่อยู่/,/\baddress\b/i]],
  ['bank','ธนาคาร',          [/^ธนาคาร/,/\bbank$/i,/\bbank ?name\b/i]],
  ['bankNo','เลขที่บัญชี',    [/เลขที่?บัญชี|บัญชีธนาคาร/,/\b(account ?(no|number)|bank ?account)\b/i]],
  ['pvdRate','อัตรากสล.%',    [/กสล|สำรองเลี้ยงชีพ/,/\bpvd\b/i]],
  ['wfRate','กองทุนสงเคราะห์%',[/สงเคราะห์/,/\bwelfare\b/i]],
  ['noOT','คิดOT',           [/คิด ?ot/i,/^ot$/i]],
  ['shift','กะประจำ',        [/^กะ/,/\bshift\b/i]],
  ['otMaxDay','เพดานOT/วัน',  [/เพดาน ?ot/i,/\bot ?(max|cap)\b/i]]
];
const EMP_POS_ORDER=['code','name','gender','nationality','position','dept','payType','salary',
  'startDate','resignDate','taxId','address','bank','bankNo','pvdRate','wfRate','noOT','shift','otMaxDay'];
function normHead(s){
  return String(s||'').replace(/^\uFEFF/,'').replace(/[()（）]/g,' ')
    .replace(/[\s\u00A0._-]+/g,' ').trim();
}
/* คืน {map:{field:ดัชนีคอลัมน์}, unmatched:[ชื่อคอลัมน์ที่ไม่รู้จัก], byName:true/false} */
function mapEmpColumns(head){
  const cols=head.map(normHead);
  const map={}, taken=new Set();
  EMP_FIELDS.forEach(([field,,pats])=>{
    for(let i=0;i<cols.length;i++){
      if(taken.has(i) || !cols[i]) continue;
      if(pats.some(p=>p.test(cols[i]))){ map[field]=i; taken.add(i); return; }
    }
  });
  // ต้องเจออย่างน้อยรหัสกับชื่อ ถึงจะเชื่อว่าอ่านหัวตารางได้จริง
  if(map.code===undefined || map.name===undefined){
    const m={}; EMP_POS_ORDER.forEach((f,i)=>{ if(i<cols.length) m[f]=i; });
    return { map:m, unmatched:[], byName:false };
  }
  const unmatched=cols.map((t,i)=>({t,i})).filter(x=>x.t && !taken.has(x.i)).map(x=>x.t);
  return { map, unmatched, byName:true };
}
function empRecFromRow(c, map){
  // ถอด ="..." ที่ Excel ใส่ไว้ออกทุกช่อง แล้วค่อยใช้งาน
  const g=f=> map[f]===undefined ? '' : csvUnText(c[map[f]]);
  const num=f=> +String(g(f)).replace(/,/g,'') || 0;
  const gen=g('gender');
  const pvd=num('pvdRate');
  const otTxt=g('noOT');
  const rec={
    code:g('code'), name:g('name'),
    gender:/ชาย|^m(ale)?$/i.test(gen)?'M':/หญิง|^f(emale)?$/i.test(gen)?'F':'',

/* ---------- Baht text (อ่านจำนวนเงินเป็นไทย) ---------- */
function bahtText(n){
  n=Math.round((+n||0)*100)/100;
  const neg=n<0; n=Math.abs(n);
  const bt=Math.floor(n), st=Math.round((n-bt)*100);
  const readInt=(s)=>{
    const d=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
    const pos=['','สิบ','ร้อย','พัน','หมื่น','แสน','ล้าน'];
    if(s==='0') return '';
    let out='', L=s.length;
    for(let i=0;i<L;i++){ const dig=+s[i]; const p=(L-1-i)%6;
      if(dig!==0){
        if(p===1&&dig===1) out+='สิบ';
        else if(p===1&&dig===2) out+='ยี่สิบ';
        else if(p===0&&dig===1&&L>1&&out!=='') out+='เอ็ด';
        else out+=d[dig]+pos[p];
      }
      if((L-1-i)%6===0 && (L-1-i)!==0) out+='ล้าน';
    }
    return out;
  };
  let txt=(bt===0?'ศูนย์':readInt(String(bt)))+'บาท';
  txt += st===0 ? 'ถ้วน' : readInt(String(st))+'สตางค์';
  return (neg?'ลบ':'')+txt;
}
