<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเงินเดือน Payroll</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --brand:#2563eb; --brand-d:#1d4ed8;
    --good:#059669; --bad:#dc2626; --warn:#d97706;
    --chip:#eef2ff; --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Segoe UI",Tahoma,"Sarabun",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  h1,h2,h3{margin:0}
  a{color:var(--brand);text-decoration:none}
  button{font-family:inherit;font-size:14px;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}

  /* Layout */
  .app{display:flex;min-height:100vh}
  .side{width:230px;background:#0f172a;color:#cbd5e1;flex-shrink:0;display:flex;flex-direction:column}
  .side .brand{padding:18px 18px 12px;font-size:18px;font-weight:700;color:#fff;letter-spacing:.3px}
  .side .brand small{display:block;font-weight:400;font-size:12px;color:#94a3b8;margin-top:2px}
  .nav{display:flex;flex-direction:column;padding:8px}
  .nav button{background:none;border:0;color:#cbd5e1;text-align:left;padding:11px 14px;border-radius:8px;display:flex;gap:10px;align-items:center;transition:.15s}
  .nav button:hover{background:#1e293b;color:#fff}
  .nav button.active{background:var(--brand);color:#fff;font-weight:600}
  .nav .ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .nav button.active .ico{box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .side .foot{margin-top:auto;padding:14px;font-size:11px;color:#64748b;border-top:1px solid #1e293b}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
  .top h1{font-size:19px}
  .top .period{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--chip);padding:6px 10px;border-radius:8px}
  .top .period label{font-size:12px;color:var(--muted)}
  .content{padding:24px;max-width:1200px;width:100%}

  /* Buttons */
  .btn{background:var(--brand);color:#fff;border:0;padding:9px 15px;border-radius:8px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
  .btn:hover{background:var(--brand-d)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:#f9fafb}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.danger{background:var(--bad)}
  .btn.good{background:var(--good)}
  .icon-btn{background:none;border:0;padding:4px 6px;border-radius:6px;color:var(--muted)}
  .icon-btn:hover{background:#f1f5f9;color:var(--ink)}

  /* Cards & KPI */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .kpi .val{font-size:26px;font-weight:700;margin-top:6px}
  .kpi .val.money{font-variant-numeric:tabular-nums}
  .kpi.b1{border-top:3px solid var(--brand)}
  .kpi.b2{border-top:3px solid var(--good)}
  .kpi.b3{border-top:3px solid var(--warn)}
  .kpi.b4{border-top:3px solid var(--bad)}
  .kpi.b5{border-top:3px solid #7c3aed}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
  .panel .phead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .panel .phead h2{font-size:16px}
  .panel .phead .sp{margin-left:auto;display:flex;gap:8px}
  .panel .pbody{padding:18px}

  /* Tables */
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0}
  tbody tr:hover{background:#f9fafb}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tbl-wrap{overflow-x:auto}
  tfoot td{font-weight:700;background:#f8fafc;border-top:2px solid var(--line)}
  .muted{color:var(--muted)}
  .chip{display:inline-block;background:var(--chip);color:var(--brand-d);padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .pos{color:var(--good)} .neg{color:var(--bad)}

  /* Forms / modal */
  .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 16px;overflow:auto}
  .backdrop.on{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal .mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .modal .mhead h3{font-size:17px}
  .modal .mbody{padding:20px;max-height:70vh;overflow:auto}
  .modal .mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .field input:focus,.field select:focus{outline:2px solid var(--brand);border-color:var(--brand)}
  .sec-title{font-size:13px;font-weight:700;color:var(--brand-d);margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .sec-title:first-child{margin-top:0}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px}
  .search::before{content:"🔍";position:absolute;left:11px;top:9px;opacity:.5}

  .empty{text-align:center;padding:40px;color:var(--muted)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:100;opacity:0;transition:.3s;pointer-events:none}
  .toast.on{opacity:1}

  /* Print documents */
  .doc{background:#fff;color:#000;font-family:"Sarabun","TH Sarabun New",Tahoma,serif}
  @media print{
    .side,.top,.no-print{display:none!important}
    body{background:#fff;font-size:12pt}
    .content{padding:0;max-width:none}
    .doc{box-shadow:none!important;border:0!important;margin:0!important;page-break-after:always}
    .doc:last-child{page-break-after:auto}
    @page{size:A4;margin:12mm}
  }
  .print-area .doc{max-width:800px;margin:0 auto 24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:34px 40px;border-radius:6px}
  /* เอกสารขนาด A4 เต็มหน้า (เช่น 50 ทวิ) */
  .print-area .doc.a4{width:210mm;max-width:210mm;min-height:297mm;padding:9mm 11mm;box-sizing:border-box;font-size:10.5px}
  /* บีบตารางให้พอดี 1 หน้า A4 */
  .print-area .doc.a4 table.dtbl th,.print-area .doc.a4 table.dtbl td{padding:1.5px 6px;font-size:9.5px;line-height:1.2}
  .print-area .doc.a4 h2.dt{font-size:16px}
  /* แบบ กท.20 ก — บีบให้พอดี 1 หน้า A4 */
  .doc.kt20{font-size:10.5px;line-height:1.28}
  .print-area .doc.kt20 table.dtbl th,.print-area .doc.kt20 table.dtbl td{padding:2px 5px;font-size:9.5px;line-height:1.25}
  .doc.kt20 table.kt20m tbody td{height:19px}
  @media print{ .doc.a4{width:auto!important;max-width:none!important;min-height:0!important;padding:0!important} }
  .doc h2.dt{text-align:center;font-size:18px;margin-bottom:4px}
  .doc .company{text-align:center;margin-bottom:16px}
  .doc .company .cn{font-size:16px;font-weight:700}
  .doc table.dtbl{border:1px solid #333}
  .doc table.dtbl th,.doc table.dtbl td{border:1px solid #999;padding:6px 9px;white-space:normal}
  .doc table.dtbl th{background:#f0f0f0;color:#000}
  .doc .row2{display:flex;justify-content:space-between;gap:20px}
  .doc .sign{margin-top:40px;display:flex;justify-content:space-around;text-align:center}
  .doc .sign div{width:45%}
  .doc .line{border-bottom:1px dotted #555;height:20px;margin-bottom:4px}
  .settings-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .settings-row label{width:200px;color:var(--muted)}
  .segbtn{background:none;border:0;padding:8px 16px;border-radius:8px;font-weight:600;color:var(--muted)}
  .segbtn.on{background:#fff;color:var(--brand-d);box-shadow:var(--shadow)}
  /* ปุ่มเมนู (มือถือ) + ฉากหลังทับตอนเปิด drawer */
  .menuBtn{display:none;background:none;border:1px solid var(--line);border-radius:9px;width:42px;height:42px;font-size:20px;line-height:1;color:var(--ink);flex-shrink:0}
  .menuBtn:active{background:#f1f5f9}
  .sideOverlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:29}
  .sideOverlay.on{display:block}

  /* ===== iPad / จอกลาง : เมนูเหลือไอคอน ===== */
  @media(max-width:1024px){
    .side{width:68px}
    .side .brand{font-size:0;padding:16px 0;text-align:center}
    .side .brand small{display:none}
    .nav button{justify-content:center;padding:11px 8px}
    .nav button span.t{display:none}
    .side .foot{font-size:0;padding:10px 6px;text-align:center}
    .content{padding:18px}
    .grid3{grid-template-columns:1fr 1fr}
    .dash2{grid-template-columns:1fr!important}
  }

  /* ===== มือถือ : เมนูเป็น drawer เลื่อนออกมา ===== */
  @media(max-width:720px){
    .menuBtn{display:flex;align-items:center;justify-content:center}
    .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:30;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto}
    .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.45)}
    .side .brand{font-size:18px;padding:18px 18px 12px;text-align:left}
    .side .brand small{display:block}
    .nav button{justify-content:flex-start;padding:13px 14px}
    .nav button span.t{display:inline}
    .side .foot{font-size:11px;padding:14px;text-align:left}
    .top{padding:10px 14px;gap:8px;flex-wrap:wrap}
    .top h1{font-size:17px}
    .period{width:100%;order:3;margin-left:0}
    .period select{flex:1;min-width:0}
    .content{padding:14px}
    .cards{grid-template-columns:1fr 1fr;gap:10px}
    .kpi{padding:13px 14px}
    .kpi .val{font-size:21px}
    .grid2,.grid3{grid-template-columns:1fr}
    .toolbar{gap:8px}
    .modal{max-width:100%}
    .modal .mbody{max-height:65vh}
    .backdrop{padding:12px}
    th,td{padding:9px 10px}
    .seg{width:100%;overflow-x:auto}
    .segbtn{white-space:nowrap;flex-shrink:0}
    .print-area .doc{padding:18px 16px}
    .print-area .doc.a4{width:100%;max-width:100%;min-height:0;padding:16px 14px;font-size:11px}
  }
  /* จอเล็กมาก : การ์ดเรียงเดียว */
  @media(max-width:430px){ .cards{grid-template-columns:1fr} }

  /* มือถือ/แท็บเล็ต: ช่องกรอกอย่างน้อย 16px กัน iOS ซูมเอง + ปุ่มกดง่าย */
  @media(max-width:1024px){
    input,select,textarea{font-size:16px}
    .btn{padding:11px 16px}
    .icon-btn{padding:8px 10px;font-size:16px}
  }
</style>

  <div class="sideOverlay no-print" id="sideOverlay"></div>

  if(!cut) return {from:new Date(y,m-1,1), to:new Date(y,m,0)};

const EARN_FIELDS = [['ot','ค่าล่วงเวลา (OT)','Overtime (OT)'],['commission','ค่าคอมมิชชั่น','Commission'],['diligence','ค่าเบี้ยขยัน','Diligence Allowance'],['travel','ค่าเดินทาง','Travel Allowance'],['position','ค่าตำแหน่ง','Position Allowance'],['bonus','โบนัส','Bonus'],['other','อื่นๆ','Other']];
const DED_FIELDS = [['tax','ภาษีเงินได้','Income Tax'],['sso','ประกันสังคม','Social Security'],['pvd','กองทุนสำรองเลี้ยงชีพ','Provident Fund'],['loan','เงินกู้บริษัท','Company Loan'],['studentloan','กยศ.','Student Loan (SLF)'],['other','อื่นๆ','Other']];
// ป้ายรายการตามภาษา (f = [key, th, en])
function FL(f){ return (LANG==='en' && f[2]) ? f[2] : f[1]; }

function ensurePeriod(p){ if(!DB.payroll[p]) DB.payroll[p]={}; return DB.payroll[p]; }
function blankRec(){ return { earn:{ot:0,commission:0,diligence:0,travel:0,position:0,bonus:0,other:0}, ded:{tax:0,sso:0,pvd:0,loan:0,studentloan:0,other:0} }; }
// getRec: สำหรับ "แก้ไข" — สร้างเรคคอร์ดจริงถ้ายังไม่มี
function getRec(p, empId){
  const pp = ensurePeriod(p);
  if(!pp[empId]) pp[empId] = blankRec();
  return pp[empId];
}
// readRec: สำหรับ "อ่าน/คำนวณ" — ไม่สร้างข้อมูลขยะ คืนค่าว่างถ้ายังไม่มี
function readRec(p, empId){
  const pp = DB.payroll[p];
  return (pp && pp[empId]) ? pp[empId] : blankRec();
}
function autoSSO(wage){ return Math.round(Math.min(wage, DB.ssoMaxBase) * DB.ssoRate/100); } // ปัดเป็นจำนวนเต็มบาท
function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }
// เงินเดือนตามสัดส่วน (prorate) — อิงช่วงงวดจ่ายตามวันตัดรอบ + วันเริ่มงาน/ลาออก
function prorate(emp, p){
  if(!p || emp.payType==='daily') return {partial:false, factor:1};   // รายวันคิดจากจำนวนวันจริง
  const {from,to}=periodRange(p);
  const DAY=86400000, total=Math.round((to-from)/DAY)+1;
  let eStart=from, eEnd=to;
  if(emp.startDate){ const [y,m,d]=emp.startDate.split('-').map(Number); const S=new Date(y,m-1,d); if(S>eStart) eStart=S; }
  if(emp.resignDate){ const [y,m,d]=emp.resignDate.split('-').map(Number); const R=new Date(y,m-1,d); if(R<eEnd) eEnd=R; }
  if(eStart>eEnd) return {partial:true, factor:0, worked:0, dim:total, from, to};   // ไม่ได้ทำงานในงวดนี้
  const worked=Math.round((eEnd-eStart)/DAY)+1;
  if(worked>=total) return {partial:false, factor:1};                 // ทำงานเต็มงวด
  return {partial:true, factor:worked/total, worked, dim:total, from, to};
}
// ค่าจ้างฐานของงวด: รายเดือน = เงินเดือน (prorate เดือนแรก) · รายวัน = ค่าจ้าง/วัน × จำนวนวันทำงาน
function basePay(emp, rec, p){
  if(emp.payType==='daily'){
    if(resignedBefore(emp, p)) return 0;                 // ลาออกไปก่อนงวดนี้แล้ว
    return Number(emp.salary||0) * Number((rec&&rec.days)||0);
  }
  const sal=Number(emp.salary||0);
  const pr=prorate(emp, p);
  return Math.round(sal*pr.factor*100)/100;
}
// ลาออกก่อนงวดนี้เริ่มหรือไม่ (ทั้งงวดอยู่หลังวันลาออก)
function resignedBefore(emp, p){
  if(!emp.resignDate || !p) return false;
  const {from}=periodRange(p);
  const [y,m,d]=emp.resignDate.split('-').map(Number);
  return new Date(y,m-1,d) < from;
}
// คำนวณเงินหักอัตโนมัติ (ประกันสังคม + กสล. + ภาษี) จากค่าจ้างฐาน/เงินได้ของงวด
function autoDeductions(emp, rec){
  const m = rec.manual || {};      // ช่องที่ผู้ใช้แก้เอง — ไม่เขียนทับ
  const base = basePay(emp, rec, PERIOD);
  if(!m.sso) rec.ded.sso = ssoExempt(emp) ? 0 : autoSSO(ssoWage(emp, rec, PERIOD));   // กรรมการ = ไม่หัก ปกส.
  if(!m.pvd) rec.ded.pvd = Math.round(base * (emp.pvdRate||0)/100);
  if(!m.tax) rec.ded.tax = estTax(emp, +PERIOD.split('-')[0], rec).monthly;           // ภาษีหัก ณ ที่จ่าย/เดือน
  save();
}
function setManualDed(rec, key, val){ rec.manual=rec.manual||{}; rec.manual[key]=1; rec.ded[key]=val; }
function clearManualDed(emp, rec, key){ if(rec.manual) delete rec.manual[key]; autoDeductions(emp, rec); }
/* ---------- ค่าจ้างตามนิยามประกันสังคม (ใช้ร่วมกันทั้ง สปส.1-10 และ กท.20 ก) ----------
   = ค่าจ้างฐาน + ค่าตอบแทนประจำ  (ไม่รวมค่าล่วงเวลาและโบนัส)                        */
const SSO_WAGE_KEYS=['commission','diligence','travel','position','other'];
function ssoWage(emp, rec, p){
  const r = rec || readRec(p||PERIOD, emp.id);
  return basePay(emp, r, p||PERIOD) + SSO_WAGE_KEYS.reduce((s,k)=>s+Number(r.earn[k]||0),0);
}
// ยกเว้นประกันสังคม — กรรมการ (ไม่ใช่ลูกจ้างตาม ม.33) หรือกาช่องยกเว้นเอง
function ssoExempt(emp){
  if(emp.noSSO) return true;
  return /กรรมการ|director/i.test(String(emp.position||''));
}
// ค่าจ้างต่อเดือนโดยประมาณ (ใช้คำนวณ ปกส./กสล./ภาษี) — รายวันใช้จำนวนวันจริง ถ้าไม่มีใช้ค่าเริ่มต้น
function monthlyWage(emp, rec){
  if(emp.payType==='daily'){ const d=Number((rec&&rec.days)||0)||(DB.workDaysDefault||26); return Number(emp.salary||0)*d; }
  return Number(emp.salary||0);
}
// อัตรา OT ต่อชั่วโมง: รายเดือน = เงินเดือน÷วัน÷ชม. · รายวัน = ค่าจ้าง/วัน÷ชม.
function otRate(emp){
  const h=DB.otHours||8;
  if(emp && emp.payType==='daily') return Number(emp.salary||0)/h;
  const d=DB.otDays||30; return Number((emp&&emp.salary)||0)/d/h;
}
function otAmount(emp,hours,mult){ return Math.round(otRate(emp)*Number(hours||0)*Number(mult||0)*100)/100; }

// ภาษีเงินได้บุคคลธรรมดา — อัตราก้าวหน้า (ขั้นบันได)
const TAX_BRACKETS=[[150000,0],[300000,.05],[500000,.10],[750000,.15],[1000000,.20],[2000000,.25],[5000000,.30],[Infinity,.35]];
function progressiveTax(net){
  let tax=0, low=0;
  for(const [cap,rate] of TAX_BRACKETS){ if(net<=low) break; tax+=(Math.min(net,cap)-low)*rate; low=cap; }
  return Math.round(tax*100)/100;
}
// จำนวนเดือนที่ทำงานในปีภาษี (คำนึงถึงวันเริ่มงาน)
function monthsEmployedInYear(emp, year){
  let startM=1, endM=12;
  if(emp.startDate){ const [sy,sm]=emp.startDate.split('-').map(Number); if(sy>year) return 0; if(sy===year) startM=sm; }
  if(emp.resignDate){ const [ry,rm]=emp.resignDate.split('-').map(Number); if(ry<year) return 0; if(ry===year) endM=rm; }
  return Math.max(0, endM - startM + 1);   // นับจากเดือนเริ่ม → เดือนลาออก (หรือ ธ.ค.)
}
// ประมาณการภาษีหัก ณ ที่จ่ายรายเดือน (อิงเงินได้ทั้งหมด + จำนวนเดือนที่ทำงานจริงในปีภาษี)
function estTax(emp, year, rec){
  year = year || new Date().getFullYear();
  const months=monthsEmployedInYear(emp, year);              // เดือนที่ทำงานในปีภาษี
  const earn = (rec && rec.earn) || {};
  const wage = monthlyWage(emp, rec);                        // ค่าจ้าง/เดือน (รายวัน = ค่าจ้าง×วัน)
  // เงินได้ประจำ (คูณตามเดือน): ค่าจ้างฐาน + OT + คอม + เบี้ยขยัน + ค่าเดินทาง + ค่าตำแหน่ง + อื่นๆ
  const recurringMonthly = wage
    + ['ot','commission','diligence','travel','position','other'].reduce((s,k)=>s+Number(earn[k]||0),0);
  const bonus = Number(earn.bonus||0);                       // โบนัส = จ่ายครั้งเดียว บวกครั้งเดียว
  const inc=recurringMonthly*months + bonus;                 // เงินได้ทั้งปี (รวมเงินได้ทุกประเภท)
  const expense=Math.min(inc*0.5,100000);                    // ค่าใช้จ่าย 50% สูงสุด 100,000
  const personal=60000;                                      // ลดหย่อนส่วนตัว (ไม่เฉลี่ยตามเดือน)
  const spouse=(+emp.spouse)?60000:0;                        // คู่สมรส
  const children=(Number(emp.children||0))*30000;            // บุตรคนละ 30,000
  const ssoCap=autoSSO(DB.ssoMaxBase)*12;                     // เพดาน ปกส./ปี = 875 × 12 = 10,500
  const sso=Math.min(autoSSO(wage)*months, ssoCap);          // ประกันสังคม (ตามเดือนจริง)
  const pvd=Math.min(wage*(emp.pvdRate||0)/100*months,500000); // กสล.
  const other=Number(emp.otherAllow||0);                     // ลดหย่อนอื่น
  const totalDed=expense+personal+spouse+children+sso+pvd+other;
  const net=Math.max(0,inc-totalDed);                        // เงินได้สุทธิ (ฐานภาษี)
  const annual=progressiveTax(net);
  const monthly=months>0 ? Math.round(annual/months*100)/100 : 0; // เฉลี่ยตามเดือนที่ทำงาน
  return {months,recurringMonthly,bonus,inc,expense,personal,spouse,children,sso,pvd,other,totalDed,net,annual,monthly};
}
function calc(emp, p){
  const r = readRec(p, emp.id);
  const base = basePay(emp, r, p);
  const earnTotal = EARN_FIELDS.reduce((s,[k])=>s+Number(r.earn[k]||0),0);
  const gross = base + earnTotal;                 // รายได้รวม
  const dedTotal = DED_FIELDS.reduce((s,[k])=>s+Number(r.ded[k]||0),0);
  const net = gross - dedTotal;                   // เงินสุทธิ
  return {base, earnTotal, gross, dedTotal, net, r};
}
function periodTotals(p){
  const [py,pm]=p.split('-').map(Number);
  let salary=0, earn=0, gross=0, ded=0, net=0, tax=0, count=0;
  DB.employees.forEach(e=>{ const c=calc(e,p); salary+=c.base; earn+=c.earnTotal; gross+=c.gross; ded+=c.dedTotal; net+=c.net; tax+=Number(readRec(p,e.id).ded.tax||0);
    if(activeInMonth(e,py,pm)) count++; });   // นับเฉพาะพนักงานที่ยังทำงานในงวดนี้
  return {count, salary, earn, gross, ded, net, tax};
}

/* ---------- ข้อมูลค่าจ้างรายเดือนสำหรับ กท.20 ก ----------
   ค่าจ้างตามกฎหมายประกันสังคม = ค่าจ้างฐาน + ค่าตอบแทนประจำ
   (ไม่รวมค่าล่วงเวลาและโบนัส ตามหมายเหตุในแบบฟอร์ม)                    */
const KT20_CAP=20000;   // เพดานค่าจ้างที่ต้องแจ้ง 20,000/คน/เดือน
// ดึงยอดของเดือนนั้นจากข้อมูลประกันสังคมรายเดือน (ฐานเดียวกับ สปส. 1-10)
function kt20Month(year, m){
  const p=`${year}-${String(m).padStart(2,'0')}`;
  let count=0, salary=0, daily=0, other=0, excess=0, ot=0, bonus=0, sso=0;
  DB.employees.forEach(e=>{
    if(!activeInMonth(e,year,m)) return;
    if(ssoExempt(e)) return;                     // กรรมการ ไม่นับในแบบประกันสังคม
    const r=readRec(p,e.id);
    const base=basePay(e,r,p);
    const oth=SSO_WAGE_KEYS.reduce((s,k)=>s+Number(r.earn[k]||0),0);
    const wage=ssoWage(e,r,p);                   // = base + oth (ค่าจ้าง ปกส. ของคนนี้เดือนนี้)
    if(wage<=0) return;
    count++;
    if(e.payType==='daily') daily+=base; else salary+=base;
    other+=oth;
    excess+=Math.max(0, wage-KT20_CAP);          // ส่วนที่เกินเพดาน (คิดรายคน)
    sso+=Number(r.ded.sso||0);                   // เงินสมทบที่นำส่งเดือนนั้น
    ot+=Number(r.earn.ot||0); bonus+=Number(r.earn.bonus||0);
  });
  const total=salary+daily+other;
  return {count, salary, daily, other, total, excess, net:total-excess, ot, bonus, sso};
}
function kt20Year(year){
  const months=Array.from({length:12},(_,i)=>kt20Month(year,i+1));
  const sum=months.reduce((a,b)=>({count:0,salary:a.salary+b.salary,daily:a.daily+b.daily,other:a.other+b.other,
    total:a.total+b.total,excess:a.excess+b.excess,net:a.net+b.net,ot:a.ot+b.ot,bonus:a.bonus+b.bonus,sso:a.sso+b.sso}),
    {salary:0,daily:0,other:0,total:0,excess:0,net:0,ot:0,bonus:0,sso:0});
  sum.count=Math.max(0,...months.map(x=>x.count));    // จำนวนลูกจ้างสูงสุดในปี
  // ค่าจ้างต่ำสุด
  const monthlyEmps=DB.employees.filter(e=>(e.payType||'monthly')==='monthly'&&+e.salary>0);
  const dailyEmps=DB.employees.filter(e=>e.payType==='daily'&&+e.salary>0);
  sum.minMonthly = monthlyEmps.length?Math.min(...monthlyEmps.map(e=>+e.salary)):0;
  sum.minDaily   = dailyEmps.length?Math.min(...dailyEmps.map(e=>+e.salary)):0;
  return {months, sum};
}

let dashMode = 'month'; // 'month' | 'year'
const C = {brand:'#2563eb',brandL:'#93c5fd',green:'#059669',greenL:'#6ee7b7',red:'#dc2626',warn:'#d97706',purple:'#7c3aed',slate:'#94a3b8'};

function periodHasData(p){ const pp=DB.payroll[p]; return !!(pp && Object.keys(pp).length); }
// พนักงานคนนี้ทำงานอยู่ในเดือนนี้หรือไม่ (ตามวันเริ่มงาน)
function activeInMonth(emp, year, month){
  if(emp.startDate){ const [sy,sm]=emp.startDate.split('-').map(Number); if(sy>year||(sy===year&&sm>month)) return false; }
  if(emp.resignDate){ const [ry,rm]=emp.resignDate.split('-').map(Number); if(ry<year||(ry===year&&rm<month)) return false; }
  return true;
}
// คำนวณยอดรวมของเดือน (ประมาณการทั้งปี: ใช้ค่าที่กรอกจริงถ้ามี ไม่งั้นใช้เงินเดือนฐาน) เคารพวันเริ่มงาน
function monthCompute(year, m){
  const p=`${year}-${String(m).padStart(2,'0')}`;
  const emps=DB.employees.filter(e=>activeInMonth(e,year,m));
  let salary=0,earn=0,gross=0,ded=0,net=0,tax=0;
  const depts={};
  emps.forEach(e=>{ const c=calc(e,p);
    salary+=c.base; earn+=c.earnTotal; gross+=c.gross; ded+=c.dedTotal; net+=c.net; tax+=Number(readRec(p,e.id).ded.tax||0);
    const d=e.dept||'(ไม่ระบุ)'; const o=depts[d]=depts[d]||{dept:d,count:0,salary:0,gross:0,ded:0,net:0};
    o.count++; o.salary+=c.base; o.gross+=c.gross; o.ded+=c.dedTotal; o.net+=c.net; });
  return {p, count:emps.length, salary, earn, gross, ded, net, tax, depts};
}
function monthSeries(year, curM){
  const out=[];
  for(let m=1;m<=12;m++){ const mc=monthCompute(year,m);
    out.push({label:THAI_MONTHS_ABBR[m-1], value:mc.net, gross:mc.gross, ded:mc.ded, salary:mc.salary, active:m===curM, has:mc.count>0, entered:periodHasData(mc.p)});
  }
  return out;
}
function yearTotals(year){
  let salary=0,earn=0,gross=0,ded=0,net=0,tax=0,entered=0;
  for(let m=1;m<=12;m++){ const mc=monthCompute(year,m);
    salary+=mc.salary; earn+=mc.earn; gross+=mc.gross; ded+=mc.ded; net+=mc.net; tax+=mc.tax;
    if(periodHasData(mc.p)) entered++; }
  const count=DB.employees.filter(e=>activeInMonth(e,year,12)).length;
  return {count, salary, earn, gross, ded, net, tax, entered};
}
function deptSummaryYear(year){
  const map={};
  for(let m=1;m<=12;m++){ const mc=monthCompute(year,m);
    Object.values(mc.depts).forEach(d=>{ const o=map[d.dept]=map[d.dept]||{dept:d.dept,count:0,salary:0,gross:0,ded:0,net:0};
      o.gross+=d.gross; o.ded+=d.ded; o.net+=d.net; o.salary+=d.salary; o.count=Math.max(o.count,d.count); }); }
  return Object.values(map).sort((a,b)=>a.dept.localeCompare(b.dept,'th'));
}

/* ---- SVG charts (self-contained) ---- */
function barChart(items,{color=C.brand,clickable=false,height=300}={}){
  const W=960,H=300,padT=22,padB=30,padL=14,padR=14;
  const innerH=H-padT-padB, innerW=W-padL-padR, n=items.length||1, slot=innerW/n;
  const max=Math.max(1,...items.map(i=>i.value));
  const cursor = clickable ? 'cursor:pointer' : '';
  let g='';
  for(let i=1;i<=4;i++){ const y=padT+innerH-(innerH*i/4); g+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#eef1f5" stroke-width="1"/>`; }
  items.forEach((it,i)=>{
    const hasVal = it.has!==false && it.value>0;
    const bh = hasVal ? (it.value/max)*innerH : 4;       // แท่งจางสำหรับเดือนที่ยังไม่มีข้อมูล
    const bw=slot*0.6, x=padL+i*slot+(slot-bw)/2, y=padT+innerH-bh;
    const fill = it.active ? C.brand : (hasVal ? color : '#e2e8f0');
    const cx=padL+i*slot+slot/2;
    // พื้นที่คลิกทั้งช่อง (โปร่งใส) เพื่อกดง่าย
    if(clickable) g+=`<rect x="${padL+i*slot}" y="${padT}" width="${slot}" height="${innerH}" fill="transparent" data-i="${i}" style="cursor:pointer"><title>${it.label}: ${money(it.value)}</title></rect>`;
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,bh)}" rx="4" fill="${fill}" data-i="${i}" style="${cursor}"><title>${it.label}: ${money(it.value)}</title></rect>`;
    if(hasVal) g+=`<text x="${x+bw/2}" y="${y-6}" font-size="13" text-anchor="middle" fill="#374151">${shortMoney(it.value)}</text>`;
    g+=`<text x="${cx}" y="${H-10}" font-size="13" text-anchor="middle" fill="${it.active?'#2563eb':'#6b7280'}" font-weight="${it.active?'700':'400'}">${it.label}</text>`;
  });
  g+=`<line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#cbd5e1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:${height}px;overflow:visible">${g}</svg>`;
}
function donutChart(segments){
  const segs=segments.filter(s=>s.value>0);
  const total=segs.reduce((s,x)=>s+x.value,0);
  const cx=95,cy=95,R=80,r=52;
  let paths='';
  if(total<=0){ paths=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="#e5e7eb" stroke-width="${R-r}"/>`; }
  else if(segs.length===1){ paths=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${segs[0].color}" stroke-width="${R-r}"/>`; }
  else { let a=-Math.PI/2;
    segs.forEach(s=>{ const frac=s.value/total, a2=a+frac*2*Math.PI, large=frac>0.5?1:0;
      const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
      const xi1=cx+r*Math.cos(a2),yi1=cy+r*Math.sin(a2),xi2=cx+r*Math.cos(a),yi2=cy+r*Math.sin(a);
      paths+=`<path d="M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} L${xi1} ${yi1} A${r} ${r} 0 ${large} 0 ${xi2} ${yi2} Z" fill="${s.color}"><title>${s.label}: ${money(s.value)}</title></path>`;
      a=a2; });
  }
  return `<svg viewBox="0 0 190 190" style="width:190px;height:190px">${paths}
    <text x="${cx}" y="${cy-4}" font-size="13" text-anchor="middle" fill="#6b7280">รวมรายได้</text>
    <text x="${cx}" y="${cy+16}" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">${shortMoney(total)}</text></svg>`;
}
function legend(items){
  return `<div style="display:flex;flex-direction:column;gap:10px">${items.filter(i=>i.value>0||i.always).map(i=>`
    <div style="display:flex;align-items:center;gap:8px">
      <span style="width:12px;height:12px;border-radius:3px;background:${i.color};flex-shrink:0"></span>
      <span style="flex:1">${i.label}</span>
      <strong class="money">${money(i.value)}</strong>
    </div>`).join('')}</div>`;
}

    <td class="num">${money(e.salary)} <span class="muted" style="font-size:11px">${daily?tr('per_day'):tr('per_month')}</span></td>
    <td>${esc(fmtDate(e.startDate))}</td>

      <button class="icon-btn" title="แก้ไข" data-ed="${e.id}">✏️</button>
      <button class="icon-btn" title="ลบ" data-del="${e.id}">🗑️</button>
    </td></tr>`;}).join('');
  const tbl = el(`<table>
    <thead><tr><th>${tr('th_code')}</th><th>${tr('th_name')}</th><th>${tr('th_position')}</th><th>${tr('th_dept')}</th><th>${tr('th_type')}</th><th class="num">${tr('th_wage')}</th><th>${tr('th_start')}</th><th></th></tr></thead>
    <tbody>${rows||`<tr><td colspan="8" class="empty">${tr('emp_not_found')}</td></tr>`}</tbody>

  tbl.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delEmp(b.dataset.del));

}

  if(g==='F') return '<span title="หญิง" style="display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:#fce7f3;color:#db2777;font-weight:700;margin-right:7px;font-size:13px">♀</span>';
  return '<span title="ไม่ระบุ" style="display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:#f1f5f9;color:#94a3b8;margin-right:7px;font-size:13px">–</span>';
}

  $('#f_code').oninput=(ev)=>{

function nextCode(){
  const used=new Set(DB.employees.map(e=>String(e.code||'').trim().toLowerCase()));
  const nums = DB.employees.map(e=>{ const m=String(e.code).match(/(\d+)/); return m?+m[1]:0; });
  let n=Math.max(0,...nums)+1, code;
  do{ code='EMP'+String(n).padStart(3,'0'); n++; } while(used.has(code.toLowerCase()));  // กันชนซ้ำ
  return code;
}

/* ============ 2. PAYROLL (earnings/deductions per employee) ============ */
let payrollEmpId=null, payrollFilter='all';
function vPayroll(v){
  if(DB.employees.length===0){ v.appendChild(el(`<div class="panel"><div class="pbody empty">ยังไม่มีพนักงาน</div></div>`)); return; }
  // เฉพาะพนักงานที่ยังทำงานในงวดนี้ (คนลาออกแล้วไม่แสดง) + กรองตามประเภทการจ้าง
  const [py,pm]=PERIOD.split('-').map(Number);
  const active=DB.employees.filter(e=>activeInMonth(e,py,pm));
  const list=active.filter(e=> payrollFilter==='all' || (e.payType||'monthly')===payrollFilter);
  const mCount=active.filter(e=>(e.payType||'monthly')==='monthly').length, dCount=active.filter(e=>e.payType==='daily').length;

  // ปุ่มสลับ ทั้งหมด / รายเดือน / รายวัน
  const seg=el(`<div class="toolbar" style="margin-bottom:6px">
    <div class="seg" style="display:inline-flex;background:#eef2ff;border-radius:10px;padding:3px">
      <button class="segbtn ${payrollFilter==='all'?'on':''}" data-f="all">ทั้งหมด (${active.length})</button>
      <button class="segbtn ${payrollFilter==='monthly'?'on':''}" data-f="monthly">📅 รายเดือน (${mCount})</button>
      <button class="segbtn ${payrollFilter==='daily'?'on':''}" data-f="daily">🗓️ รายวัน (${dCount})</button>
    </div>
  </div>`);
  v.appendChild(seg);
  seg.querySelectorAll('.segbtn').forEach(b=>b.onclick=()=>{ payrollFilter=b.dataset.f; payrollEmpId=null; render(); });

  if(list.length===0){ v.appendChild(el(`<div class="panel"><div class="pbody empty">ไม่มีพนักงาน${payrollFilter==='daily'?'รายวัน':payrollFilter==='monthly'?'รายเดือน':''}ในงวด ${periodLabel(PERIOD)}</div></div>`)); return; }
  if(payrollEmpId!=='ALL' && (!payrollEmpId || !list.find(e=>e.id===payrollEmpId))) payrollEmpId=list[0].id;
  const isAll = payrollEmpId==='ALL';

  const tb=el(`<div class="toolbar">
    <div class="field" style="min-width:280px"><label>เลือกพนักงาน</label>
      <select id="peSel"><option value="ALL" ${isAll?'selected':''}>— ทั้งหมด (${list.length} คน) —</option>${list.map(e=>`<option value="${e.id}" ${e.id===payrollEmpId?'selected':''}>${esc(e.code)} — ${esc(e.name)}${e.payType==='daily'?' (รายวัน)':''}</option>`).join('')}</select>
    </div>
    ${isAll?'':`<button class="btn ghost sm" id="autoTax" style="margin-top:22px">🔍 ดูวิธีคำนวณภาษี</button>`}
    <button class="btn ghost sm" id="peCsv" style="margin-top:22px">⬇️ ส่งออก CSV</button>
  </div>`);
  v.appendChild(tb);
  tb.querySelector('#peSel').onchange=(e)=>{ payrollEmpId=e.target.value; render(); };
  tb.querySelector('#peCsv').onclick=()=>exportPayrollCSV(list);
  if(isAll){ vPayrollAll(v, list); return; }

  const emp=DB.employees.find(e=>e.id===payrollEmpId);
  const r=getRec(PERIOD, emp.id);
  // คำนวณประกันสังคม/กสล. อัตโนมัติ (ไม่ต้องกดปุ่ม)
  autoDeductions(emp, r);
  const c=calc(emp,PERIOD);
  const isDaily = emp.payType==='daily';
  tb.querySelector('#autoTax').onclick=()=>taxModal(emp,r);

  // พนักงานรายวัน: กล่องกรอกจำนวนวันทำงาน → ค่าจ้างฐาน
  const dayBlock = isDaily ? `<div class="field" style="grid-column:1/-1;background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:12px 14px;margin-bottom:14px">
    <label style="font-weight:700;color:#b45309">ค่าจ้างรายวัน — ค่าจ้าง/วัน × จำนวนวันทำงาน</label>
    <div class="grid3" style="margin-top:8px">
      <div class="field"><label>ค่าจ้าง/วัน</label><input value="${money(emp.salary)}" readonly style="background:#fef3c7;font-weight:600"></div>
      <div class="field"><label>จำนวนวันทำงาน</label><input type="number" step="0.5" id="workDays" value="${r.days||0}"></div>
      <div class="field"><label>ค่าจ้างฐาน (บาท)</label><input id="baseShow" value="${money(basePay(emp,r))}" readonly style="background:#eef2ff;font-weight:700"></div>
    </div></div>` : '';

  // พนักงานรายเดือนที่เข้างานกลางเดือน: คิดเงินเดือนตามสัดส่วน
  const pr = prorate(emp, PERIOD);
  const prorateBlock = (!isDaily && pr.partial) ? `<div class="field" style="grid-column:1/-1;background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:12px 14px;margin-bottom:14px">
    <label style="font-weight:700;color:#b45309">📅 เข้างานกลางเดือน — คิดเงินเดือนตามสัดส่วน (Prorate)</label>
    ${pr.factor>0
      ? `<div style="margin-top:6px;line-height:1.7">เริ่มงาน ${fmtDate(emp.startDate)} · งวด ${fmtD(pr.from)} – ${fmtD(pr.to)}<br>ทำงาน <strong>${pr.worked}</strong> วัน จาก ${pr.dim} วันในงวดนี้<br>
         เงินเดือน ${money(emp.salary)} × ${pr.worked}/${pr.dim} = <strong style="color:var(--brand-d);font-size:16px">${money(basePay(emp,r,PERIOD))}</strong> บาท</div>`
      : `<div style="margin-top:6px">พนักงานเริ่มงาน ${fmtDate(emp.startDate)} ซึ่งยังไม่ถึงงวดนี้ จึงยังไม่มีเงินเดือนในงวด ${periodLabel(PERIOD)}</div>`}
  </div>` : '';

  const earnRows=EARN_FIELDS.filter(([k])=>k!=='ot').map(([k,l])=>`<div class="field"><label>${l}</label><input type="number" step="0.01" data-earn="${k}" value="${r.earn[k]||0}"></div>`).join('');
  const rate=otRate(emp);
  const otRateLabel = isDaily ? `${money(emp.salary)}÷${DB.otHours||8}` : `${money(emp.salary)}÷${DB.otDays||30}÷${DB.otHours||8}`;
  const otBlock=`<div class="field" style="grid-column:1/-1;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px">
    <label style="font-weight:700;color:var(--brand-d)">ค่าล่วงเวลา (OT) — คำนวณรายชั่วโมง</label>
    <div class="grid3" style="margin-top:8px">
      <div class="field"><label>อัตรา/ชม. (${otRateLabel})</label><input value="${money(rate)}" readonly style="background:#eef2ff;font-weight:600"></div>
      <div class="field"><label>จำนวนชั่วโมง</label><input type="number" step="0.5" id="otHours" value="${r.earn.otHours||0}"></div>
      <div class="field"><label>ตัวคูณ (เท่า)</label>
        <select id="otMult">
          ${[['1','1× ทำงานวันหยุด (ในเวลา)'],['1.5','1.5× ล่วงเวลาวันทำงานปกติ'],['2','2× ค่าทำงานวันหยุด'],['2.5','2.5×'],['3','3× ล่วงเวลาในวันหยุด']].map(([v,t])=>`<option value="${v}" ${(+(r.earn.otMult||1.5)===+v)?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
    </div>
    <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="muted">รวมค่าล่วงเวลา (OT):</span>
      <input type="number" step="0.01" data-earn="ot" id="otAmt" value="${r.earn.ot||0}" style="width:150px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-weight:700"> <span class="muted">บาท</span>
      <span class="muted" style="font-size:12px">(แก้ตัวเลขนี้เองได้)</span>
    </div>
  </div>`;
  const AUTO_DED={sso:1,pvd:1,tax:1};   // ช่องคำนวณอัตโนมัติ (แก้ทับเองได้)
  const dedRows=DED_FIELDS.map(([k,l])=>{
    const auto=AUTO_DED[k], man=r.manual&&r.manual[k];
    const tag = !auto ? ''
      : man ? ` <span style="color:#d97706;font-size:11px">(แก้เอง)</span> <a href="#" data-reauto="${k}" style="font-size:11px;color:var(--brand)">↻ คืนค่าอัตโนมัติ</a>`
            : ' <span style="color:#059669;font-size:11px">(อัตโนมัติ)</span>';
    const bg = auto ? (man?'background:#fffbeb':'background:#f0fdf4') : '';
    return `<div class="field"><label>${l}${tag}</label>
      <input type="number" step="0.01" data-ded="${k}" id="ded_${k}" value="${r.ded[k]||0}" style="${bg}"></div>`;
  }).join('');

  const panel=el(`<div class="panel">
    <div class="phead"><h2>${esc(emp.name)} <span class="muted">— ${periodLabel(PERIOD)}</span></h2>
      <div class="sp"><span class="chip">${isDaily?`รายวัน ${money(emp.salary)}/วัน`:`เงินเดือน ${money(emp.salary)}`}</span></div></div>
    <div class="pbody">
      <div class="grid2">
        <div>
          <div class="sec-title">2.1 เงินได้</div>
          ${dayBlock}
          ${prorateBlock}
          ${otBlock}
          <div class="grid2">${earnRows}</div>
        </div>
        <div>
          <div class="sec-title">2.2 เงินหัก</div>
          <div class="grid2">${dedRows}</div>
        </div>
      </div>
    </div>
  </div>`);
  v.appendChild(panel);

  const totBox=el(`<div class="cards" id="peTot"></div>`);
  v.appendChild(totBox);
  drawPeTot(emp);

  // เงินได้เปลี่ยน → คำนวณ ปกส./กสล./ภาษี ใหม่ แล้วอัปเดตช่องอัตโนมัติ
  const refreshAutoDed=()=>{ autoDeductions(emp,r);
    ['sso','pvd','tax'].forEach(k=>{ const el2=panel.querySelector('#ded_'+k); if(el2) el2.value=r.ded[k]; }); };

  panel.querySelectorAll('input[data-earn]').forEach(i=>i.oninput=()=>{ r.earn[i.dataset.earn]=+i.value||0; refreshAutoDed(); save(); drawPeTot(emp); });
  panel.querySelectorAll('input[data-ded]').forEach(i=>i.oninput=()=>{

    if(AUTO_DED[k]) setManualDed(r,k,val); else r.ded[k]=val;   // แก้ช่องอัตโนมัติ = ยึดค่าที่พิมพ์
    save(); drawPeTot(emp);

  // ปุ่มคืนค่าอัตโนมัติ
  panel.querySelectorAll('[data-reauto]').forEach(a=>a.onclick=(ev)=>{
    ev.preventDefault(); clearManualDed(emp,r,a.dataset.reauto); render(); toast('คืนค่าอัตโนมัติแล้ว');
  });
  // OT auto-calc: อัตรา/ชม. × ชั่วโมง × ตัวคูณ
  const otH=panel.querySelector('#otHours'), otM=panel.querySelector('#otMult'), otA=panel.querySelector('#otAmt');
  const recalcOT=()=>{
    r.earn.otHours=+otH.value||0; r.earn.otMult=+otM.value||0;
    const amt=otAmount(emp, r.earn.otHours, r.earn.otMult);
    r.earn.ot=amt; otA.value=amt; refreshAutoDed(); save(); drawPeTot(emp);
  };
  otH.oninput=recalcOT; otM.onchange=recalcOT;
  // พนักงานรายวัน: เปลี่ยนจำนวนวัน → อัปเดตค่าจ้างฐาน
  const wd=panel.querySelector('#workDays');
  if(wd) wd.oninput=()=>{ r.days=+wd.value||0; panel.querySelector('#baseShow').value=money(basePay(emp,r));
    refreshAutoDed();   // วันเปลี่ยน → คำนวณ ปกส./กสล./ภาษี ใหม่
    save(); drawPeTot(emp); };
}

  };

    : (pr.partial && pr.factor>0 ? `${T.salary} (${T.prorated} ${pr.worked}/${pr.dim} ${T.days})` : T.salary);
  const earnList=[[baseLabel,c.base],...EARN_FIELDS.map(f=>[FL(f),r.earn[f[0]]])].filter(x=>+x[1]);

      <tbody>${rows}</tbody>

function yearAgg(e, year){
  let income=0, tax=0, sso=0, pvd=0;
  for(let m=1;m<=12;m++){ const p=`${year}-${String(m).padStart(2,'0')}`; if(!DB.payroll[p]||!DB.payroll[p][e.id]) continue;
    const c=calc(e,p); income+=c.gross; tax+=+c.r.ded.tax||0; sso+=+c.r.ded.sso||0; pvd+=+c.r.ded.pvd||0; }
  return {income,tax,sso,pvd};
}

/* ---------- Import / Export ---------- */
function exportJSON(){ downloadFile(`payroll_backup_${curPeriod()}.json`, JSON.stringify(DB,null,2),'application/json'); toast('ส่งออกข้อมูลแล้ว'); }
function importJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.employees) throw 0; DB=Object.assign(structuredClone(DEFAULT),d); save(); render(); toast('นำเข้าข้อมูลแล้ว'); }catch(e){ toast('ไฟล์ไม่ถูกต้อง'); } };
    rd.readAsText(f); };
  inp.click();
}
function downloadFile(name, content, type){
  const b=new Blob([content],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* ---------- นำเข้า/ส่งออก พนักงาน เป็น CSV ---------- */
const EMP_CSV_HEAD=['รหัส','ชื่อ-นามสกุล','เพศ','สัญชาติ','ตำแหน่ง','แผนก','ประเภท','ค่าจ้าง','วันเริ่มงาน(ปปปป-ดด-วว)','วันที่ลาออก(ปปปป-ดด-วว)','เลขบัตรประชาชน','ที่อยู่','ธนาคาร','เลขที่บัญชี','อัตรากสล.%'];
function csvEsc(v){ v=String(v??''); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function parseCSV(text){
  const rows=[]; let field='', row=[], inQ=false; text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
    else if(c==='"') inQ=true;
    else if(c===',') { row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows;
}
function exportEmpCSV(){
  const list = empVisibleList();                     // ส่งออกตามที่กรอง/ค้นหาอยู่
  const lines=[EMP_CSV_HEAD.map(csvEsc).join(',')];
  list.forEach(e=>{
    lines.push([e.code, e.name, e.gender==='M'?'ชาย':e.gender==='F'?'หญิง':'',
      e.nationality||'', e.position||'', e.dept||'',
      e.payType==='daily'?'รายวัน':'รายเดือน',
      e.salary||0, e.startDate||'', e.resignDate||'', e.taxId||'',
      e.address||'', e.bank||'', e.bankNo||'', e.pvdRate||0].map(csvEsc).join(','));
  });
  const tag = empFilter==='daily'?'_รายวัน' : empFilter==='monthly'?'_รายเดือน' : '';
  downloadFile(`employees${tag}_${curPeriod()}.csv`, '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8');
  toast(`ส่งออก CSV แล้ว (${list.length} คน)`);
}
function importEmpCSV(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{
      const rows=parseCSV(String(rd.result).replace(/^﻿/,''));
      if(rows.length<2) throw 0;
      let added=0, updated=0;
      for(let r=1;r<rows.length;r++){ const c=rows[r]; if(!c || !String(c[0]||'').trim()) continue;
        const rec={
          code:String(c[0]).trim(), name:String(c[1]||'').trim(),
          gender:/ชาย|^m$/i.test(String(c[2]||'').trim())?'M':/หญิง|^f$/i.test(String(c[2]||'').trim())?'F':'',
          nationality:String(c[3]||'').trim(),
          position:String(c[4]||'').trim(), dept:String(c[5]||'').trim(),
          payType:/วัน|daily/i.test(String(c[6]||''))?'daily':'monthly',
          salary:+c[7]||0, startDate:String(c[8]||'').trim(), resignDate:String(c[9]||'').trim(),
          taxId:String(c[10]||'').trim(), address:String(c[11]||'').trim(),
          bank:String(c[12]||'').trim(), bankNo:String(c[13]||'').trim(), pvdRate:+c[14]||0
        };
        const ex=DB.employees.find(x=>x.code===rec.code);
        if(ex){ Object.assign(ex,rec); updated++; } else { DB.employees.push({id:uid(),...rec}); added++; }
      }
      save(); drawEmp(); toast(`นำเข้า CSV สำเร็จ: เพิ่ม ${added} · อัปเดต ${updated}`);
    }catch(e){ toast('ไฟล์ CSV ไม่ถูกต้อง'); } };
    rd.readAsText(f,'utf-8'); };
  inp.click();
}

/* ---------- Baht text (อ่านจำนวนเงินเป็นไทย) ---------- */
function bahtText(n){
  n=Math.round((+n||0)*100)/100;
  const neg=n<0; n=Math.abs(n);
  const bt=Math.floor(n), st=Math.round((n-bt)*100);
  const readInt=(s)=>{
    const d=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
    const pos=['','สิบ','ร้อย','พัน','หมื่น','แสน','ล้าน'];
    if(s==='0') return '';
    let out='', L=s.length;
    for(let i=0;i<L;i++){ const dig=+s[i]; const p=(L-1-i)%6;
      if(dig!==0){
        if(p===1&&dig===1) out+='สิบ';
        else if(p===1&&dig===2) out+='ยี่สิบ';
        else if(p===0&&dig===1&&L>1&&out!=='') out+='เอ็ด';
        else out+=d[dig]+pos[p];
      }
      if((L-1-i)%6===0 && (L-1-i)!==0) out+='ล้าน';
    }
    return out;
  };
  let txt=(bt===0?'ศูนย์':readInt(String(bt)))+'บาท';
  txt += st===0 ? 'ถ้วน' : readInt(String(st))+'สตางค์';
  return (neg?'ลบ':'')+txt;
}

async function doLogin(){
