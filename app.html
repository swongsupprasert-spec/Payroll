<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eSimPayroll</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0e3a5c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect width='44' height='44' rx='12' fill='%230e3a5c'/><path d='M28.5 27.5A8.5 8.5 0 1 1 31 21.5H14' fill='none' stroke='%236ee7b7' stroke-width='3.6' stroke-linecap='round'/></svg>">
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --brand:#0e3a5c; --brand-d:#092942;
    --good:#059669; --bad:#dc2626; --warn:#d97706;
    --chip:#eaf6f1; --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Segoe UI",Tahoma,"Sarabun",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  h1,h2,h3{margin:0}
  a{color:var(--brand);text-decoration:none}
  button{font-family:inherit;font-size:14px;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}

  /* Layout */
  .app{display:flex;min-height:100vh}
  .side{width:230px;background:#0f2438;color:#cbd5e1;flex-shrink:0;display:flex;flex-direction:column}
  .side .brand{padding:18px 18px 12px;font-size:18px;font-weight:700;color:#fff;letter-spacing:.3px}
  .side .brand small{display:block;font-weight:400;font-size:12px;color:#94a3b8;margin-top:2px}
  .nav{display:flex;flex-direction:column;padding:8px}
  .nav button{background:none;border:0;color:#cbd5e1;text-align:left;padding:11px 14px;border-radius:8px;display:flex;gap:10px;align-items:center;transition:.15s}
  .nav button:hover{background:#16324d;color:#fff}
  .nav button.active{background:linear-gradient(135deg,#17557f,#0f766e);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent-l)}
  .nav .ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .nav button.active .ico{box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .nav .ico svg{display:block}
  .side .foot{margin-top:auto;padding:14px;font-size:11px;color:#5b7186;border-top:1px solid #1b3550}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
  .top h1{font-size:19px}
  .top .period{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--chip);padding:6px 10px;border-radius:8px}
  .top .period label{font-size:12px;color:var(--muted)}
  .content{padding:24px;max-width:1200px;width:100%}

  /* Buttons */
  .btn{background:var(--brand);color:#fff;border:0;padding:9px 15px;border-radius:8px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
  .btn:hover{background:var(--brand-d)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:#f9fafb}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.danger{background:var(--bad)}
  .btn.good{background:var(--good)}
  .icon-btn{background:none;border:0;padding:4px 6px;border-radius:6px;color:var(--muted)}
  .icon-btn:hover{background:#f1f5f9;color:var(--ink)}

  /* Cards & KPI */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .kpi .val{font-size:26px;font-weight:700;margin-top:6px}
  .kpi .val.money{font-variant-numeric:tabular-nums}
  .kpi.b1{border-top:3px solid var(--brand)}
  .kpi.b2{border-top:3px solid var(--good)}
  .kpi.b3{border-top:3px solid var(--warn)}
  .kpi.b4{border-top:3px solid var(--bad)}
  .kpi.b5{border-top:3px solid #7c3aed}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
  .panel .phead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .panel .phead h2{font-size:16px}
  .panel .phead .sp{margin-left:auto;display:flex;gap:8px}
  .panel .pbody{padding:18px}

  /* Tables */
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0}
  tbody tr:hover{background:#f9fafb}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tbl-wrap{overflow-x:auto}
  tfoot td{font-weight:700;background:#f6faf8;border-top:2px solid var(--line)}
  .muted{color:var(--muted)}
  .chip{display:inline-block;background:var(--chip);color:var(--brand-d);padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .pos{color:var(--good)} .neg{color:var(--bad)}

  /* Forms / modal */
  /* รายละเอียดใต้ตัวเลขรวมในแดชบอร์ด */
  .kpi-brk{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
  .kpi-brk-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:1.5}
  .kpi-brk-lab{color:#5b6a7e;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kpi-brk-val{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;color:#1e293b}
  .kpi-pct{font-weight:400;color:#94a3b8;font-size:11px}
  .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 16px;overflow:auto}
  .backdrop.on{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal .mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .modal .mhead h3{font-size:17px}
  .modal .mbody{padding:20px;max-height:70vh;overflow:auto}
  .modal .mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .field input:focus,.field select:focus{outline:2px solid var(--brand);border-color:var(--brand)}
  /* ช่องติ๊ก/ตัวเลือกไม่ต้องยืดเต็มบรรทัดเหมือนช่องกรอก */
  .field input[type=checkbox],.field input[type=radio]{width:auto;padding:0;margin:0 6px 0 0;vertical-align:-2px}
  /* ปุ่มเลือกประเภทการใช้งานในหน้าเข้าสู่ระบบ */
  .edpick{padding:10px 8px;border:1.5px solid #e5e7eb;border-radius:10px;background:#fff;
    font-family:inherit;font-size:13.5px;font-weight:700;color:#5b7186;cursor:pointer;transition:.18s}
  .edpick:hover{border-color:#cbd5e1;color:var(--ink)}
  .edpick.on{border-color:var(--brand);background:var(--accent-bg);color:var(--brand)}
  .sec-title{font-size:13px;font-weight:700;color:var(--brand-d);margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .sec-title:first-child{margin-top:0}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px}
  .search::before{content:"🔍";position:absolute;left:11px;top:9px;opacity:.5}

  .empty{text-align:center;padding:40px;color:var(--muted)}
  /* ช่องกรอกเวลาแบบ 24 ชม. — ทำเอง ไม่พึ่ง locale ของเบราว์เซอร์ */
  input.t24{width:82px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.5px;
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:15px}
  input.t24::placeholder{letter-spacing:0;font-family:inherit;color:#cbd5e1}
  input.t24.bad{border-color:#dc2626;background:#fef2f2}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f2438;color:#fff;padding:12px 20px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:100;opacity:0;transition:.3s;pointer-events:none}
  .toast.on{opacity:1}

  /* Print documents */
  .doc{background:#fff;color:#000;font-family:"Sarabun","TH Sarabun New",Tahoma,serif}
  @media print{
    .side,.top,.no-print{display:none!important}
    body{background:#fff;font-size:12pt}
    .content{padding:0;max-width:none}
    .doc{box-shadow:none!important;border:0!important;margin:0!important;page-break-after:always}
    .doc:last-child{page-break-after:auto}
    @page{size:A4;margin:12mm}
  }
  .print-area .doc{max-width:800px;margin:0 auto 24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:34px 40px;border-radius:6px}
  /* เอกสารขนาด A4 เต็มหน้า (เช่น 50 ทวิ) */
  .print-area .doc.a4{width:210mm;max-width:210mm;min-height:297mm;padding:9mm 11mm;box-sizing:border-box;font-size:10.5px}
  /* บีบตารางให้พอดี 1 หน้า A4 */
  .print-area .doc.a4 table.dtbl th,.print-area .doc.a4 table.dtbl td{padding:1.5px 6px;font-size:9.5px;line-height:1.2}
  .print-area .doc.a4 h2.dt{font-size:16px}
  /* แบบ กท.20 ก — บีบให้พอดี 1 หน้า A4 */
  .doc.kt20{font-size:10.5px;line-height:1.28}
  .print-area .doc.kt20 table.dtbl th,.print-area .doc.kt20 table.dtbl td{padding:2px 5px;font-size:9.5px;line-height:1.25}
  .doc.kt20 table.kt20m tbody td{height:19px}
  @media print{ .doc.a4{width:auto!important;max-width:none!important;min-height:0!important;padding:0!important} }
  .doc h2.dt{text-align:center;font-size:18px;margin-bottom:4px}
  .doc .company{text-align:center;margin-bottom:16px}
  .doc .company .cn{font-size:16px;font-weight:700}
  .doc table.dtbl{border:1px solid #333}
  .doc table.dtbl th,.doc table.dtbl td{border:1px solid #999;padding:6px 9px;white-space:normal}
  .doc table.dtbl th{background:#f0f0f0;color:#000}
  .doc .row2{display:flex;justify-content:space-between;gap:20px}
  .doc .sign{margin-top:40px;display:flex;justify-content:space-around;text-align:center}
  .doc .sign div{width:45%}
  .doc .line{border-bottom:1px dotted #555;height:20px;margin-bottom:4px}
  .settings-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .settings-row label{width:200px;color:var(--muted)}
  .segbtn{background:none;border:0;padding:8px 16px;border-radius:8px;font-weight:600;color:var(--muted)}
  .segbtn.on{background:#fff;color:var(--brand-d);box-shadow:var(--shadow)}
  /* ปุ่มเมนู (มือถือ) + ฉากหลังทับตอนเปิด drawer */
  .menuBtn{display:none;background:none;border:1px solid var(--line);border-radius:9px;width:42px;height:42px;font-size:20px;line-height:1;color:var(--ink);flex-shrink:0}
  .menuBtn:active{background:#f1f5f9}
  .sideOverlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:29}
  .sideOverlay.on{display:block}

  /* ===== iPad / จอกลาง : เมนูเหลือไอคอน ===== */
  @media(max-width:1024px){
    .side{width:68px}
    .side .brand{font-size:0;padding:16px 0;text-align:center}
    .side .brand>span{justify-content:center;gap:0}
    .side .brand small{display:none}
    .nav button{justify-content:center;padding:11px 8px}
    .nav button span.t{display:none}
    .side .foot{font-size:0;padding:10px 6px;text-align:center}
    .content{padding:18px}
    .grid3{grid-template-columns:1fr 1fr}
    .dash2{grid-template-columns:1fr!important}
  }

  /* ===== มือถือ : เมนูเป็น drawer เลื่อนออกมา ===== */
  @media(max-width:720px){
    .menuBtn{display:flex;align-items:center;justify-content:center}
    .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:30;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto}
    .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.45)}
    .side .brand{font-size:18px;padding:18px 18px 12px;text-align:left}
    .side .brand small{display:block}
    .nav button{justify-content:flex-start;padding:13px 14px}
    .nav button span.t{display:inline}
    .side .foot{font-size:11px;padding:14px;text-align:left}
    .top{padding:10px 14px;gap:8px;flex-wrap:wrap}
    .top h1{font-size:17px}
    .period{width:100%;order:3;margin-left:0}
    .period select{flex:1;min-width:0}
    .content{padding:14px}
    .cards{grid-template-columns:1fr 1fr;gap:10px}
    .kpi{padding:13px 14px}
    .kpi .val{font-size:21px}
    .grid2,.grid3{grid-template-columns:1fr}
    .toolbar{gap:8px}
    .modal{max-width:100%}
    .modal .mbody{max-height:65vh}
    .backdrop{padding:12px}
    th,td{padding:9px 10px}
    .seg{width:100%;overflow-x:auto}
    .segbtn{white-space:nowrap;flex-shrink:0}
    .print-area .doc{padding:18px 16px}
    .print-area .doc.a4{width:100%;max-width:100%;min-height:0;padding:16px 14px;font-size:11px}
  }
  /* จอเล็กมาก : การ์ดเรียงเดียว */
  @media(max-width:430px){ .cards{grid-template-columns:1fr} }

  /* มือถือ/แท็บเล็ต: ช่องกรอกอย่างน้อย 16px กัน iOS ซูมเอง + ปุ่มกดง่าย */
  @media(max-width:1024px){
    input,select,textarea{font-size:16px}
    .btn{padding:11px 16px}
    .icon-btn{padding:8px 10px;font-size:16px}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="authGate" style="position:fixed;inset:0;background:#ffffff;display:none;align-items:center;justify-content:center;z-index:200;padding:20px">
  <div style="background:#fff;border-radius:16px;max-width:400px;width:100%;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <div style="text-align:center;margin-bottom:10px">
      <svg viewBox="0 0 44 44" width="54" height="54" aria-hidden="true">
        <defs><linearGradient id="lgAuth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset=".55" stop-color="#17557f"/><stop offset="1" stop-color="#092942"/></linearGradient></defs>
        <rect width="44" height="44" rx="12" fill="url(#lgAuth)"/>
        <path d="M28.5 27.5A8.5 8.5 0 1 1 31 21.5H14" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg></div>
    <div style="text-align:center;font-size:26px;font-weight:800;margin-bottom:4px">eSim<span style="color:var(--brand)">Payroll</span></div>
    <div style="text-align:center;color:#5b7186;margin-bottom:22px">เข้าสู่ระบบเพื่อใช้งาน</div>
    <div class="field" style="margin-bottom:12px"><label>อีเมล</label><input id="authEmail" type="email" autocomplete="username" style="width:100%;padding:11px;border:1px solid #e5e7eb;border-radius:9px"></div>
    <div class="field" style="margin-bottom:16px"><label>รหัสผ่าน</label>
      <div class="pwwrap" style="position:relative">
        <input id="authPass" type="password" autocomplete="current-password" style="width:100%;padding:11px 44px 11px 11px;border:1px solid #e5e7eb;border-radius:9px">
        <button type="button" id="pwEye" class="pweye" aria-label="แสดงรหัสผ่าน" aria-pressed="false"
          style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;
          background:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;color:#6b7280">
          <svg class="eye-on" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M2.5 12S6 5.5 12 5.5c1.5 0 2.9.4 4.1 1M21.5 12s-3.5 6.5-9.5 6.5c-1.5 0-2.9-.4-4.1-1"/><path d="M4 4l16 16"/></svg>
        </button>
      </div></div>
    <button class="btn" id="authLogin" style="width:100%;justify-content:center;margin-bottom:14px">เข้าสู่ระบบ</button>

    <!-- ประเภทการใช้งาน — มีผลตอนสมัครใหม่เท่านั้น ผู้ใช้เดิมยึดตามแพ็กเกจที่ซื้อไว้ -->
    <div style="border-top:1px solid #e5e7eb;padding-top:14px">
      <div style="font-size:12.5px;color:#5b7186;margin-bottom:8px;text-align:center">สมัครใหม่ — เลือกประเภทการใช้งาน</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button type="button" id="edPickS" class="edpick on" style="flex:1">🏢 บริษัทเดียว</button>
        <button type="button" id="edPickF" class="edpick" style="flex:1">🏦 สำนักงานบัญชี</button>
      </div>
      <div id="edPickNote" style="font-size:12px;color:#5b7186;text-align:center;margin-bottom:12px;line-height:1.6"></div>
      <button class="btn ghost" id="authSignup" style="width:100%;justify-content:center">สมัครสมาชิกใหม่</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin:16px 0;color:#94a3b8;font-size:13px"><div style="flex:1;height:1px;background:#e5e7eb"></div>หรือ / or<div style="flex:1;height:1px;background:#e5e7eb"></div></div>
    <button id="authGoogle" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border:1px solid #dadce0;border-radius:9px;background:#fff;color:#3c4043;font-weight:600;font-size:15px;cursor:pointer">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>

  if(!cut) return {from:new Date(y,m-1,1), to:new Date(y,m,0)};
  return {from:new Date(y,m-2,cut+1), to:new Date(y,m-1,cut)};
}

}

function readRec(p, empId){

}
function autoSSO(wage){ return Math.round(Math.min(wage, DB.ssoMaxBase) * DB.ssoRate/100); } // ปัดเป็นจำนวนเต็มบาท
function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }
// เงินเดือนตามสัดส่วน (prorate) — อิงช่วงงวดจ่ายตามวันตัดรอบ + วันเริ่มงาน/ลาออก
function prorate(emp, p){
  if(!p || emp.payType==='daily') return {partial:false, factor:1};   // รายวันคิดจากจำนวนวันจริง
  const {from,to}=periodRange(p);
  const DAY=86400000, total=Math.round((to-from)/DAY)+1;
  let eStart=from, eEnd=to;
  if(emp.startDate){ const [y,m,d]=emp.startDate.split('-').map(Number); const S=new Date(y,m-1,d); if(S>eStart) eStart=S; }
  if(emp.resignDate){ const [y,m,d]=emp.resignDate.split('-').map(Number); const R=new Date(y,m-1,d); if(R<eEnd) eEnd=R; }
  if(eStart>eEnd) return {partial:true, factor:0, worked:0, dim:total, from, to};   // ไม่ได้ทำงานในงวดนี้
  const worked=Math.round((eEnd-eStart)/DAY)+1;
  if(worked>=total) return {partial:false, factor:1};                 // ทำงานเต็มงวด
  return {partial:true, factor:worked/total, worked, dim:total, from, to};
}
/* ---------- ประวัติการขึ้นเงินเดือน ----------
   emp.salHist = [{from:'YYYY-MM-DD', salary:n}, ...] เรียงจากเก่าไปใหม่
   ถ้าไม่มีประวัติ = ใช้ emp.salary ตัวเดียวเหมือนเดิมทุกงวด (พฤติกรรมเดิมเป๊ะ)   */
function salHistOf(emp){ return (Array.isArray(emp.salHist)&&emp.salHist.length)?emp.salHist:null; }
/* เงินเดือน ณ วันที่ที่ระบุ */
function salaryOnDate(emp, iso){
  const h=salHistOf(emp);
  if(!h) return Number(emp.salary||0);
  let s=h[0];
  for(const x of h){ if(x.from<=iso) s=x; else break; }
  return Number(s.salary||0);
}
/* เงินเดือน ณ วันสิ้นงวด — ใช้กับอัตรา OT / ประมาณภาษี / การแสดงผล */
function salaryFor(emp, p){
  if(!salHistOf(emp)) return Number(emp.salary||0);
  return salaryOnDate(emp, isoOf(periodRange(p||PERIOD).to));
}
/* บันทึกการขึ้นเงินเดือน (ใช้ลดเงินเดือนก็ได้) */
function raiseSalary(emp, newSal, fromIso){
  if(!salHistOf(emp)) emp.salHist=[{from:'0000-01-01', salary:Number(emp.salary||0)}];
  emp.salHist=emp.salHist.filter(x=>x.from!==fromIso);   // วันเดียวกันซ้ำ = แทนที่
  emp.salHist.push({from:fromIso, salary:Number(newSal)||0});
  emp.salHist.sort((a,b)=> a.from<b.from?-1 : a.from>b.from?1 : 0);
  emp.salary=salaryOnDate(emp, isoOf(new Date()));       // ค่าปัจจุบันไว้แสดงในหน้ารายชื่อ
  save();
}
// ค่าจ้างฐานของงวด: รายเดือน = เงินเดือน (prorate เดือนแรก) · รายวัน = ค่าจ้าง/วัน × จำนวนวันทำงาน
function basePay(emp, rec, p){
  if(emp.payType==='daily'){
    if(resignedBefore(emp, p)) return 0;                 // ลาออกไปก่อนงวดนี้แล้ว
    return salaryFor(emp, p) * Number((rec&&rec.days)||0);
  }
  if(!salHistOf(emp)){                                   // ไม่มีประวัติ = สูตรเดิมเป๊ะ
    const sal=Number(emp.salary||0);
    const pr=prorate(emp, p);
    return Math.round(sal*pr.factor*100)/100;
  }
  /* มีประวัติเงินเดือน: คิดเฉลี่ยรายวัน — วันไหนอัตราไหนได้อัตรานั้น
     ครอบคลุมทั้งขึ้นเงินเดือนกลางงวด และเข้า/ออกกลางเดือนพร้อมกัน */
  const {from,to}=periodRange(p||PERIOD);
  const DAY=86400000, dim=Math.round((to-from)/DAY)+1;
  let eS=from, eE=to;
  if(emp.startDate){ const [y,m,d]=emp.startDate.split('-').map(Number); const S=new Date(y,m-1,d); if(S>eS) eS=S; }
  if(emp.resignDate){ const [y,m,d]=emp.resignDate.split('-').map(Number); const R=new Date(y,m-1,d); if(R<eE) eE=R; }
  if(eS>eE) return 0;
  let sum=0;
  for(let t=eS.getTime(); t<=eE.getTime(); t+=DAY) sum+=salaryOnDate(emp, isoOf(new Date(t)));
  return Math.round(sum/dim*100)/100;
}
// ลาออกก่อนงวดนี้เริ่มหรือไม่ (ทั้งงวดอยู่หลังวันลาออก)
function resignedBefore(emp, p){
  if(!emp.resignDate || !p) return false;
  const {from}=periodRange(p);
  const [y,m,d]=emp.resignDate.split('-').map(Number);
  return new Date(y,m-1,d) < from;
}
// คำนวณเงินหักอัตโนมัติ (ประกันสังคม + กสล. + ภาษี) จากค่าจ้างฐาน/เงินได้ของงวด
function autoDeductions(emp, rec){
  const m = rec.manual || {};      // ช่องที่ผู้ใช้แก้เอง — ไม่เขียนทับ
  const base = basePay(emp, rec, PERIOD);
  if(!m.sso) rec.ded.sso = ssoExempt(emp) ? 0 : autoSSO(ssoWage(emp, rec, PERIOD));   // กรรมการ = ไม่หัก ปกส.
  if(!m.pvd) rec.ded.pvd = Math.round(base * (emp.pvdRate||0)/100);
  // กองทุนสงเคราะห์ลูกจ้าง — เฉพาะคนที่ไม่มีกองทุนสำรองเลี้ยงชีพ (เลือกได้อย่างใดอย่างหนึ่ง)
  if(!m.wf)  rec.ded.wf  = (Number(emp.pvdRate)>0) ? 0 : Math.round(base * (emp.wfRate||0)/100);
  // ลาไม่รับค่าจ้าง/ขาดงาน — ดึงจากใบลาของงวดนี้ให้อัตโนมัติ (เงินเดือน ÷ 30 × วันที่ลา)
  // พนักงานรายวันคืน 0 เพราะได้ค่าจ้างตามวันที่มาทำงานอยู่แล้ว
  if(!m.absent) rec.ded.absent = unpaidDeduction(emp, PERIOD);
  if(!m.tax) rec.ded.tax = estTax(emp, +PERIOD.split('-')[0], rec).monthly;           // ภาษีหัก ณ ที่จ่าย/เดือน
  save();
}
function setManualDed(rec, key, val){ rec.manual=rec.manual||{}; rec.manual[key]=1; rec.ded[key]=val; }
function clearManualDed(emp, rec, key){ if(rec.manual) delete rec.manual[key]; autoDeductions(emp, rec); }
/* ---------- ค่าจ้างตามนิยามประกันสังคม (ใช้ร่วมกันทั้ง สปส.1-10 และ กท.20 ก) ----------
   = ค่าจ้างฐาน + ค่าตอบแทนประจำ  (ไม่รวมค่าล่วงเวลาและโบนัส)                        */
const SSO_WAGE_KEYS=['commission','diligence','travel','position','other'];
function ssoWage(emp, rec, p){
  const r = rec || readRec(p||PERIOD, emp.id);
  return basePay(emp, r, p||PERIOD) + SSO_WAGE_KEYS.reduce((s,k)=>s+Number(r.earn[k]||0),0);
}
// ยกเว้นประกันสังคม — กรรมการ (ไม่ใช่ลูกจ้างตาม ม.33) หรือกาช่องยกเว้นเอง
function ssoExempt(emp){
  if(emp.noSSO) return true;
  return /กรรมการ|director/i.test(String(emp.position||''));
}
// ค่าจ้างต่อเดือนโดยประมาณ (ใช้คำนวณ ปกส./กสล./ภาษี) — รายวันใช้จำนวนวันจริง ถ้าไม่มีใช้ค่าเริ่มต้น
function monthlyWage(emp, rec){
  if(emp.payType==='daily'){ const d=Number((rec&&rec.days)||0)||(DB.workDaysDefault||26); return salaryFor(emp, PERIOD)*d; }
  return salaryFor(emp, PERIOD);
}
// อัตรา OT ต่อชั่วโมง: รายเดือน = เงินเดือน÷วัน÷ชม. · รายวัน = ค่าจ้าง/วัน÷ชม.
function otRate(emp){
  const h=DB.otHours||8;
  if(emp && emp.payType==='daily') return salaryFor(emp, PERIOD)/h;
  const d=DB.otDays||30; return (emp?salaryFor(emp, PERIOD):0)/d/h;
}
function otAmount(emp,hours,mult){ return Math.round(otRate(emp)*Number(hours||0)*Number(mult||0)*100)/100; }
/* OT หลายแถว — เดือนหนึ่งมี OT หลายแบบปนกัน (วันธรรมดา / วันหยุด / ล่วงเวลาวันหยุด)
   ของเดิมเก็บได้แถวเดียวใน otHours + otMult จึงย้ายมาเป็นแถวแรกให้อัตโนมัติ */
const OT_MULTS=[['1','1× ทำงานวันหยุด (ในเวลา)'],['1.5','1.5× ล่วงเวลาวันทำงานปกติ'],['2','2× ค่าทำงานวันหยุด'],['2.5','2.5×'],['3','3× ล่วงเวลาในวันหยุด']];
function otRowsOf(r){
  if(!Array.isArray(r.earn.otRows)){
    const h=Number(r.earn.otHours||0), m=Number(r.earn.otMult||1.5);
    r.earn.otRows = h>0 ? [{h:h,m:m}] : [{h:0,m:1.5}];
  }
  if(!r.earn.otRows.length) r.earn.otRows.push({h:0,m:1.5});
  return r.earn.otRows;
}
function otTotal(emp,r){
  return Math.round(otRowsOf(r).reduce(function(s,x){ return s+otAmount(emp,x.h,x.m); },0)*100)/100;
}

// ภาษีเงินได้บุคคลธรรมดา — อัตราก้าวหน้า (ขั้นบันได)
const TAX_BRACKETS=[[150000,0],[300000,.05],[500000,.10],[750000,.15],[1000000,.20],[2000000,.25],[5000000,.30],[Infinity,.35]];
function progressiveTax(net){
  let tax=0, low=0;
  for(const [cap,rate] of TAX_BRACKETS){ if(net<=low) break; tax+=(Math.min(net,cap)-low)*rate; low=cap; }
  return Math.round(tax*100)/100;
}
// จำนวนเดือนที่ทำงานในปีภาษี (คำนึงถึงวันเริ่มงาน)
function monthsEmployedInYear(emp, year){
  let startM=1, endM=12;
  if(emp.startDate){ const [sy,sm]=emp.startDate.split('-').map(Number); if(sy>year) return 0; if(sy===year) startM=sm; }
  if(emp.resignDate){ const [ry,rm]=emp.resignDate.split('-').map(Number); if(ry<year) return 0; if(ry===year) endM=rm; }
  return Math.max(0, endM - startM + 1);   // นับจากเดือนเริ่ม → เดือนลาออก (หรือ ธ.ค.)
}
// ประมาณการภาษีหัก ณ ที่จ่ายรายเดือน (อิงเงินได้ทั้งหมด + จำนวนเดือนที่ทำงานจริงในปีภาษี)
function estTax(emp, year, rec){
  year = year || new Date().getFullYear();
  const months=monthsEmployedInYear(emp, year);              // เดือนที่ทำงานในปีภาษี
  const earn = (rec && rec.earn) || {};
  const wage = monthlyWage(emp, rec);                        // ค่าจ้าง/เดือน (รายวัน = ค่าจ้าง×วัน)
  /* ค่าจ้างที่ "ได้รับจริง" ของแต่ละเดือนในปีภาษี — ใช้ basePay ตัวเดียวกับที่จ่ายจริง
     เดือนที่เข้างานหรือลาออกกลางเดือนถูกหารตามวันทำงาน ภาษีจึงไม่คิดจากเงินที่ยังไม่ได้รับ */
  let mStart=1, mEnd=12;
  if(emp.startDate){ const [sy,sm]=emp.startDate.split('-').map(Number); if(sy===year) mStart=sm; }
  if(emp.resignDate){ const [ry,rm]=emp.resignDate.split('-').map(Number); if(ry===year) mEnd=rm; }
  const wages=[];
  for(let m=mStart;m<=mEnd;m++){
    const mp = year+'-'+String(m).padStart(2,'0');
    wages.push(emp.payType==='daily' ? wage : basePay(emp, null, mp));
  }
  const wageSum = wages.reduce((a,b)=>a+b,0);
  const extras = ['ot','commission','diligence','travel','position','other'].reduce((s,k)=>s+Number(earn[k]||0),0);
  const recurringMonthly = (months>0?wageSum/months:wage) + extras;   // เฉลี่ย/เดือน (ไว้แสดงในกล่องวิธีคำนวณ)
  const bonus = Number(earn.bonus||0);                       // โบนัส = จ่ายครั้งเดียว บวกครั้งเดียว
  const inc=wageSum + extras*months + bonus;                 // เงินได้ทั้งปี (รวมเงินได้ทุกประเภท)
  const expense=Math.min(inc*0.5,100000);                    // ค่าใช้จ่าย 50% สูงสุด 100,000
  const personal=60000;                                      // ลดหย่อนส่วนตัว (ไม่เฉลี่ยตามเดือน)
  const spouse=(+emp.spouse)?60000:0;                        // คู่สมรส
  const children=(Number(emp.children||0))*30000;            // บุตรคนละ 30,000
  const ssoCap=autoSSO(DB.ssoMaxBase)*12;                     // เพดาน ปกส./ปี = 875 × 12 = 10,500
  const sso=Math.min(wages.reduce((s,w)=>s+autoSSO(w),0), ssoCap);   // ประกันสังคม (คิดจากค่าจ้างจริงรายเดือน)
  const pvd=Math.min(wageSum*(emp.pvdRate||0)/100,500000);     // กสล.
  const other=Number(emp.otherAllow||0);                     // ลดหย่อนอื่น
  const totalDed=expense+personal+spouse+children+sso+pvd+other;
  const net=Math.max(0,inc-totalDed);                        // เงินได้สุทธิ (ฐานภาษี)
  const annual=progressiveTax(net);
  const monthly=months>0 ? Math.round(annual/months*100)/100 : 0; // เฉลี่ยตามเดือนที่ทำงาน
  return {months,recurringMonthly,bonus,inc,expense,personal,spouse,children,sso,pvd,other,totalDed,net,annual,monthly};
}
function calc(emp, p){
  const r = readRec(p, emp.id);
  const base = basePay(emp, r, p);
  const earnTotal = EARN_FIELDS.reduce((s,[k])=>s+Number(r.earn[k]||0),0);
  const gross = base + earnTotal;                 // รายได้รวม
  const dedTotal = DED_FIELDS.reduce((s,[k])=>s+Number(r.ded[k]||0),0);
  const net = gross - dedTotal;                   // เงินสุทธิ
  return {base, earnTotal, gross, dedTotal, net, r};
}
function periodTotals(p){
  const [py,pm]=p.split('-').map(Number);
  let salary=0, earn=0, gross=0, ded=0, net=0, tax=0, count=0;
  // แยกยอดรายรายการ เพื่อบอกในแดชบอร์ดว่าตัวเลขรวมมาจากอะไร
  const earnBy={}, dedBy={};
  let salMonthly=0, salDaily=0, nMonthly=0, nDaily=0;
  DB.employees.forEach(e=>{ const c=calc(e,p); const r=readRec(p,e.id);
    salary+=c.base; earn+=c.earnTotal; gross+=c.gross; ded+=c.dedTotal; net+=c.net; tax+=Number(r.ded.tax||0);
    EARN_FIELDS.forEach(([k])=>{ earnBy[k]=(earnBy[k]||0)+Number(r.earn[k]||0); });
    DED_FIELDS.forEach(([k])=>{ dedBy[k]=(dedBy[k]||0)+Number(r.ded[k]||0); });
    if(activeInMonth(e,py,pm)){
      count++;
      if(e.payType==='daily'){ salDaily+=c.base; nDaily++; } else { salMonthly+=c.base; nMonthly++; }
    }
  });
  return {count, salary, earn, gross, ded, net, tax, earnBy, dedBy, salMonthly, salDaily, nMonthly, nDaily};
}

/* ---------- ถอดรหัสอักขระไฟล์ที่นำเข้า ----------
   ไฟล์จากโปรแกรม HR เก่าหรือ Excel ภาษาไทยมักเป็น TIS-620 / Windows-874
   ถ้าถอดเป็น UTF-8 ตรง ๆ ตัวหนังสือไทยจะกลายเป็น ??? ทั้งหมด
   วิธีเดา: ดู BOM ก่อน ไม่มีก็ลองถอดเป็น UTF-8 แบบเข้มงวด พังเมื่อไหร่ค่อยใช้ Windows-874
   (ข้อความไทย TIS-620 เกือบทุกไบต์ผิดกฎ UTF-8 จึงตกมาทางนี้เสมอ ส่วนไฟล์ UTF-8 จริงจะผ่านด่านแรก) */
function decodeTextBytes(buf){
  if(typeof buf==='string') return buf.replace(/^\uFEFF/,'');
  const b=new Uint8Array(buf);
  const cut=(enc,skip)=>new TextDecoder(enc).decode(b.subarray(skip));
  if(b.length>=3 && b[0]===0xEF && b[1]===0xBB && b[2]===0xBF) return cut('utf-8',3);
  if(b.length>=2 && b[0]===0xFF && b[1]===0xFE) return cut('utf-16le',2);
  if(b.length>=2 && b[0]===0xFE && b[1]===0xFF) return cut('utf-16be',2);
  let txt;
  try{ txt=new TextDecoder('utf-8',{fatal:true}).decode(b); }        // ไฟล์ UTF-8 ปกติ
  catch(e){
    try{ txt=new TextDecoder('windows-874').decode(b); }             // ไทยแบบเก่า
    catch(e2){ txt=new TextDecoder('utf-8').decode(b); }
  }
  if(txt.indexOf('\uFFFD')>=0) toast('⚠️ ไฟล์มีตัวอักษรที่อ่านไม่ออก — ลองบันทึกใหม่เป็น CSV UTF-8');
  return txt.replace(/^\uFEFF/,'');
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* เมนูตามประเภทบัญชี — สำนักงานบัญชีไม่มีลงเวลา/ลางาน แต่มีหน้าบริษัทลูกค้าเพิ่ม */
function pagesForEdition(){
  if(!isFirm()) return PAGES;
  return [['companies','บริษัทลูกค้า','🏢'],
          ...PAGES.filter(p=>!['attend','leave'].includes(p[0]))];
}
function pageAllowed(id){
  if(['orders','feedback','admin'].includes(id)) return IS_ADMIN;
  return pagesForEdition().some(p=>p[0]===id);
}
/* ตัวสลับบริษัทบนแถบเมนู */
function renderCoSwitch(){
  const nav=$('#nav'); if(!nav || !isFirm()) return;
  const list=activeCos();
  const box=el(`<div style="padding:10px 12px 12px;border-bottom:1px solid #1b3550;margin-bottom:8px">
    <div style="font-size:11px;font-weight:800;color:#7c94ac;letter-spacing:.6px;margin-bottom:6px">บริษัทที่กำลังทำ</div>
    ${list.length ? `<select id="coSel" style="width:100%;padding:9px 10px;border-radius:9px;border:1px solid #24466b;
        background:#14304d;color:#fff;font-family:inherit;font-size:13.5px;font-weight:600">
        ${list.map(c=>`<option value="${esc(c.id)}" ${c.id===CUR_CO?'selected':''}>${esc(c.name)}</option>`).join('')}
      </select>`
      : `<div style="color:#94a3b8;font-size:12.5px">ยังไม่มีบริษัท — กด “บริษัทลูกค้า” เพื่อเพิ่ม</div>`}
    <div style="font-size:11px;color:#7c94ac;margin-top:6px">
      ${list.length} บริษัท${coLimit()!==null?' / สูงสุด '+coLimit():''}</div>
  </div>`);
  nav.insertBefore(box, nav.firstChild);
  const sel=box.querySelector('#coSel');
  if(sel) sel.onchange=()=>switchCompany(sel.value);
}
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const base = pagesForEdition();
  const items = IS_ADMIN ? [...base, ['orders','คำสั่งซื้อ/ต่ออายุ','🧾'], ['feedback','แจ้งปัญหา/คำแนะนำ','💬'], ['admin','ผู้ดูแลระบบ','👑']] : base;
  items.forEach(([id,label,ico])=>{
    const col = NAV_COLORS[id] || '#17557f';
    const lock = pageLocked(id);
    const b = el(`<button data-p="${id}" ${lock?'title="ต้องใช้แพ็กเกจพรีเมี่ยม"':''}>
      <span class="ico" style="background:linear-gradient(135deg,${col}cc,${col}77);color:#fff${lock?';filter:grayscale(.85);opacity:.6':''}">${NAV_ICONS[id]||ico}</span>
      <span class="t" style="${lock?'opacity:.6':''}">${tr('nav_'+id)}</span>
      ${lock?'<span style="margin-left:auto;opacity:.75;display:flex">'+LOCK_ICO+'</span>':''}</button>`);
    if(id===PAGE) b.classList.add('active');
    b.onclick = ()=>{
      if(pageLocked(id)){ premiumModal(id); sideOpen(false); return; }   // ล็อกอยู่ → ชวนอัปเกรดแทน
      sideOpen(false); window.scrollTo(0,0);
      if(id==='payroll'){ askPeriodThen(()=>{ PAGE=id; savePage(id); renderNav(); render(); }); return; }
      PAGE=id; savePage(id); renderNav(); render();
    };
    nav.appendChild(b);
  });
  renderCoSwitch();          // ตัวสลับบริษัท (เฉพาะแบบสำนักงานบัญชี)
}
/* ถามงวดเดือนก่อนเข้าหน้าคำนวณเงินได้ — กันทำผิดเดือนโดยไม่รู้ตัว */
function askPeriodThen(go){
  const [cy,cm]=PERIOD.split('-').map(Number);
  const nowY=new Date().getFullYear();
  const ys=new Set(); for(let y=nowY-5;y<=nowY+1;y++) ys.add(y);
  Object.keys(DB.payroll).forEach(p=>ys.add(+p.split('-')[0])); ys.add(cy);
  const years=[...ys].sort((a,b)=>b-a);
  const MN=(LANG==='en'?MONTHS_EN:THAI_MONTHS);
  const body=`<p style="margin:0 0 12px">${tr('ask_period_q')}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <select id="apM" class="inp" style="flex:1;min-width:130px">${MN.map((m,i)=>`<option value="${i+1}" ${i+1===cm?'selected':''}>${m}</option>`).join('')}</select>
      <select id="apY" class="inp" style="flex:1;min-width:110px">${years.map(y=>`<option value="${y}" ${y===cy?'selected':''}>${LANG==='en'?y:y+543}</option>`).join('')}</select>
    </div>
    <p id="apNote" class="muted" style="margin:10px 0 0;font-size:13px"></p>`;
  const start=()=>{
    const M=document.getElementById('apM'), Y=document.getElementById('apY');
    if(M&&Y) PERIOD=`${Y.value}-${String(M.value).padStart(2,'0')}`;
    closeModal(); go();
  };
  openModal(tr('ask_period_t'), body, [[tr('ask_period_ok'),'',start],[tr('cancel')||'ยกเลิก','ghost',closeModal]]);
  const M=document.getElementById('apM'), Y=document.getElementById('apY'), N=document.getElementById('apNote');
  const note=()=>{ const p=`${Y.value}-${String(M.value).padStart(2,'0')}`;
    N.innerHTML = periodHasData(p) ? `✅ ${tr('ask_period_has')}` : `🆕 ${tr('ask_period_new')}`; };
  if(M&&Y&&N){ M.onchange=note; Y.onchange=note; note();
    [M,Y].forEach(s=>s.onkeydown=e=>{ if(e.key==='Enter') start(); }); M.focus(); }
}
function renderPeriodSel(){
  const [curY, curM] = PERIOD.split('-').map(Number);
  // ปีที่เลือกได้: ปีปัจจุบัน ±5 และปีที่มีข้อมูลอยู่แล้ว
  const nowY = new Date().getFullYear();
  const yset = new Set();
  for(let y=nowY-5; y<=nowY+1; y++) yset.add(y);
  Object.keys(DB.payroll).forEach(p=>yset.add(+p.split('-')[0]));
  yset.add(curY);
  const years=[...yset].sort((a,b)=>b-a);

  const mSel=$('#monthSel'), ySel=$('#yearSel');
  mSel.innerHTML = (LANG==='en'?MONTHS_EN:THAI_MONTHS).map((m,i)=>`<option value="${i+1}" ${i+1===curM?'selected':''}>${m}</option>`).join('');
  ySel.innerHTML = years.map(y=>`<option value="${y}" ${y===curY?'selected':''}>${LANG==='en'?y:y+543}</option>`).join('');
  const apply=()=>{ PERIOD=`${ySel.value}-${String(mSel.value).padStart(2,'0')}`; render(); };
  mSel.onchange=apply; ySel.onchange=apply;
}

function render(){
  $('#pageTitle').textContent = tr('nav_'+PAGE);
  const pl=$('#periodLab'); if(pl) pl.textContent=tr('period');
  // หน้าที่ไม่ผูกกับงวดเดือน — ซ่อนตัวเลือกงวดเดือนด้านบน
  const pbox=$('#periodBox'); if(pbox) pbox.style.display = (PAGE==='resign'||PAGE==='employees'||PAGE==='leave') ? 'none' : '';
  renderPeriodSel();
  // ถ้าหน้าที่เปิดอยู่ถูกล็อก ให้เด้งกลับแดชบอร์ด
  if(pageLocked(PAGE)){ PAGE='dashboard'; savePage(PAGE); renderNav(); }
  const v = $('#view'); v.innerHTML='';
  if(TARGET_UID && MY_UID && TARGET_UID!==MY_UID) v.appendChild(adminBanner());

  if(isFirm() && !CUR_CO && PAGE!=='companies' && PAGE!=='admin'){ PAGE='companies'; savePage(PAGE); renderNav(); }
  ({dashboard:vDashboard, employees:vEmployees, attend:vAttend, leave:vLeave, resign:vResign, advance:vAdvance, payroll:vPayroll, summary:vSummary,
    dept:vDept, detail:vDetail, slip:vSlip, wht:vWHT, pnd1:vPND1, sso:vSSO, settings:vSettings, feedback:vFeedback, orders:vOrders,

/* คิดยอดของบริษัทอื่นโดยยืมฟังก์ชันคำนวณชุดเดิมทั้งหมด — สลับ DB ชั่วคราวแล้วคืนค่าเสมอ
   ทำแบบนี้เพื่อกันตัวเลขสองชุดเพี้ยนจากกัน ถ้าเขียนสูตรใหม่แยกไว้จะหลุดกันวันใดวันหนึ่ง */
function withDB(d, fn){
  const keep=DB;
  try{ DB=d; return fn(); }
  finally{ DB=keep; }
}
/* ดึงข้อมูลของทุกบริษัทมาไว้ในหน่วยความจำ (RLS คืนเฉพาะของเจ้าของอยู่แล้ว) */
async function loadAllStores(){
  const {data,error}=await sb.from('firm_stores').select('company_id,data');
  if(error) return {};
  const map={};
  (data||[]).forEach(r=>{ if(r.data && r.data.employees) map[r.company_id]=r.data; });
  return map;
}

         <td class="num">${hasData?'<span class="chip" style="background:#dcfce7;color:#16a34a">ทำแล้ว</span>'
                                  :'<span class="chip" style="background:#fef3c7;color:#b45309">ยังไม่ได้ทำ</span>'}</td>`
      : `<td colspan="5" class="muted" style="text-align:center">ยังไม่ได้ใส่ข้อมูลพนักงาน</td>`;

    return `<tr${co.archived?' style="opacity:.55"':''}>
      <td>${name}</td>${figs}
      <td class="num" style="white-space:nowrap">
        ${co.archived
          ? `<button class="btn ghost sm" data-unarch="${co.id}">↩️ นำกลับมา</button>`
          : `<button class="btn ghost sm" data-open="${co.id}" ${co.id===CUR_CO?'disabled style="opacity:.45"':''}>เปิดทำงาน</button>
             <button class="btn ghost sm" data-edit="${co.id}" title="แก้ไขข้อมูลบริษัท">✏️</button>
             <button class="btn ghost sm" data-arch="${co.id}" title="เก็บเข้าคลัง">📦</button>`}
        <button class="btn ghost sm" data-del="${co.id}" title="ลบถาวร — คืนโควตา"
          style="color:#dc2626;border-color:#fecaca">🗑️</button>
      </td></tr>`;
  }).join('');

  box.innerHTML=`<table>
    <thead><tr><th>บริษัท</th><th class="num">พนักงาน</th><th class="num">รายได้รวม</th>
      <th class="num">ภาษีหัก</th><th class="num">จ่ายสุทธิ</th>
      <th class="num">งวด ${esc(periodLabel(PERIOD))}</th><th class="num">จัดการ</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="background:#f8fafc;font-weight:800">
      <td>รวม ${nActive} บริษัทที่ดูแลอยู่</td>
      <td class="num">${num(gEmp)}</td><td class="num">${money(gGross)}</td>
      <td class="num">${money(gTax)}</td><td class="num">${money(gNet)}</td>
      <td class="num">ทำแล้ว ${done}/${nActive}</td><td></td></tr></tfoot></table>`;

  box.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{
    await switchCompany(b.dataset.open); PAGE='dashboard'; savePage(PAGE); renderNav(); render();
  });
  box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>coForm(COMPANIES.find(x=>x.id===b.dataset.edit)));
  box.querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>setArchived(b.dataset.arch,true));
  box.querySelectorAll('[data-unarch]').forEach(b=>b.onclick=()=>setArchived(b.dataset.unarch,false));
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteCompany(b.dataset.del));

  /* ---- ส่งออกสรุปสำหรับยื่นภาษีทุกบริษัท ---- */
  $('#coCsv').onclick=()=>{
    const head=['บริษัท','เลขผู้เสียภาษี','สาขา','งวด','จำนวนพนักงาน','รายได้รวม','ภาษีหัก ณ ที่จ่าย','ประกันสังคม(ลูกจ้าง)','จ่ายสุทธิ'];
    const lines=[head.join(',')];
    activeCos().forEach(co=>{
      const d=stores[co.id]; if(!d) return;
      const t=withDB(d, ()=>periodTotals(PERIOD));
      const sso=withDB(d, ()=>DB.employees.reduce((s,e)=>s+Number(readRec(PERIOD,e.id).ded.sso||0),0));
      lines.push([co.name, co.tax_id||'', co.branch||'', PERIOD, t.count,
        t.gross.toFixed(2), t.tax.toFixed(2), sso.toFixed(2), t.net.toFixed(2)]
        .map(x=>`"${String(x).replace(/"/g,'""')}"`).join(','));
    });
    downloadFile(`สรุปยื่นภาษีทุกบริษัท-${PERIOD}.csv`, '\ufeff'+lines.join('\r\n'), 'text/csv;charset=utf-8');
    toast('ส่งออกสรุป '+activeCos().length+' บริษัทแล้ว');
  };

  /* ---- ก๊อปตั้งค่าจากบริษัทหนึ่งไปอีกหลายบริษัท ---- */
  $('#coCopy').onclick=()=>{
    const list=activeCos();
    if(list.length<2){ toast('ต้องมีอย่างน้อย 2 บริษัทถึงจะก๊อปได้'); return; }
    openModal('ก๊อปตั้งค่าข้ามบริษัท', `
      <div class="field"><label>ก๊อปจากบริษัท</label>
        <select id="cp_from">${list.map(c=>`<option value="${esc(c.id)}" ${c.id===CUR_CO?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="field"><label>ไปยังบริษัท (เลือกได้หลายบริษัท)</label>
        <div id="cp_to" style="max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px">
          ${list.map(c=>`<label style="display:flex;align-items:center;gap:8px;padding:5px 4px;cursor:pointer">
            <input type="checkbox" value="${esc(c.id)}"> <span>${esc(c.name)}</span></label>`).join('')}
        </div></div>
      <div class="muted" style="font-size:12.5px;line-height:1.7">
        ก๊อปเฉพาะ<strong>ค่าตั้งต้นการคำนวณ</strong> — อัตราประกันสังคม ฐานคำนวณ OT วันทำงานต่อเดือน
        วันตัดรอบ เวลาทำงาน และอัตรากองทุนสงเคราะห์<br>
        <strong>ไม่แตะ</strong>ข้อมูลบริษัท ข้อมูลพนักงาน และเงินเดือนที่ทำไปแล้ว</div>`,
      [['ยกเลิก','ghost',closeModal],['ก๊อป','',async()=>{
        const from=$('#cp_from').value;
        const targets=[...document.querySelectorAll('#cp_to input:checked')].map(i=>i.value).filter(id=>id!==from);
        if(!targets.length){ toast('ยังไม่ได้เลือกบริษัทปลายทาง'); return; }
        const src=stores[from];
        if(!src){ toast('บริษัทต้นทางยังไม่มีข้อมูล'); return; }
        closeModal();
        let ok=0;
        for(const id of targets){
          const cur=stores[id] || structuredClone(DEFAULT);
          COPY_KEYS.forEach(k=>{ if(src[k]!==undefined) cur[k]=structuredClone(src[k]); });
          const {error}=await sb.from('firm_stores')
            .upsert({company_id:id, data:cur, updated_at:new Date().toISOString()});
          if(!error){ ok++; stores[id]=cur;
            if(id===CUR_CO){ COPY_KEYS.forEach(k=>{ if(src[k]!==undefined) DB[k]=structuredClone(src[k]); });
                             localStorage.setItem(LS_KEY, JSON.stringify(DB)); } }
        }
        toast(`ก๊อปตั้งค่าไปแล้ว ${ok}/${targets.length} บริษัท`);
        render();
      }]]);
  };
}
function coForm(co){
  const isNew=!co;
  openModal(isNew?'เพิ่มบริษัทลูกค้า':'แก้ไขข้อมูลบริษัท', `
    <div class="field"><label>ชื่อบริษัท *</label>
      <input id="co_name" value="${esc(co?co.name:'')}" placeholder="บริษัท ตัวอย่าง จำกัด"></div>
    <div class="field"><label>เลขประจำตัวผู้เสียภาษี *</label>
      <input id="co_tax" inputmode="numeric" maxlength="13" value="${esc(co?(co.tax_id||''):'')}" placeholder="13 หลัก"></div>
    <div class="field"><label>สาขา</label>
      <input id="co_branch" value="${esc(co?(co.branch||''):'')}" placeholder="สำนักงานใหญ่"></div>
    <div id="co_err" style="font-size:13px;color:#dc2626;min-height:18px;margin-bottom:4px"></div>
    ${isNew?'<div class="muted" style="font-size:12.5px">เพิ่มแล้วระบบจะเปิดบริษัทนี้ให้ทันที เริ่มจากข้อมูลว่าง</div>':''}`,
    [['ยกเลิก','ghost',closeModal],['บันทึก','',async()=>{
      const name=$('#co_name').value.trim();
      const tax=$('#co_tax').value.replace(/\D/g,'');
      const branch=$('#co_branch').value.trim();
      const err=$('#co_err');
      const bad=(msg,el)=>{ if(err) err.textContent=msg; else toast(msg);
        if(el){ el.style.borderColor='#dc2626'; el.focus(); } };
      if(!name) return bad('กรุณากรอกชื่อบริษัท', $('#co_name'));
      if(!tax)  return bad('กรุณากรอกเลขประจำตัวผู้เสียภาษี', $('#co_tax'));
      if(tax.length!==13) return bad(`เลขประจำตัวผู้เสียภาษีต้องมี 13 หลัก (ตอนนี้ ${tax.length} หลัก)`, $('#co_tax'));
      // กันเพิ่มบริษัทเดียวกันซ้ำสองรอบ
      const dup=COMPANIES.find(x=>x.id!==(co&&co.id) && String(x.tax_id||'')===tax);
      if(dup) return bad(`เลขนี้ซ้ำกับ "${dup.name}" ที่มีอยู่แล้ว`, $('#co_tax'));
      closeModal();
      if(isNew){
        const created=await createCompany(name, tax, branch);
        if(!created) return;
        await openCompany(created.id);
        PAGE='dashboard'; savePage(PAGE); renderNav(); render();
        toast('เพิ่ม '+name+' แล้ว');
      }else{
        const {error}=await sb.from('firm_companies')
          .update({name, tax_id:tax||null, branch:branch||null}).eq('id',co.id);
        if(error){ toast('บันทึกไม่สำเร็จ: '+error.message); return; }
        Object.assign(co,{name, tax_id:tax||null, branch:branch||null});
        renderNav(); render(); toast('บันทึกแล้ว');
      }
    }]]);
  // ช่องเลขผู้เสียภาษี — พิมพ์ได้เฉพาะตัวเลข ไม่เกิน 13 หลัก และบอกสถานะระหว่างพิมพ์
  const tf=$('#co_tax'), ef=$('#co_err');
  if(tf) tf.oninput=()=>{
    tf.value=tf.value.replace(/\D/g,'').slice(0,13);
    tf.style.borderColor='';
    if(ef) ef.textContent = (tf.value.length && tf.value.length<13)
      ? `กรอกแล้ว ${tf.value.length}/13 หลัก` : '';
    if(ef) ef.style.color = tf.value.length===13 ? '#059669' : '#dc2626';
  };
  const nf=$('#co_name'); if(nf) nf.oninput=()=>{ nf.style.borderColor=''; if(ef) ef.textContent=''; };
}
/* ลบบริษัทถาวร — ทางเดียวที่คืนโควตา และลบข้อมูลเงินเดือนทิ้งด้วย
   ให้พิมพ์ชื่อบริษัทยืนยัน เพราะกู้คืนไม่ได้ */
async function deleteCompany(id){
  const co=COMPANIES.find(x=>x.id===id); if(!co) return;
  openModal('🗑️ ลบบริษัทถาวร', `
    <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:11px;padding:13px 15px;margin-bottom:14px">
      <div style="font-weight:800;color:#b91c1c;margin-bottom:6px">การลบนี้กู้คืนไม่ได้</div>
      <div style="font-size:13.5px;color:#7f1d1d;line-height:1.75">
        ข้อมูลของ <strong>${esc(co.name)}</strong> จะถูกลบทิ้งทั้งหมด ได้แก่<br>
        • ข้อมูลพนักงานทุกคน<br>
        • เงินเดือนทุกงวดที่ทำไว้<br>
        • ประวัติสำหรับออก 50 ทวิ / ภ.ง.ด.1 / สปส.1-10 ย้อนหลัง<br><br>
        ถ้าแค่เลิกดูแลแต่อาจต้องออกเอกสารย้อนหลัง ให้ใช้ <strong>📦 เก็บเข้าคลัง</strong> แทน
        (ข้อมูลยังอยู่ครบ แต่ยังนับโควตา)
      </div>
    </div>
    <div class="field"><label>พิมพ์ชื่อบริษัทเพื่อยืนยัน</label>
      <input id="del_name" placeholder="${esc(co.name)}" autocomplete="off"></div>
    <div class="muted" style="font-size:12.5px">ลบแล้วจะได้โควตาคืน 1 บริษัท</div>`,
    [['ยกเลิก','ghost',closeModal],['ลบถาวร','',async()=>{
      if($('#del_name').value.trim()!==co.name){
        toast('ชื่อบริษัทไม่ตรง — ยังไม่ได้ลบ');
        const f=$('#del_name'); if(f){ f.style.borderColor='#dc2626'; f.focus(); }
        return;
      }
      closeModal();
      const {error}=await sb.from('firm_companies').delete().eq('id',id);
      if(error){ toast('ลบไม่สำเร็จ: '+error.message); return; }
      COMPANIES=COMPANIES.filter(x=>x.id!==id);
      try{ localStorage.removeItem('payroll_co_'+id); }catch(e){}   // ล้างข้อมูลที่ค้างในเครื่องด้วย
      if(id===CUR_CO){
        const next=activeCos()[0];
        await openCompany(next?next.id:null);
      }
      try{ const {data:q}=await sb.rpc('my_company_quota'); if(q&&q[0]) CO_QUOTA=q[0].max_companies; }catch(e){}
      renderNav(); render();
      toast('ลบ '+co.name+' แล้ว · คืนโควตา 1 บริษัท');
    }]]);
}
/* เก็บเข้าคลัง / นำกลับมาดูแล — ไม่ลบข้อมูล ยังออกเอกสารย้อนหลังได้ แต่ยังนับโควตา */
async function setArchived(id, on){
  const co=COMPANIES.find(x=>x.id===id); if(!co) return;
  if(on && !confirm(`เก็บ "${co.name}" เข้าคลัง?\n\nข้อมูลทั้งหมดยังอยู่ครบ นำกลับมาดูแลได้ทุกเมื่อ\n\nหมายเหตุ: ยังนับในโควตาบริษัทอยู่ — ถ้าต้องการคืนโควตาต้องกดลบถาวร`)) return;
  const {error}=await sb.from('firm_companies').update({archived:on}).eq('id',id);
  if(error){
    toast(isCoLimitError(error) ? ('🔒 '+(coQuotaMsg()||'เกินจำนวนบริษัทที่แพ็กเกจรองรับ'))
                                : ('ไม่สำเร็จ: '+error.message));
    return;
  }
  co.archived=on;
  // ถ้าเก็บบริษัทที่กำลังเปิดอยู่ ให้สลับไปบริษัทอื่น
  if(on && id===CUR_CO){
    const next=activeCos()[0];
    await openCompany(next?next.id:null);
  }
  renderNav(); render();
  toast(on?'เก็บเข้าคลังแล้ว':'นำกลับมาดูแลแล้ว');
}

/* ============ คำสั่งซื้อ / ต่ออายุ (แอดมินเท่านั้น) ============ */
async function vOrders(v){
  v.appendChild(el(`<div class="toolbar"><h2 style="font-size:16px">🧾 คำสั่งซื้อ / ต่ออายุแพ็กเกจ</h2>
    <button class="btn ghost sm" style="margin-left:auto" id="oRef">↻ รีเฟรช</button></div>`));
  const panel=el(`<div class="panel"><div class="pbody" style="padding:0"><div class="tbl-wrap" id="ordTbl"><div class="empty">กำลังโหลด…</div></div></div></div>`);
  v.appendChild(panel);
  $('#oRef').onclick=()=>render();
  const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});
  const box=$('#ordTbl'); if(!box) return;
  if(error){ box.innerHTML=`<div class="empty">โหลดไม่ได้: ${esc(error.message)}<br><span style="font-size:12px">(ยังไม่ได้สร้างตาราง orders ใน Supabase?)</span></div>`; return; }
  if(!data||!data.length){ box.innerHTML='<div class="empty">ยังไม่มีคำสั่งซื้อ</div>'; return; }
  const sc={pending:'#fef3c7;color:#b45309',paid:'#dcfce7;color:#16a34a',cancelled:'#fee2e2;color:#dc2626'};
  const st={pending:'รอชำระ',paid:'ชำระแล้ว',cancelled:'ยกเลิก'};
  const sum=data.filter(o=>o.status==='paid').reduce((s,o)=>s+Number(o.amount||0),0);
  const pend=data.filter(o=>o.status==='pending').length;
  v.insertBefore(el(`<div class="cards">
    <div class="kpi b1"><div class="lab">🧾 คำสั่งซื้อทั้งหมด</div><div class="val">${num(data.length)}</div></div>
    <div class="kpi b3"><div class="lab">⏳ รอชำระ</div><div class="val">${num(pend)}</div></div>
    <div class="kpi b2"><div class="lab">💰 ยอดที่ชำระแล้ว</div><div class="val money">${money(sum)}</div></div>
  </div>`), panel);
  const rows=data.map(o=>`<tr>
    <td>${esc(fmtDateTime(o.created_at))}</td>
    <td><strong>${esc(o.company||'-')}</strong>
      ${o.buyer_type==='juristic'
        ? '<span class="chip" style="background:#e0e7ff;color:#4338ca">🏢 นิติบุคคล</span>'
        : '<span class="chip" style="background:#f1f5f9;color:#475569">👤 บุคคล</span>'}
      <br><span class="muted" style="font-size:12px">${esc(o.email||'')}${o.phone?' · '+esc(o.phone):''}${o.tax_id?'<br>เลขภาษี '+esc(o.tax_id)+(o.branch?' ('+esc(o.branch)+')':''):''}${o.address?'<br>'+esc(o.address):''}</span></td>
    <td>${esc(o.plan||'-')}<br><span class="muted" style="font-size:12px">${num(o.employees||0)} คน · ${o.cycle==='yearly'?'รายปี':'รายเดือน'}</span></td>
    <td class="num"><strong>${money(o.amount)}</strong></td>
    <td><span class="chip" style="background:${sc[o.status]||sc.pending}">${st[o.status]||o.status}</span></td>
    <td style="text-align:right">
      <select data-st="${o.id}" style="padding:5px 8px;border:1px solid var(--line);border-radius:7px">
        ${Object.keys(st).map(k=>`<option value="${k}" ${o.status===k?'selected':''}>${st[k]}</option>`).join('')}
      </select></td>
  </tr>`).join('');
  const tbl=el(`<table><thead><tr><th>วันที่</th><th>ผู้สั่งซื้อ</th><th>แพ็กเกจ</th><th class="num">ยอด</th><th>สถานะ</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`);
  tbl.querySelectorAll('[data-st]').forEach(s2=>s2.onchange=async()=>{
    const ord=data.find(o=>String(o.id)===s2.dataset.st);
    const {error:e2}=await sb.from('orders').update({status:s2.value}).eq('id',ord.id);
    if(e2){ toast('อัปเดตไม่สำเร็จ'); return; }
    // ชำระแล้ว → ต่ออายุสิทธิ์ใช้งานให้ลูกค้าอัตโนมัติ
    if(s2.value==='paid'){
      const months = ord.cycle==='yearly' ? 12 : 1;
      const {data:pf}=await sb.from('profiles').select('id,paid_until').eq('email',ord.email).maybeSingle();
      if(!pf){ toast(`อัปเดตแล้ว — แต่ยังไม่พบบัญชี ${ord.email} (ลูกค้าต้องสมัครก่อน)`); render(); return; }
      const base=new Date(Math.max(Date.now(), pf.paid_until?new Date(pf.paid_until).getTime():0));
      base.setMonth(base.getMonth()+months);
      const {error:e3}=await sb.from('profiles').update({paid_until:base.toISOString(), plan:ord.plan}).eq('id',pf.id);
      toast(e3?('ต่ออายุไม่สำเร็จ: '+e3.message):`✅ ต่ออายุ ${ord.email} ถึง ${fmtDate(base.toISOString().slice(0,10))}`);
    } else toast('อัปเดตสถานะแล้ว');
    render();
  });
  box.innerHTML=''; box.appendChild(tbl);
}
/* ============ แจ้งปัญหา / คำแนะนำ (แอดมินเท่านั้น) ============ */
async function vFeedback(v){
  v.appendChild(el(`<div class="toolbar"><h2 style="font-size:16px">💬 แจ้งปัญหา / คำแนะนำ จากผู้ใช้</h2>

/* ---------- ข้อมูลค่าจ้างรายเดือนสำหรับ กท.20 ก ----------
   ค่าจ้างตามกฎหมายประกันสังคม = ค่าจ้างฐาน + ค่าตอบแทนประจำ
   (ไม่รวมค่าล่วงเวลาและโบนัส ตามหมายเหตุในแบบฟอร์ม)                    */
const KT20_CAP=20000;   // เพดานค่าจ้างที่ต้องแจ้ง 20,000/คน/เดือน
// ดึงยอดของเดือนนั้นจากข้อมูลประกันสังคมรายเดือน (ฐานเดียวกับ สปส. 1-10)
function kt20Month(year, m){
  const p=`${year}-${String(m).padStart(2,'0')}`;
  let count=0, salary=0, daily=0, other=0, excess=0, ot=0, bonus=0, sso=0;
  DB.employees.forEach(e=>{
    if(!activeInMonth(e,year,m)) return;
    if(ssoExempt(e)) return;                     // กรรมการ ไม่นับในแบบประกันสังคม
    const r=readRec(p,e.id);
    const base=basePay(e,r,p);
    const oth=SSO_WAGE_KEYS.reduce((s,k)=>s+Number(r.earn[k]||0),0);
    const wage=ssoWage(e,r,p);                   // = base + oth (ค่าจ้าง ปกส. ของคนนี้เดือนนี้)
    if(wage<=0) return;
    count++;
    if(e.payType==='daily') daily+=base; else salary+=base;
    other+=oth;
    excess+=Math.max(0, wage-KT20_CAP);          // ส่วนที่เกินเพดาน (คิดรายคน)
    sso+=Number(r.ded.sso||0);                   // เงินสมทบที่นำส่งเดือนนั้น
    ot+=Number(r.earn.ot||0); bonus+=Number(r.earn.bonus||0);
  });
  const total=salary+daily+other;
  return {count, salary, daily, other, total, excess, net:total-excess, ot, bonus, sso};
}
function kt20Year(year){
  const months=Array.from({length:12},(_,i)=>kt20Month(year,i+1));
  const sum=months.reduce((a,b)=>({count:0,salary:a.salary+b.salary,daily:a.daily+b.daily,other:a.other+b.other,
    total:a.total+b.total,excess:a.excess+b.excess,net:a.net+b.net,ot:a.ot+b.ot,bonus:a.bonus+b.bonus,sso:a.sso+b.sso}),
    {salary:0,daily:0,other:0,total:0,excess:0,net:0,ot:0,bonus:0,sso:0});
  sum.count=Math.max(0,...months.map(x=>x.count));    // จำนวนลูกจ้างสูงสุดในปี
  // ค่าจ้างต่ำสุด
  const monthlyEmps=DB.employees.filter(e=>(e.payType||'monthly')==='monthly'&&+e.salary>0);
  const dailyEmps=DB.employees.filter(e=>e.payType==='daily'&&+e.salary>0);
  sum.minMonthly = monthlyEmps.length?Math.min(...monthlyEmps.map(e=>+e.salary)):0;
  sum.minDaily   = dailyEmps.length?Math.min(...dailyEmps.map(e=>+e.salary)):0;
  return {months, sum};
}

  DB.employees.forEach(e=>{ if(e.startDate) yset.add(+e.startDate.split('-')[0]); if(e.resignDate) yset.add(+e.resignDate.split('-')[0]); });

  const list=DB.employees.filter(e=>{

      <td><input type="date" data-resign="${e.id}" value="${e.resignDate||''}" style="padding:6px 8px;border:1px solid var(--line);border-radius:7px"></td>
      <td>
        <select data-rsn="${e.id}" ${isOut?'':'disabled'} style="padding:6px 8px;border:1px solid var(--line);border-radius:7px;min-width:150px;${isOut?'':'background:#f8fafc;color:#94a3b8'}">
          <option value="">${isOut?'— เลือกเหตุผล —':'ใส่วันที่ลาออกก่อน'}</option>
          ${RESIGN_REASONS.map(([k,l])=>`<option value="${k}" ${e.resignReason===k?'selected':''}>${l}</option>`).join('')}
        </select>
        ${isOut&&e.resignReason?`<input data-rsnote="${e.id}" value="${esc(e.resignNote||'')}" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"

        ${isOut&&resignNeedsSeverance(e.resignReason)?`<div class="muted" style="font-size:11px;margin-top:4px;color:#b45309;line-height:1.5">⚠️ ${esc(resignSeveranceNote(e.resignReason))}</div>`:''}
      </td>
      <td style="text-align:right">${isOut?`<button class="btn ghost sm" data-clear="${e.id}">↩️ ยกเลิกลาออก</button>`:''}</td>
    </tr>`;
  }).join('');
  const scope = resignFilter==='active'?'เฉพาะที่ทำงานอยู่' : resignFilter==='resigned'?`เฉพาะที่ลาออก${yr===null?'':' ปี '+(yr+543)}` : 'ทั้งหมด';
  const panel=el(`<div class="panel"><div class="phead"><h2>บันทึกการลาออก — ใส่วันที่ลาออกได้เลย</h2>
      <div class="sp"><span class="muted" style="font-size:12px">แสดง ${scope} · ${list.length} คน</span></div></div>
    <div class="pbody" style="padding:0"><div class="tbl-wrap"><table>

    save(); render(); toast(i.value?'บันทึกวันลาออกแล้ว — เลือกเหตุผลในช่องถัดไป':'ล้างวันลาออกแล้ว');
  });
  panel.querySelectorAll('select[data-rsn]').forEach(s=>s.onchange=()=>{
    const emp=DB.employees.find(x=>x.id===s.dataset.rsn);

  panel.querySelectorAll('input[data-rsnote]').forEach(i=>i.onchange=()=>{

      ⚠️ <strong>ไม่ผ่านทดลองงาน</strong> ไม่ได้แปลว่าไม่ต้องจ่ายค่าชดเชย — ถ้าทำงานครบ <strong>120 วัน</strong> แล้วยังต้องจ่ายตามกฎหมาย ช่วงทดลองงานไม่ใช่ข้อยกเว้น</div></div>`));
}
/* ---------- เหตุผลการลาออก ----------
   แยกเป็นรหัสคงที่ เพราะมีผลต่างกันทางกฎหมาย:
   ลาออกเอง = ไม่ต้องจ่ายค่าชดเชย · เลิกจ้าง = ต้องจ่ายตามอายุงาน (ม.118)
   ใช้กรอกเหตุผลออกจากงานในแบบ สปส.6-09 ได้ด้วย */
const RESIGN_REASONS=[
  ['voluntary',  'ลาออกเอง',              false],
  ['contract',   'สิ้นสุดสัญญาจ้าง',        false],
  ['probation',  'ไม่ผ่านทดลองงาน',        true,
    'ทำงานครบ 120 วันแล้วต้องจ่ายค่าชดเชย แม้ยังอยู่ในช่วงทดลองงาน — ไม่ครบ 120 วันไม่ต้องจ่าย'],
  ['retire',     'เกษียณอายุ',             true ],
  ['layoff',     'เลิกจ้าง',               true ],
  ['redundancy', 'เลิกจ้างเพราะยุบหน่วยงาน', true ],
  ['misconduct', 'ให้ออกเพราะกระทำผิด',     false],
  ['death',      'เสียชีวิต',              true ],
  ['other',      'อื่น ๆ',                 false]
];
function resignReasonLabel(code){
  const r=RESIGN_REASONS.find(x=>x[0]===code);
  return r?r[1]:'';
}
/* ต้องจ่ายค่าชดเชยไหม — ใช้เตือนบนหน้าจอเท่านั้น ไม่ได้คำนวณเงินให้ */
function resignNeedsSeverance(code){
  const r=RESIGN_REASONS.find(x=>x[0]===code);
  return !!(r && r[2]);
}
/* บางกรณีมีเงื่อนไขเฉพาะ ใช้ข้อความของตัวเอง ถ้าไม่มีก็ใช้ข้อความกลาง */
function resignSeveranceNote(code){
  const r=RESIGN_REASONS.find(x=>x[0]===code);
  if(!r || !r[2]) return '';
  return r[3] || 'กรณีนี้อาจต้องจ่ายค่าชดเชย';
}
function resignedBeforeToday(e){ if(!e.resignDate) return false; const [y,m,d]=e.resignDate.split('-').map(Number); return new Date(y,m-1,d) < new Date(); }
/* ============ ADMIN — รายชื่อผู้ใช้ทั้งหมด ============ */
/* จำการเปลี่ยนสิทธิ์ครั้งล่าสุดไว้ เผื่อแอดมินกดผิดแล้วอยากย้อนกลับ */
let LAST_PLAN=null;
const isPrem=u=>String(u.plan_type||'standard')==='premium';
const isFirmU=u=>String(u.edition||'single')==='firm';
/* ป้ายบอกระดับแพ็กเกจ — ช่วงทดลองใช้ได้ครบทุกฟีเจอร์อยู่แล้ว บอกไว้กันเข้าใจผิด */
function planBadge(u,s){
  const prem=isPrem(u);
  const cap = u.max_employees ? `สูงสุด ${u.max_employees} คน` : 'ไม่จำกัดจำนวนคน';
  const firm = isFirmU(u);
  const tag = firm
    ? '<span class="chip" style="background:#f3e8ff;color:#7e22ce;font-weight:700">🏦 สำนักงานบัญชี</span>'
    : (prem
      ? '<span class="chip" style="background:#ede9fe;color:#6d28d9;font-weight:700">💎 พรีเมี่ยม</span>'
      : '<span class="chip" style="background:#e2e8f0;color:#475569;font-weight:700">มาตรฐาน</span>');
  const coCap = u.max_companies ? `สูงสุด ${u.max_companies} บริษัท` : 'ไม่จำกัดจำนวนบริษัท';
  const note = firm
    ? `<br><span class="muted" style="font-size:11.5px">${coCap} · พนักงานไม่จำกัด</span>`
    : ((s.t==='ทดลองใช้')
      ? '<br><span class="muted" style="font-size:11.5px">ช่วงทดลอง — ใช้ได้ครบทุกฟีเจอร์</span>'
      : `<br><span class="muted" style="font-size:11.5px">${cap}</span>`);
  return tag+note;
}
async function applyPlan(u, patch, msg){
  const prev={ id:u.id, email:u.email, paid_until:u.paid_until??null, plan:u.plan??null,
               plan_type:u.plan_type??null, max_employees:u.max_employees??null,
               edition:u.edition??null, max_companies:u.max_companies??null, msg };
  const {error}=await sb.from('profiles').update(patch).eq('id',u.id);
  if(error){ toast('ไม่สำเร็จ: '+error.message); return false; }
  LAST_PLAN=prev;      // บันทึกค่าเดิม "หลัง" อัปเดตสำเร็จเท่านั้น
  toast(msg); render(); return true;
}

/* ============ 0. DASHBOARD ============ */
let dashMode = 'month'; // 'month' | 'year'
/* ช่วงเดือนของกราฟบนแดชบอร์ด — null = ใช้ทั้งปีเท่าที่มีข้อมูล */
let chartFrom = null, chartTo = null, chartRangeY = null;
const C = {brand:'#0e3a5c',brandL:'#a7f3d0',green:'#059669',greenL:'#6ee7b7',red:'#dc2626',warn:'#d97706',purple:'#7c3aed',slate:'#94a3b8'};

function periodHasData(p){ const pp=DB.payroll[p]; return !!(pp && Object.keys(pp).length); }
// พนักงานคนนี้ทำงานอยู่ในเดือนนี้หรือไม่ (ตามวันเริ่มงาน)
function activeInMonth(emp, year, month){
  if(emp.startDate){ const [sy,sm]=emp.startDate.split('-').map(Number); if(sy>year||(sy===year&&sm>month)) return false; }
  if(emp.resignDate){ const [ry,rm]=emp.resignDate.split('-').map(Number); if(ry<year||(ry===year&&rm<month)) return false; }
  return true;
}
// คำนวณยอดรวมของเดือน (ประมาณการทั้งปี: ใช้ค่าที่กรอกจริงถ้ามี ไม่งั้นใช้เงินเดือนฐาน) เคารพวันเริ่มงาน
function monthCompute(year, m){
  const p=`${year}-${String(m).padStart(2,'0')}`;
  const emps=DB.employees.filter(e=>activeInMonth(e,year,m));
  let salary=0,earn=0,gross=0,ded=0,net=0,tax=0;
  const depts={}; const earnBy={}, dedBy={};
  let salMonthly=0, salDaily=0;
  emps.forEach(e=>{ const c=calc(e,p); const r=readRec(p,e.id);
    salary+=c.base; earn+=c.earnTotal; gross+=c.gross; ded+=c.dedTotal; net+=c.net; tax+=Number(r.ded.tax||0);
    if(e.payType==='daily') salDaily+=c.base; else salMonthly+=c.base;
    EARN_FIELDS.forEach(([k])=>{ earnBy[k]=(earnBy[k]||0)+Number(r.earn[k]||0); });
    DED_FIELDS.forEach(([k])=>{ dedBy[k]=(dedBy[k]||0)+Number(r.ded[k]||0); });
    const d=e.dept||'(ไม่ระบุ)'; const o=depts[d]=depts[d]||{dept:d,count:0,salary:0,gross:0,ded:0,net:0};
    o.count++; o.salary+=c.base; o.gross+=c.gross; o.ded+=c.dedTotal; o.net+=c.net; });
  return {p, count:emps.length, salary, earn, gross, ded, net, tax, depts, earnBy, dedBy, salMonthly, salDaily};
}
/* เดือนสุดท้ายที่ถือว่า "เกิดขึ้นจริง" แล้วในปีนั้น — ปีที่ผ่านมาคือ 12, ปีอนาคตคือ 0 */
function lastRealYear(){ return new Date().getFullYear(); }
function lastRealMonth(year){
  const now=new Date(), y=now.getFullYear();
  if(year<y) return 12;
  if(year>y) return 0;
  return now.getMonth()+1;
}
/* กราฟแสดงเฉพาะเดือนที่เกิดขึ้นจริงแล้ว และทำเงินเดือนไปแล้วเท่านั้น
   ต้องเช็คปฏิทินด้วย เพราะแค่เปิดดูหน้าคำนวณเงินเดือนของเดือนอนาคต
   ระบบก็สร้างเรคคอร์ดพร้อมหักภาษี/ปกส. อัตโนมัติไว้แล้ว
   ทำให้เช็คว่า "มีข้อมูล" อย่างเดียวไม่พอ */
function monthSeries(year, curM, range){
  const out=[];
  const lim=lastRealMonth(year);
  const a=range&&range.from?range.from:1, b=range&&range.to?range.to:12;
  for(let m=1;m<=12;m++){
    if(m>lim) continue;                       // เดือนที่ยังมาไม่ถึง — ไม่แสดงไม่ว่ากรณีใด
    if(m<a||m>b) continue;                    // นอกช่วงเดือนที่ผู้ใช้เลือก
    const p=`${year}-${String(m).padStart(2,'0')}`;
    if(!periodHasData(p)) continue;           // เดือนที่ผ่านมาแล้วแต่ยังไม่ได้ทำเงินเดือน
    const mc=monthCompute(year,m);
    out.push({label:THAI_MONTHS_ABBR[m-1], value:mc.net, gross:mc.gross, ded:mc.ded, salary:mc.salary, active:m===curM, has:mc.count>0, entered:true, mon:m});
  }
  return out;
}
/* เดือนที่ทำเงินเดือนแล้วจริงของปีนั้น คืนเป็นเลขเดือน 1-12 */
function monthsWithData(year){
  const out=[], lim=lastRealMonth(year);
  for(let m=1;m<=lim;m++){
    if(periodHasData(`${year}-${String(m).padStart(2,'0')}`)) out.push(m);
  }
  return out;
}
function yearTotals(year){
  let salary=0,earn=0,gross=0,ded=0,net=0,tax=0,entered=0;
  const earnBy={}, dedBy={};
  let salMonthly=0, salDaily=0;
  for(let m=1;m<=12;m++){ const mc=monthCompute(year,m);
    salary+=mc.salary; earn+=mc.earn; gross+=mc.gross; ded+=mc.ded; net+=mc.net; tax+=mc.tax;
    salMonthly+=mc.salMonthly||0; salDaily+=mc.salDaily||0;
    EARN_FIELDS.forEach(([k])=>{ earnBy[k]=(earnBy[k]||0)+Number((mc.earnBy||{})[k]||0); });
    DED_FIELDS.forEach(([k])=>{ dedBy[k]=(dedBy[k]||0)+Number((mc.dedBy||{})[k]||0); });
    if(periodHasData(mc.p)) entered++; }
  const dec=DB.employees.filter(e=>activeInMonth(e,year,12));
  return {count:dec.length, salary, earn, gross, ded, net, tax, entered, earnBy, dedBy,
    salMonthly, salDaily,
    nMonthly:dec.filter(e=>e.payType!=='daily').length, nDaily:dec.filter(e=>e.payType==='daily').length};
}
/* ยอดรวมของช่วงเดือน a..b นับเฉพาะเดือนที่ทำเงินเดือนแล้วจริง
   จำนวนพนักงานใช้ของเดือนสุดท้ายในช่วง เพราะเป็นภาพปัจจุบันที่สุด */
function rangeTotals(year, a, b){
  let salary=0,earn=0,gross=0,ded=0,net=0,tax=0,months=0,lastM=null;
  const earnBy={}, dedBy={};
  let salMonthly=0, salDaily=0;
  for(let m=a;m<=b;m++){
    const p=`${year}-${String(m).padStart(2,'0')}`;
    if(!periodHasData(p)) continue;
    const t=periodTotals(p);
    months++; lastM=m;
    salary+=t.salary; earn+=t.earn; gross+=t.gross; ded+=t.ded; net+=t.net; tax+=t.tax;
    salMonthly+=t.salMonthly||0; salDaily+=t.salDaily||0;
    EARN_FIELDS.forEach(([k])=>{ earnBy[k]=(earnBy[k]||0)+Number(t.earnBy[k]||0); });
    DED_FIELDS.forEach(([k])=>{ dedBy[k]=(dedBy[k]||0)+Number(t.dedBy[k]||0); });
  }
  const ref = lastM===null ? null : periodTotals(`${year}-${String(lastM).padStart(2,'0')}`);
  return {months, salary, earn, gross, ded, net, tax, earnBy, dedBy, salMonthly, salDaily,
          count: ref?ref.count:0, nMonthly: ref?ref.nMonthly:0, nDaily: ref?ref.nDaily:0, lastM};
}
function deptSummaryRange(year, a, b){
  const map={};
  for(let m=a;m<=b;m++){
    const p=`${year}-${String(m).padStart(2,'0')}`;
    if(!periodHasData(p)) continue;
    const mc=monthCompute(year,m);
    Object.values(mc.depts).forEach(d=>{ const o=map[d.dept]=map[d.dept]||{dept:d.dept,count:0,salary:0,gross:0,ded:0,net:0};
      o.gross+=d.gross; o.ded+=d.ded; o.net+=d.net; o.salary+=d.salary; o.count=Math.max(o.count,d.count); });
  }
  return Object.values(map).sort((a2,b2)=>a2.dept.localeCompare(b2.dept,'th'));
}
function deptSummaryYear(year){
  const map={};
  for(let m=1;m<=12;m++){ const mc=monthCompute(year,m);
    Object.values(mc.depts).forEach(d=>{ const o=map[d.dept]=map[d.dept]||{dept:d.dept,count:0,salary:0,gross:0,ded:0,net:0};
      o.gross+=d.gross; o.ded+=d.ded; o.net+=d.net; o.salary+=d.salary; o.count=Math.max(o.count,d.count); }); }
  return Object.values(map).sort((a,b)=>a.dept.localeCompare(b.dept,'th'));
}

/* ---- SVG charts (self-contained) ---- */
function barChart(items,{color=C.brand,clickable=false,height=300}={}){
  const W=960,H=300,padT=22,padB=30,padL=14,padR=14;
  const innerH=H-padT-padB, innerW=W-padL-padR, n=items.length||1, slot=innerW/n;
  const max=Math.max(1,...items.map(i=>i.value));
  const cursor = clickable ? 'cursor:pointer' : '';
  let g='';
  for(let i=1;i<=4;i++){ const y=padT+innerH-(innerH*i/4); g+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#eef1f5" stroke-width="1"/>`; }
  items.forEach((it,i)=>{
    const hasVal = it.has!==false && it.value>0;
    const bh = hasVal ? (it.value/max)*innerH : 4;       // แท่งจางสำหรับเดือนที่ยังไม่มีข้อมูล
    const bw=slot*0.6, x=padL+i*slot+(slot-bw)/2, y=padT+innerH-bh;
    const fill = it.active ? C.brand : (hasVal ? color : '#e2e8f0');
    const cx=padL+i*slot+slot/2;
    // พื้นที่คลิกทั้งช่อง (โปร่งใส) เพื่อกดง่าย
    if(clickable) g+=`<rect x="${padL+i*slot}" y="${padT}" width="${slot}" height="${innerH}" fill="transparent" data-i="${i}" style="cursor:pointer"><title>${it.label}: ${money(it.value)}</title></rect>`;
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,bh)}" rx="4" fill="${fill}" data-i="${i}" style="${cursor}"><title>${it.label}: ${money(it.value)}</title></rect>`;
    if(hasVal) g+=`<text x="${x+bw/2}" y="${y-6}" font-size="13" text-anchor="middle" fill="#374151">${shortMoney(it.value)}</text>`;
    g+=`<text x="${cx}" y="${H-10}" font-size="13" text-anchor="middle" fill="${it.active?'#0e3a5c':'#6b7280'}" font-weight="${it.active?'700':'400'}">${it.label}</text>`;
  });
  g+=`<line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#cbd5e1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:${height}px;overflow:visible">${g}</svg>`;
}
function donutChart(segments){
  const segs=segments.filter(s=>s.value>0);
  const total=segs.reduce((s,x)=>s+x.value,0);
  const cx=95,cy=95,R=80,r=52;
  let paths='';
  if(total<=0){ paths=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="#e5e7eb" stroke-width="${R-r}"/>`; }
  else if(segs.length===1){ paths=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${segs[0].color}" stroke-width="${R-r}"/>`; }
  else { let a=-Math.PI/2;
    segs.forEach(s=>{ const frac=s.value/total, a2=a+frac*2*Math.PI, large=frac>0.5?1:0;
      const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
      const xi1=cx+r*Math.cos(a2),yi1=cy+r*Math.sin(a2),xi2=cx+r*Math.cos(a),yi2=cy+r*Math.sin(a);
      paths+=`<path d="M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} L${xi1} ${yi1} A${r} ${r} 0 ${large} 0 ${xi2} ${yi2} Z" fill="${s.color}"><title>${s.label}: ${money(s.value)}</title></path>`;
      a=a2; });
  }
  return `<svg viewBox="0 0 190 190" style="width:190px;height:190px">${paths}
    <text x="${cx}" y="${cy-4}" font-size="13" text-anchor="middle" fill="#6b7280">รวมรายได้</text>
    <text x="${cx}" y="${cy+16}" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">${shortMoney(total)}</text></svg>`;
}
function legend(items){
  return `<div style="display:flex;flex-direction:column;gap:10px">${items.filter(i=>i.value>0||i.always).map(i=>`
    <div style="display:flex;align-items:center;gap:8px">
      <span style="width:12px;height:12px;border-radius:3px;background:${i.color};flex-shrink:0"></span>
      <span style="flex:1">${i.label}</span>
      <strong class="money">${money(i.value)}</strong>
    </div>`).join('')}</div>`;
}

/* รายละเอียดใต้ตัวเลขรวมในแดชบอร์ด — โชว์เฉพาะรายการที่ไม่เป็นศูนย์
   เรียงจากมากไปน้อย เกิน 4 รายการยุบเป็น "อื่น ๆ" รวมกัน กันการ์ดยาวเกิน */
function kpiBreak(by, fields, total){
  const rows=fields.map(([k,lab])=>({lab, v:Number((by||{})[k]||0)}))
    .filter(x=>Math.abs(x.v)>=0.005)
    .sort((a,b)=>b.v-a.v);
  if(!rows.length) return '<div class="kpi-brk muted">ยังไม่มีรายการ</div>';
  const top=rows.slice(0,4);
  const rest=rows.slice(4);
  if(rest.length) top.push({lab:'อื่น ๆ ('+rest.length+' รายการ)', v:rest.reduce((s,x)=>s+x.v,0)});
  const pct=v=>total>0?' <span class="kpi-pct">'+Math.round(v/total*100)+'%</span>':'';
  return '<div class="kpi-brk">'+top.map(x=>
    '<div class="kpi-brk-row"><span class="kpi-brk-lab">'+esc(x.lab)+'</span>'+
    '<span class="kpi-brk-val">'+money(x.v)+pct(x.v)+'</span></div>').join('')+'</div>';
}
function vDashboard(v){
  const [curY,curM]=PERIOD.split('-').map(Number);
  const isYear = dashMode==='year';
  /* ── ช่วงเดือน: ต้องรู้ก่อนวาดการ์ด KPI เพราะทั้งหน้าอิงช่วงนี้ ── */
  const avail=monthsWithData(curY);
  if(chartRangeY!==curY){ chartRangeY=curY; chartFrom=null; chartTo=null; }
  const lo=avail.length?avail[0]:1, hi=avail.length?avail[avail.length-1]:12;
  let cf=chartFrom==null?lo:Math.min(Math.max(chartFrom,lo),hi);
  let ct=chartTo==null?hi:Math.min(Math.max(chartTo,lo),hi);
  if(cf>ct){ const s=cf; cf=ct; ct=s; }
  const rangeAll = cf===lo && ct===hi;
  const t = isYear ? yearTotals(curY) : rangeTotals(curY, cf, ct);
  const rangeLabel = !avail.length ? `ปี ${curY+543}`
    : cf===ct ? periodLabel(`${curY}-${String(cf).padStart(2,'0')}`)
    : `${THAI_MONTHS_ABBR[cf-1]} – ${THAI_MONTHS_ABBR[ct-1]} ${curY+543}`;
  const scopeLabel = isYear ? `ปี ${curY+543}` : rangeLabel;

  // mode toggle
  const tb=el(`<div class="toolbar" style="margin-bottom:18px">
    <div class="seg" style="display:inline-flex;background:#eaf6f1;border-radius:10px;padding:3px">
      <button class="segbtn ${!isYear?'on':''}" data-m="month">📅 รายเดือน</button>
      <button class="segbtn ${isYear?'on':''}" data-m="year">📆 รายปี</button>
    </div>
    <span class="muted" style="margin-left:6px">แสดงข้อมูล: <strong>${scopeLabel}</strong>${isYear?` · ประมาณการครบ 12 เดือน (กรอกจริง ${t.entered} เดือน)`:t.months>1?` · รวม ${num(t.months)} เดือน`:''}</span>

function deptSummary(p){
  const map={};
  DB.employees.forEach(e=>{ const c=calc(e,p); const d=e.dept||'(ไม่ระบุ)';
    map[d] = map[d]||{dept:d,count:0,salary:0,gross:0,ded:0,net:0};
    map[d].count++; map[d].salary+=c.base; map[d].gross+=c.gross; map[d].ded+=c.dedTotal; map[d].net+=c.net;
  });
  return Object.values(map).sort((a,b)=>a.dept.localeCompare(b.dept,'th'));
}

function salaryHistModal(empId){

        สลิปและเอกสารย้อนหลังจึงไม่เปลี่ยน · งวดที่ขึ้นกลางเดือนจะคิดเฉลี่ยรายวันให้
      </p>

        <div class="field"><label>อัตราใหม่ (${unit}) *</label><input id="sh_val" type="number" step="0.01" min="0" placeholder="${e.salary||0}"></div>

      </div>`;
    openModal(`ประวัติเงินเดือน — ${e.name}`, body,

      }]]);

/* ลบข้อมูลทุกอย่างที่ผูกกับพนักงาน — เดิมลบแค่ตัวพนักงานกับเงินเดือน
   ใบลา เวลาเข้างาน และตารางกะจึงค้างอยู่ ทำให้การ์ดสรุปนับใบลาของคนที่ไม่มีแล้ว */
function purgeEmpData(ids){
  const gone = ids instanceof Set ? ids : new Set(ids);
  if(!gone.size) return { leave:0, attend:0, shift:0, payroll:0 };
  const n={leave:0, attend:0, shift:0, payroll:0};

  if(Array.isArray(DB.leave)){
    const before=DB.leave.length;
    DB.leave=DB.leave.filter(l=>!gone.has(l.empId));
    n.leave=before-DB.leave.length;
  }
  Object.values(DB.payroll||{}).forEach(function(pp){
    gone.forEach(function(id){ if(pp[id]!==undefined){ delete pp[id]; n.payroll++; } });
  });
  Object.values(DB.attend||{}).forEach(function(pp){
    gone.forEach(function(id){ if(pp[id]!==undefined){ delete pp[id]; n.attend++; } });
  });
  Object.values(DB.shiftPlan||{}).forEach(function(pp){
    gone.forEach(function(id){ if(pp[id]!==undefined){ delete pp[id]; n.shift++; } });
  });
  return n;
}
/* บอกว่าลบอะไรไปบ้าง ถ้าไม่มีอะไรนอกจากตัวพนักงานก็ไม่ต้องพูดถึง */
function purgeSummary(n){
  const p=[];
  if(n.leave) p.push('ใบลา '+n.leave+' ใบ');
  if(n.attend) p.push('เวลาเข้างาน '+n.attend+' รายการ');
  if(n.payroll) p.push('เงินเดือน '+n.payroll+' งวด');
  if(n.shift) p.push('ตารางกะ '+n.shift+' รายการ');
  return p.length ? ' · ลบ'+p.join(' · ') : '';
}

/* ---------- รูปพนักงาน ----------
   เก็บเป็น data URI ย่อแล้ว (180×180 JPEG) ประมาณ 6–12 KB ต่อคน
   ครอบตัดตรงกลางเป็นสี่เหลี่ยมจัตุรัสให้อัตโนมัติ ไม่บิดสัดส่วน */
const EMP_PHOTO_SIZE=180;
function readEmpPhoto(file, cb){
  if(!file) return;
  if(!/^image\//.test(file.type||'')){ toast('ไฟล์นี้ไม่ใช่รูปภาพ'); return; }
  if(file.size > 12*1024*1024){ toast('ไฟล์ใหญ่เกิน 12 MB — ใช้รูปเล็กกว่านี้'); return; }
  const fr=new FileReader();
  fr.onerror=()=>toast('อ่านไฟล์ไม่สำเร็จ');
  fr.onload=()=>{
    const img=new Image();
    img.onerror=()=>toast('เปิดรูปนี้ไม่ได้ — ลองไฟล์ JPG หรือ PNG');
    img.onload=()=>{
      try{
        const S=EMP_PHOTO_SIZE, cv=document.createElement('canvas');
        cv.width=S; cv.height=S;
        const cx=cv.getContext('2d');
        cx.fillStyle='#fff'; cx.fillRect(0,0,S,S);
        const m=Math.min(img.width,img.height);          // ครอบตัดจัตุรัสจากกลางภาพ
        cx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
        cb(cv.toDataURL('image/jpeg',0.72));
      }catch(err){ toast('ย่อรูปไม่สำเร็จ'); }
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
