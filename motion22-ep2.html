const $=id=>document.getElementById(id);
const ease=x=>x<0?0:x>1?1:x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const lerp=(a,b,p)=>a+(b-a)*p;
$('ep').textContent='EP.'+D.ep+' / 2';$('ttl').innerHTML=D.title;$('end').querySelector('h2').innerHTML=D.next;
const win=$('win');
function camOf(s){ // กรอบที่จะโชว์ (หน่วย px ของหน้าเว็บ 1600x900)
  const WW=win.clientWidth,WH=win.clientHeight,AR=WH/WW;
  let fx,fy,r;
  if(s.hl){const[hx,hy,hw,hh]=s.hl;r=Math.min(Math.max(hw*1.15,hh*1.18/AR,s.zoom?480:620),780);fx=hx+Math.min(hw,r*.9)/2;fy=hy+hh/2;}
  else if(s.cur){fx=s.cur[0];fy=s.cur[1];r=760;}
  else {fx=900;fy=450;r=1000;}
  r=Math.min(r,900/AR,1600);const rh=r*AR;
  let x0=fx-r/2,y0=fy-rh/2;x0=Math.max(0,Math.min(1600-r,x0));y0=Math.max(0,Math.min(900-rh,y0));if(rh>900)y0=(900-rh)/2;
  const k=WW/r;return {k,x:-x0*k,y:-y0*k};
}

  }
  const c1=camOf(s),c0=prev?camOf(prev):c1,p=ease((t-s.a)/.7);

  const hl=$('hl');if(s.hl){const[hx,hy,hw,hh]=s.hl,pad=8;Object.assign(hl.style,{left:hx-pad+'px',top:hy-pad+'px',width:hw+pad*2+'px',height:hh+pad*2+'px',opacity:s.typing?1:Math.max(0,Math.min(1,(t-s.a-.35)/.3))})}else hl.style.opacity=0;
  let from=null;for(let j=i-1;j>=0;j--){if(S[j].cur){from=S[j].cur;break}}
  const cur=$('cur'),rip=$('rip');
  if(s.cur){const q=ease((t-s.a)/.6),f=from||[s.cur[0]+120,s.cur[1]+160];
    Object.assign(cur.style,{left:lerp(f[0],s.cur[0],q)+'px',top:lerp(f[1],s.cur[1],q)+'px',opacity:1,transform:`scale(${1.6/Math.sqrt(k*2)})`});
    const rc=(t-s.a-.6)/.45;if(s.click&&rc>0&&rc<1){Object.assign(rip.style,{left:s.cur[0]+'px',top:s.cur[1]+'px',opacity:1-rc,transform:`scale(${.3+rc*1.4})`})}else rip.style.opacity=0;}
  else{cur.style.opacity=0;rip.style.opacity=0}
  const ln=D.lines.find(l=>t>=l.t0&&t<l.t1)||D.lines[D.lines.length-1];

  const sp=t>=ln.s&&t<ln.s+ln.dur;$('es').style.transform=sp?`scale(${1+.035*Math.sin(t*38)},${1-.035*Math.sin(t*38)})`:'none';
  const last=D.lines[D.lines.length-1];$('end').style.opacity=Math.min(1,Math.max(0,(t-last.t0)/.45));
  const a=Math.min(1,t/.5);$('ttl').style.opacity=a;$('ep').style.opacity=a;$('ttl').style.transform=`translateY(${(1-a)*2}em)`;
  $('bar').style.width=Math.min(100,t/D.TOT*100)+'%';
}
window.__total=D.TOT;window.__render=render;window.__drop=D.lines[1].t0;
