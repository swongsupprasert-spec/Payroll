<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วิดีโอสอนใช้งานโปรแกรมเงินเดือน (16:9)</title>
<style>
  :root{--brand:#2563eb;--ink:#0f172a;--good:#059669;--bad:#dc2626;--warn:#d97706}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Sarabun","Segoe UI",Tahoma,sans-serif;background:#0b1020;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
  /* กรอบวิดีโอ 16:9 แบบหน้าจอคอม */
  .stage{width:min(960px,96vw);aspect-ratio:16/9;background:linear-gradient(160deg,#eef2ff,#f8fafc);border-radius:14px;position:relative;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid #1e293b}
  .progress{position:absolute;top:0;left:0;height:5px;background:var(--brand);width:0;z-index:20}
  .brandbar{position:absolute;top:16px;left:26px;display:flex;align-items:center;gap:9px;z-index:10;color:#334155;font-weight:800;font-size:18px;letter-spacing:.3px}
  .scene{position:absolute;inset:0;padding:64px 44px 168px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;opacity:0;transform:translateY(12px) scale(.995);transition:opacity .5s,transform .5s;pointer-events:none}
  .scene.on{opacity:1;transform:none;pointer-events:auto}
  .left{display:flex;flex-direction:column;justify-content:center}
  .step{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;font-weight:700;font-size:14px;padding:6px 15px;border-radius:20px;align-self:flex-start;box-shadow:0 4px 12px rgba(37,99,235,.35)}
  .scene h2{font-size:38px;line-height:1.18;margin:16px 0 10px;color:var(--ink)}
  .scene .sub{font-size:18px;color:#475569;line-height:1.5}
  .visual{display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:0}
  /* mock ui bits */
  .mkcard{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px 18px;box-shadow:0 6px 18px rgba(15,23,42,.06);animation:pop .5s both}
  .mkcard .l{font-size:13px;color:#64748b}
  .mkcard .v{font-size:27px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 15px;font-size:16px;box-shadow:0 3px 10px rgba(15,23,42,.05);animation:slidein .5s both}
  .row .chip{background:#eef2ff;color:#1d4ed8;font-weight:700;font-size:12px;padding:2px 10px;border-radius:20px}
  .row .grow{flex:1}
  .pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700}
  .pill.m{background:#dbeafe;color:#1d4ed8}.pill.d{background:#fef3c7;color:#b45309}
  .tag{display:inline-flex;gap:7px;align-items:center;background:#fff;border:1px dashed #cbd5e1;border-radius:11px;padding:10px 13px;font-size:15px;color:#334155}
  .note{background:#fffbeb;border:1px solid #fcd34d;border-radius:13px;padding:14px 16px;font-size:15px;color:#92400e;line-height:1.55}
  .good{color:var(--good)}.bad{color:var(--bad)}.b{font-weight:800}
  .bignum{font-size:48px;font-weight:900;color:var(--brand);text-align:center;font-variant-numeric:tabular-nums}
  .calc{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:20px;text-align:center;box-shadow:0 6px 18px rgba(15,23,42,.06)}
  .calc .eq{font-size:17px;color:#475569;margin-bottom:8px}
  .menu{display:flex;flex-direction:column;gap:9px}
  .menu .mi{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:11px 15px;font-size:16px;color:#334155;animation:slidein .45s both}
  .menu .mi.hl{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
  .caption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(2,6,23,.94),rgba(2,6,23,.78));color:#fff;padding:22px 44px 26px;font-size:20px;line-height:1.55;z-index:15;min-height:140px;display:flex;align-items:center}
  .caption b{color:#93c5fd}
  .speaker{position:absolute;top:16px;right:22px;z-index:16;font-size:13px;color:#64748b;background:rgba(255,255,255,.7);border:1px solid #e2e8f0;border-radius:20px;padding:5px 12px;display:flex;align-items:center;gap:6px}
  .speaker .wave{width:8px;height:8px;border-radius:50%;background:var(--good);animation:blink 1s infinite}
  /* controls */
  .controls{display:flex;gap:10px;align-items:center;background:#111827;padding:10px 14px;border-radius:14px;color:#e5e7eb}
  .controls button{background:#1f2937;color:#e5e7eb;border:0;height:44px;min-width:44px;padding:0 12px;border-radius:10px;font-size:17px;cursor:pointer}
  .controls button:hover{background:#374151}
  .controls .play{background:var(--brand);min-width:56px}
  .controls .t{font-size:13px;color:#9ca3af;min-width:74px;text-align:center}
  .hint{color:#64748b;font-size:13px;text-align:center;max-width:960px;line-height:1.6}
  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  @keyframes slidein{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @media(max-width:680px){.scene{grid-template-columns:1fr;padding:56px 22px 150px;gap:14px}.scene h2{font-size:26px}.caption{font-size:15px;padding:16px 22px}}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="progress" id="prog"></div>
    <div class="brandbar">💵 ระบบเงินเดือน Payroll</div>
    <div class="speaker" id="speaker" style="display:none"><span class="wave"></span>กำลังพากย์เสียง</div>
    <div id="scenes"></div>
    <div class="caption" id="caption"></div>
  </div>

  <div class="controls">
    <button id="prev" title="ก่อนหน้า">⏮</button>
    <button class="play" id="play" title="เล่น/หยุด">⏸</button>
    <button id="next" title="ถัดไป">⏭</button>
    <button id="mute" title="เปิด/ปิดเสียง">🔊</button>
    <span class="t" id="counter">1 / 1</span>
    <button id="restart" title="เริ่มใหม่">↺</button>
  </div>
  <div class="hint">🔊 มีเสียงพากย์ไทยอัตโนมัติ · อัดหน้าจอ (16:9) พร้อม “เสียงระบบ” เพื่อได้วิดีโอมีเสียง · กด Spacebar หยุด/เล่น<br><span id="voiceInfo"></span></div>

<script>
/* ===== เนื้อหาสไลด์ + บทพากย์ไทย ===== */
const SCENES = [
  { step:'บทนำ', title:'โปรแกรมระบบเงินเดือน', sub:'จัดการเงินเดือนพนักงาน ครบจบในที่เดียว',
    visual:`<div class="kpis">
      <div class="mkcard"><div class="l">👥 พนักงาน</div><div class="v">7 คน</div></div>
      <div class="mkcard" style="animation-delay:.1s"><div class="l">💰 เงินสุทธิรวม</div><div class="v">180,000</div></div>
      <div class="mkcard" style="animation-delay:.2s"><div class="l">➕ เงินได้รวม</div><div class="v">185,000</div></div>
      <div class="mkcard" style="animation-delay:.3s"><div class="l">➖ เงินหักรวม</div><div class="v">5,000</div></div></div>`,
    cap:`ยินดีต้อนรับสู่ <b>ระบบเงินเดือน</b> วิดีโอนี้จะสอนใช้งานทุกเมนูอย่างละเอียด ตั้งแต่เพิ่มพนักงาน ไปจนถึงออกสลิปและเอกสารภาษี`,
    say:`ยินดีต้อนรับสู่ระบบเงินเดือน วิดีโอนี้จะสอนการใช้งานทุกเมนูอย่างละเอียด ตั้งแต่การเพิ่มพนักงาน ไปจนถึงการออกสลิปเงินเดือนและเอกสารภาษี` },

  { step:'เมนู', title:'ภาพรวม 9 เมนูหลัก', sub:'แถบเมนูด้านซ้ายของโปรแกรม',
    visual:`<div class="menu">
      <div class="mi hl">📊 แดชบอร์ด</div>
      <div class="mi" style="animation-delay:.05s">👥 ข้อมูลพนักงาน</div>
      <div class="mi" style="animation-delay:.1s">🧮 เงินได้ / เงินหัก</div>
      <div class="mi" style="animation-delay:.15s">📋 สรุปเงินเดือน · 🏢 ตามแผนก</div>
      <div class="mi" style="animation-delay:.2s">🧾 สลิป · 📄 50 ทวิ · 🗂️ ภ.ง.ด.1</div>
      <div class="mi" style="animation-delay:.25s">⚙️ ตั้งค่า</div></div>`,
    cap:`โปรแกรมมี <b>9 เมนูหลัก</b> ทางด้านซ้าย เราจะไล่ดูทีละเมนู เริ่มจากการตั้งค่าบริษัทก่อนใช้งานจริง`,
    say:`โปรแกรมมีเก้าเมนูหลัก อยู่ทางด้านซ้าย เราจะไล่ดูทีละเมนู โดยเริ่มจากการตั้งค่าบริษัทก่อนเริ่มใช้งานจริง` },

  { step:'ขั้นที่ 1', title:'ตั้งค่าบริษัทก่อนเริ่ม', sub:'เมนู ⚙️ ตั้งค่า',
    visual:`<div class="menu">
      <div class="row"><span class="grow">ชื่อบริษัท / เลขผู้เสียภาษี</span>✍️</div>
      <div class="row"><span class="grow">อัตราประกันสังคม 5% · เพดาน 875</span>✅</div>
      <div class="row"><span class="grow">วันตัดรอบเงินเดือน</span>📅</div>
      <div class="row"><span class="grow">วันทำงาน/เดือน (คิด OT)</span>🕒</div></div>`,
    cap:`ไปที่ <b>⚙️ ตั้งค่า</b> กรอกชื่อบริษัท เลขผู้เสียภาษี ตั้งอัตราประกันสังคม และเลือก <b>วันตัดรอบเงินเดือน</b> ข้อมูลนี้จะไปปรากฏบนสลิปและเอกสารภาษีทั้งหมด`,
    say:`ไปที่เมนูตั้งค่า กรอกชื่อบริษัท เลขประจำตัวผู้เสียภาษี ตั้งอัตราประกันสังคม และเลือกวันตัดรอบเงินเดือน ข้อมูลเหล่านี้จะไปปรากฏบนสลิปและเอกสารภาษีทั้งหมด` },

  { step:'ขั้นที่ 2', title:'เพิ่มข้อมูลพนักงาน', sub:'เมนู 👥 ข้อมูลพนักงาน → ปุ่ม “เพิ่มพนักงาน”',
    visual:`<div class="row"><span class="chip">EMP001</span><span>♂</span><b>สมชาย ใจดี</b><span class="grow"></span><span class="pill m">รายเดือน</span></div>
      <div class="row" style="animation-delay:.1s"><span class="chip">EMP002</span><span>♀</span><b>สมหญิง รักงาน</b><span class="grow"></span><span class="pill m">รายเดือน</span></div>
      <div class="row" style="animation-delay:.2s"><span class="chip">EMP007</span><span>♀</span><b>พนักงานรายวัน</b><span class="grow"></span><span class="pill d">รายวัน</span></div>`,
    cap:`กรอก รหัส ชื่อ <b>เพศ</b> ตำแหน่ง แผนก และ <b>ประเภทการจ้าง</b> — เลือกได้ทั้ง <b>รายเดือน</b> และ <b>รายวัน</b> ไอคอน ♂ ♀ จะโชว์หน้าชื่อให้เห็นชัด`,
    say:`กรอกรหัสพนักงาน ชื่อ เพศ ตำแหน่ง แผนก และเลือกประเภทการจ้าง ซึ่งเลือกได้ทั้งแบบรายเดือนและรายวัน โดยไอคอนเพศชายและหญิงจะแสดงหน้าชื่อให้เห็นชัดเจน` },

  { step:'ขั้นที่ 3', title:'พนักงานเข้าใหม่กลางเดือน', sub:'ระบบคิดเงินเดือนตามสัดส่วนให้อัตโนมัติ',
    visual:`<div class="note">📅 เริ่มงาน 02/07/2569<br>งวด 26 มิ.ย. – 25 ก.ค. · ทำงาน 24 วัน จาก 30 วัน</div>
      <div class="calc"><div class="eq">50,000 × 24 / 30 =</div><div class="bignum">40,000</div></div>`,
    cap:`ถ้าพนักงานเข้างานกลางเดือน ระบบจะ <b>คิดเงินเดือนตามสัดส่วน (Prorate)</b> ตามวันตัดรอบให้อัตโนมัติ ไม่ต้องคำนวณเอง`,
    say:`ถ้าพนักงานเข้างานกลางเดือน ระบบจะคิดเงินเดือนตามสัดส่วน หรือ พรอเรท ตามวันตัดรอบให้โดยอัตโนมัติ คุณไม่ต้องคำนวณเอง` },

  { step:'ขั้นที่ 4', title:'กรอกเงินได้ – เงินหัก', sub:'เมนู 🧮 เลือกพนักงาน แล้วกรอกรายเดือน',
    visual:`<div class="row"><span class="grow">OT · คอมมิชชั่น · เบี้ยขยัน · โบนัส</span><span class="good b">เงินได้</span></div>
      <div class="row" style="animation-delay:.1s"><span class="grow">ภาษี · ประกันสังคม · กสล. · กยศ.</span><span class="bad b">เงินหัก</span></div>
      <div class="tag" style="margin-top:4px">💡 พนักงานรายวันกรอก “จำนวนวันทำงาน”</div>`,
    cap:`เลือกพนักงาน แล้วกรอก <b>เงินได้</b> เช่น OT โบนัส และ <b>เงินหัก</b> เช่น ประกันสังคม กสล. พนักงานรายวันแค่ใส่จำนวนวัน ระบบคูณค่าจ้างให้เอง`,
    say:`เลือกพนักงาน แล้วกรอกเงินได้ เช่น โอที และโบนัส และกรอกเงินหัก เช่น ประกันสังคม และกองทุนสำรองเลี้ยงชีพ สำหรับพนักงานรายวัน เพียงใส่จำนวนวันทำงาน ระบบจะคูณค่าจ้างให้เอง` },

  { step:'ขั้นที่ 5', title:'คำนวณ OT รายชั่วโมง', sub:'ใส่ชั่วโมง × ตัวคูณ ระบบคิดให้',
    visual:`<div class="calc"><div class="eq">อัตรา/ชม. (เงินเดือน÷30÷8) × ชั่วโมง × ตัวคูณ</div>
      <div class="bignum">187.50 <span style="font-size:18px;color:#64748b">/ชม.</span></div></div>
      <div class="tag">ตัวคูณ: 1× · 1.5× · 2× · 2.5× · 3×</div>`,
    cap:`ช่อง OT คำนวณ <b>รายชั่วโมง</b> ให้ — แค่ใส่จำนวนชั่วโมงและเลือกตัวคูณ เช่น 1.5 เท่าสำหรับล่วงเวลาวันทำงานปกติ ระบบคูณกับอัตราต่อชั่วโมงให้ทันที`,
    say:`ช่องโอที คำนวณเป็นรายชั่วโมงให้ เพียงใส่จำนวนชั่วโมง และเลือกตัวคูณ เช่น หนึ่งจุดห้าเท่า สำหรับล่วงเวลาในวันทำงานปกติ ระบบจะคูณกับอัตราต่อชั่วโมงให้ทันที` },

  { step:'ขั้นที่ 6', title:'ปุ่มคำนวณอัตโนมัติ ⚡', sub:'ประกันสังคม · กสล. · ภาษี',
    visual:`<div class="row"><span class="grow">⚡ ประกันสังคม 5%</span><b>875</b></div>
      <div class="row" style="animation-delay:.1s"><span class="grow">⚡ กองทุนสำรองเลี้ยงชีพ</span><b>1,500</b></div>
      <div class="row" style="animation-delay:.2s"><span class="grow">⚡ ภาษีหัก ณ ที่จ่าย</span><b>1,379</b></div>`,
    cap:`มีปุ่ม <b>⚡ คำนวณอัตโนมัติ</b> ทั้ง ประกันสังคม กสล. และ <b>ภาษี</b> — ระบบคิดภาษีแบบขั้นบันได อิงเงินได้ทั้งปีและวันเริ่มงาน ปัดเศษเป็นจำนวนเต็มให้เรียบร้อย`,
    say:`มีปุ่มคำนวณอัตโนมัติ ทั้งประกันสังคม กองทุนสำรองเลี้ยงชีพ และภาษี ระบบคิดภาษีแบบขั้นบันได โดยอิงเงินได้ทั้งปีและวันเริ่มงาน พร้อมปัดเศษเป็นจำนวนเต็มบาทให้เรียบร้อย` },

  { step:'ขั้นที่ 7', title:'แดชบอร์ด และกราฟ', sub:'ดูภาพรวม รายเดือน / รายปี',
    visual:`<div class="kpis"><div class="mkcard"><div class="l">👥 พนักงาน</div><div class="v">7 คน</div><div style="font-size:12px;margin-top:5px"><span style="color:#2563eb">♂ ชาย 4</span> &nbsp;<span style="color:#db2777">♀ หญิง 3</span></div></div>
      <div class="mkcard" style="animation-delay:.1s"><div class="l">💰 สุทธิรวม</div><div class="v">180,000</div></div></div>
      <div class="tag" style="justify-content:center">📊 คลิกที่แท่งกราฟเพื่อดูรายเดือนนั้น</div>`,
    cap:`<b>แดชบอร์ด</b> สรุปจำนวนพนักงาน แยกชาย-หญิง และยอดเงินรวม สลับดู <b>รายเดือน/รายปี</b> ได้ และคลิกแท่งกราฟเพื่อเจาะดูแต่ละเดือน`,
    say:`หน้าแดชบอร์ด สรุปจำนวนพนักงาน แยกชายหญิง และยอดเงินรวมทั้งหมด สลับดูได้ทั้งแบบรายเดือนและรายปี และคลิกที่แท่งกราฟเพื่อเจาะดูข้อมูลของแต่ละเดือนได้` },

  { step:'ขั้นที่ 8', title:'สรุปเงินเดือน และแผนก', sub:'เมนู 📋 และ 🏢',

/* ===== เอนจินเล่นสไลด์ + เสียงพากย์ไทย ===== */
const scenesEl=document.getElementById('scenes'), capEl=document.getElementById('caption'),
      progEl=document.getElementById('prog'), counterEl=document.getElementById('counter'),
      speakerEl=document.getElementById('speaker');
let idx=0, playing=true, muted=false, rafId=null, advTimer=null, sceneStart=0, thVoice=null;
const FALLBACK_DUR=7200, TAIL=700; // ใช้เมื่อไม่มีเสียง (มิลลิวินาที)

scenesEl.innerHTML = SCENES.map((s,i)=>`
  <div class="scene" data-i="${i}">
    <div class="left"><span class="step">${s.step}</span><h2>${s.title}</h2><div class="sub">${s.sub}</div></div>
    <div class="visual">${s.visual}</div>
  </div>`).join('');

/* --- เลือกเสียงภาษาไทย --- */
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  thVoice = vs.find(v=>/th(-|_)?TH/i.test(v.lang)) || vs.find(v=>/^th/i.test(v.lang)) || null;
  const info=document.getElementById('voiceInfo');
  info.textContent = thVoice ? `เสียงพากย์: ${thVoice.name}` : 'หมายเหตุ: เบราว์เซอร์นี้ยังไม่มีเสียงภาษาไทย ระบบจะเลื่อนสไลด์ตามเวลาแทน (ลองใช้ Chrome/Edge บน Windows)';
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
else { document.getElementById('voiceInfo').textContent='เบราว์เซอร์นี้ไม่รองรับเสียงพากย์'; }

function stripTags(h){ return h.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim(); }
// ประเมินเวลาต่อสไลด์จากความยาวบทพากย์ (ไทย ~10 ตัวอักษร/วินาที) + เผื่อหัวท้าย
function sceneDur(i){ const t=SCENES[i].say||stripTags(SCENES[i].cap); return Math.min(15000, Math.max(5500, t.length/10*1000 + 1800)); }

function speakCurrent(){
  if(!('speechSynthesis' in window) || muted) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(SCENES[idx].say || stripTags(SCENES[idx].cap));
  u.lang='th-TH'; u.rate=1; u.pitch=1;
  if(thVoice) u.voice=thVoice;
  speakerEl.style.display='flex';
  u.onend=()=>{ speakerEl.style.display='none'; };
  u.onerror=()=>{ speakerEl.style.display='none'; };
  speechSynthesis.speak(u);
}

function show(i){
  idx=(i+SCENES.length)%SCENES.length;
  document.querySelectorAll('.scene').forEach(el=>el.classList.toggle('on',+el.dataset.i===idx));
  capEl.innerHTML=SCENES[idx].cap;
  counterEl.textContent=`${idx+1} / ${SCENES.length}`;
  progEl.style.width='0%';
  clearTimeout(advTimer); cancelAnimationFrame(rafId);
  if('speechSynthesis' in window) speechSynthesis.cancel();
  speakerEl.style.display='none';
  if(!playing) return;
  const dur=sceneDur(idx);
  // แถบความคืบหน้า
  sceneStart=performance.now();
  const loop=(now)=>{ const p=Math.min(1,(now-sceneStart)/dur); progEl.style.width=(p*100)+'%'; if(p<1) rafId=requestAnimationFrame(loop); };
  rafId=requestAnimationFrame(loop);
  // เสียงพากย์ (คู่ขนาน) + เลื่อนสไลด์ตามเวลา
  speakCurrent();
  advTimer=setTimeout(()=>{ if(playing) next(); }, dur);
}
function next(){ show(idx+1); }
function prev(){ show(idx-1); }
function play(){ playing=true; document.getElementById('play').textContent='⏸'; show(idx); }
function pause(){ playing=false; document.getElementById('play').textContent='▶'; clearTimeout(advTimer); cancelAnimationFrame(rafId); if('speechSynthesis' in window) speechSynthesis.cancel(); speakerEl.style.display='none'; }

document.getElementById('play').onclick=()=>playing?pause():play();
document.getElementById('next').onclick=()=>{ const w=playing; if('speechSynthesis'in window)speechSynthesis.cancel(); playing=w; show(idx+1); };
document.getElementById('prev').onclick=()=>{ const w=playing; if('speechSynthesis'in window)speechSynthesis.cancel(); playing=w; show(idx-1); };
document.getElementById('restart').onclick=()=>{ playing=true; document.getElementById('play').textContent='⏸'; show(0); };
document.getElementById('mute').onclick=()=>{ muted=!muted; document.getElementById('mute').textContent=muted?'🔇':'🔊'; if(muted && 'speechSynthesis'in window)speechSynthesis.cancel(); if(playing) show(idx); };
document.addEventListener('keydown',e=>{ if(e.key===' '){e.preventDefault();playing?pause():play();} if(e.key==='ArrowRight')document.getElementById('next').click(); if(e.key==='ArrowLeft')document.getElementById('prev').click(); });

// เบราว์เซอร์ส่วนใหญ่ต้องมี interaction ก่อนเล่นเสียง — เริ่มเงียบแล้วรอคลิก
window.addEventListener('load',()=>{ show(0); });
document.getElementById('stage').addEventListener('click',()=>{ if('speechSynthesis'in window && !speechSynthesis.speaking && playing && !muted){ speakCurrent(); } }, {once:true});
</script>
