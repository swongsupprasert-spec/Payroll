<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eSimPayroll — โปรเด็ด</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="fonts/noto-sans-thai.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#050a18;font-family:'Noto Sans Thai',system-ui,sans-serif;color:#fff;overflow:clip}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#st{position:relative;width:min(100vw,56.25vh);aspect-ratio:9/16;overflow:clip;font-size:calc(min(100vw,56.25vh)/100);background:#091025}
.A{position:absolute}
/* ฉากหลังนีออน synthwave */
.sky{position:absolute;inset:0;background:radial-gradient(80em 50em at 50% 64%,#1d3fa0 0%,#12256a 30%,#091025 70%)}
.blob{animation:none!important;position:absolute;border-radius:50%;filter:blur(7em);opacity:.55;animation:blob 9s ease-in-out infinite alternate}
@keyframes blob{to{transform:translate(12em,-10em) scale(1.25)}}
.horizon{position:absolute;left:-10em;right:-10em;top:112em;height:.6em;background:#5ef0dc;box-shadow:0 0 3em 1em #5ef0dc88,0 0 10em 3em #2f5bea66}
.gridw{position:absolute;left:-60em;right:-60em;top:112em;height:120em;perspective:30em;perspective-origin:50% 0;overflow:hidden}
.grid{animation:none!important;position:absolute;inset:0;transform-origin:50% 0;transform:rotateX(68deg);
  background:linear-gradient(90deg,#5ef0dc66 .25em,transparent .25em) 0 0/10em 10em,linear-gradient(#5ef0dc66 .25em,transparent .25em) 0 0/10em 10em;
  animation:gridmv .6s linear infinite}
@keyframes gridmv{to{background-position:0 10em,0 10em}}
.gridw::after{content:"";position:absolute;inset:0;background:linear-gradient(#091025 0%,transparent 30%)}
.beam{animation:none!important;position:absolute;top:-20em;width:14em;height:160em;background:linear-gradient(#5ef0dc00,#5ef0dc22,#5ef0dc00);transform-origin:50% 0;animation:beam 5s ease-in-out infinite alternate}
@keyframes beam{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.top{position:absolute;left:0;right:0;top:8em;text-align:center;z-index:30}
.top span{display:inline-flex;align-items:center;gap:.5em;font-size:2.8em;font-weight:900;color:#fff;background:#091025cc;border:.12em solid #5ef0dc;border-radius:2em;padding:.25em 1em;box-shadow:0 0 1em #5ef0dc88,inset 0 0 .8em #5ef0dc44}
.top i{font-style:normal;color:#ffd84d}
/* ฉาก: วาร์ปซูม */
.sc{position:absolute;inset:0;visibility:hidden}
.sc.on{visibility:visible;animation:warp .45s cubic-bezier(.15,.9,.3,1) both}
@keyframes warp{from{transform:scale(.25);filter:blur(1.5em) brightness(3);opacity:0}to{transform:none;filter:none;opacity:1}}
.streak{position:absolute;left:-30%;top:-20%;width:30%;height:140%;background:linear-gradient(90deg,transparent,#ffffffcc,transparent);transform:rotate(18deg);opacity:0;z-index:40;pointer-events:none}
.on .streak{animation:streak .5s .05s ease-out both}
@keyframes streak{0%{opacity:1;left:-30%}100%{opacity:0;left:110%}}
.a{opacity:0}
.on .a{animation-fill-mode:both;animation-delay:var(--d,0s);animation-duration:var(--t,.45s)}
.on .pop{animation-name:pop;animation-timing-function:cubic-bezier(.2,1.7,.4,1)}
.on .up{animation-name:up;animation-timing-function:cubic-bezier(.2,1.3,.3,1)}
.on .zin{animation-name:zin;animation-timing-function:cubic-bezier(.1,1.2,.3,1);--t:.4s}
.on .sl{animation-name:sl;animation-timing-function:cubic-bezier(.2,1.3,.3,1)}
.on .sr{animation-name:sr;animation-timing-function:cubic-bezier(.2,1.3,.3,1)}
.on .spinin{animation-name:spinin;animation-timing-function:cubic-bezier(.2,1.4,.4,1);--t:.6s}
@keyframes pop{0%{opacity:0;transform:scale(.1) rotate(-12deg)}60%{opacity:1;transform:scale(1.12) rotate(3deg)}100%{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes up{from{opacity:0;transform:translateY(6em)}to{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes zin{from{opacity:0;transform:scale(4);filter:blur(1em)}to{opacity:1;transform:rotate(var(--r,0deg));filter:none}}
@keyframes sl{from{opacity:0;transform:translateX(-70em) rotate(-20deg)}to{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes sr{from{opacity:0;transform:translateX(70em) rotate(20deg)}to{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes spinin{0%{opacity:0;transform:scale(0) rotate(-540deg)}100%{opacity:1;transform:rotate(var(--r,0deg))}}
.on .out{animation:outz .3s var(--o) ease-in forwards!important}
@keyframes outz{to{opacity:0;transform:scale(.4)}}
.H{position:absolute;left:4em;right:4em;text-align:center;z-index:6}
.neo{font-weight:900;line-height:1.1;color:#fff;text-shadow:0 0 .15em #5ef0dc,0 0 .5em #5ef0dc,0 0 1.2em #2f5bea}
.neo.y{text-shadow:0 0 .15em #ffd84d,0 0 .5em #ffb020,0 0 1.2em #ff7a00}
.neo.r{text-shadow:0 0 .15em #ff6b6b,0 0 .5em #e5484d,0 0 1.2em #e5484d}
.gl{display:inline-block}
.on .gl{animation:gl .9s calc(var(--d,0s) + .4s) steps(1) infinite}
@keyframes gl{0%{transform:none;filter:none}8%{transform:translate(-.6em,.2em) skewX(-8deg);filter:drop-shadow(.3em 0 0 #ff2a6d) drop-shadow(-.3em 0 0 #05d9e8)}12%{transform:translate(.5em,-.2em);filter:drop-shadow(-.3em 0 0 #ff2a6d) drop-shadow(.3em 0 0 #05d9e8)}16%{transform:none;filter:none}60%{transform:translate(.3em,0) skewX(6deg);filter:drop-shadow(.25em 0 0 #ff2a6d)}64%{transform:none;filter:none}}
.wig{display:inline-block}
.on .wig{animation:wig .45s calc(var(--d,0s) + .5s) ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.06)}}
.pulse{display:inline-block}
.on .pulse{animation:pls .7s calc(var(--d,0s) + .5s) ease-in-out infinite alternate}
@keyframes pls{to{transform:scale(1.07)}}
.on .shk{animation:shk .45s var(--sd) linear both}
@keyframes shk{0%,100%{transform:none}15%{transform:translate(-2em,1em)}35%{transform:translate(2em,-1em)}55%{transform:translate(-1.4em,.6em)}75%{transform:translate(1em,-.5em)}}
/* การ์ดกระจกนีออน */
.gc{background:linear-gradient(160deg,#16255acc,#0b1433ee);border:.4em solid #5ef0dc;border-radius:2.6em;box-shadow:0 0 2em #5ef0dc66,inset 0 0 2em #5ef0dc22;text-align:center;color:#fff}
.gc.y{border-color:#ffd84d;box-shadow:0 0 2em #ffd84d66,inset 0 0 2em #ffd84d22}
.gc.r{border-color:#ff6b6b;box-shadow:0 0 2em #ff6b6b66,inset 0 0 2em #ff6b6b22}
.chip{display:inline-flex;align-items:center;gap:.4em;background:#0b1433;border:.15em solid #5ef0dc;border-radius:2em;padding:.25em .8em;font-weight:900;box-shadow:0 0 .8em #5ef0dc66}
.chip b{color:#5ae39a}
/* Excel ปวดหัว */
.xl{width:62em;background:#e9f2ea;border:.5em solid #1d6f42;border-radius:1.4em;overflow:hidden;color:#0b1230;box-shadow:0 1.5em 3em #0009}
.xl .bar{background:#1d6f42;color:#fff;font-size:2.6em;font-weight:900;padding:.3em .8em;text-align:left}
.xl .cells{display:grid;grid-template-columns:repeat(5,1fr);gap:.3em;padding:1em}
.xl .cells i{height:3.6em;background:#fff;border:.15em solid #b8cdbd;font-style:normal;font-size:1.9em;font-weight:800;display:grid;place-items:center}
.on .xl .cells i.e{animation:err .4s calc(var(--d,0s) + var(--k,0s)) steps(1) infinite alternate}
@keyframes err{to{background:#ffb3b3;color:#c00}}
/* จอมือถือ */
.phone{position:absolute;width:44em;height:80em;border-radius:6em;background:#050a18;border:.8em solid #2b3a6e;box-shadow:0 0 0 .4em #5ef0dc55,0 0 4em #5ef0dc55,0 3em 5em #000a;padding:2.2em 2em;overflow:hidden}
.phone::before{content:"";position:absolute;left:50%;top:1.2em;width:12em;height:2em;margin-left:-6em;border-radius:2em;background:#000}
.scr{position:absolute;inset:4em 2em 2em;border-radius:3.6em;background:linear-gradient(#0f1d4a,#0a1435);overflow:hidden;padding:2.6em 2.4em}
.scr h4{font-size:2.6em;font-weight:900;color:#5ef0dc;margin-bottom:.4em}
.row{display:flex;justify-content:space-between;align-items:center;background:#ffffff10;border-radius:1.4em;padding:1em 1.4em;margin-top:1em}
.row span{font-size:2.5em;font-weight:800}
.row b{font-size:2.6em;font-weight:900;color:#5ae39a}
.tick{display:inline-grid;place-items:center;width:1.4em;height:1.4em;border-radius:50%;background:#5ae39a;color:#0b1230;font-size:.9em;margin-left:.3em}
/* สลิป */
.slip{width:38em;background:#fff;color:#0b1230;border-radius:1.6em;padding:2em 2.2em;box-shadow:0 0 3em #5ef0dc88,0 2em 3em #000a}
.slip h5{font-size:3em;font-weight:900;text-align:center;border-bottom:.15em dashed #b9c6dd;padding-bottom:.3em}
.slip p{display:flex;justify-content:space-between;font-size:2.4em;font-weight:800;margin-top:.5em}
.slip p.t{font-size:3em;color:#0e9f6e;border-top:.12em solid #0b1230;padding-top:.3em}
.on .print{animation:print .7s var(--d) cubic-bezier(.2,1.2,.3,1) both}
@keyframes print{from{opacity:0;clip-path:inset(0 0 100% 0);transform:translateY(-8em)}to{opacity:1;clip-path:inset(0 0 0 0);transform:rotate(var(--r,0deg))}}
/* เอกสารราชการ */
.doc{width:26em;height:34em;background:#fff;color:#0b1230;border-radius:1.4em;padding:2em 1.8em;box-shadow:0 0 2.4em #5ef0dc88,0 2em 3em #000a;border-top:2.2em solid #2f5bea}
.doc b{display:block;font-size:4.4em;font-weight:900;text-align:center;line-height:1.1}
.doc small{display:block;font-size:2.1em;font-weight:800;text-align:center;color:#5b7186;margin-bottom:.6em}
.doc i{display:block;height:1.1em;background:#dbe5f4;border-radius:1em;margin-top:1.2em}
.cursor{position:absolute;font-size:9em;z-index:9;opacity:0;filter:drop-shadow(0 0 .2em #000)}
.on .cursor{animation:cur .8s var(--d) cubic-bezier(.3,1.2,.4,1) both}
@keyframes cur{0%{opacity:0;transform:translate(30em,30em)}70%{opacity:1;transform:none}85%{transform:scale(.8)}100%{opacity:1;transform:none}}
.ripple{position:absolute;width:20em;height:20em;margin:-10em;border-radius:50%;border:.8em solid #5ef0dc;opacity:0;z-index:8}
.on .ripple{animation:rip .7s var(--d) ease-out both}
@keyframes rip{0%{opacity:1;transform:scale(.1)}100%{opacity:0;transform:scale(2.4)}}
/* สแกนใบหน้า */
.face{position:relative;width:28em;height:28em;margin:2em auto 0;border-radius:50%;border:.5em dashed #5ef0dc;display:grid;place-items:center;font-size:1em;overflow:hidden}
.face span{font-size:17em;line-height:1}
.scanl{position:absolute;left:0;right:0;height:.6em;background:#5ef0dc;box-shadow:0 0 2em 1em #5ef0dc88;top:0}
.on .scanl{animation:scan 1.1s var(--d) ease-in-out 3 alternate both}
@keyframes scan{from{top:0}to{top:100%}}
.map{position:relative;height:16em;border-radius:1.6em;margin-top:1.6em;background:linear-gradient(90deg,#ffffff10 .2em,transparent .2em) 0 0/4em 4em,linear-gradient(#ffffff10 .2em,transparent .2em) 0 0/4em 4em,#12306a;overflow:hidden}
.map .road{position:absolute;left:-2em;right:-2em;top:7em;height:2em;background:#2b4f9a;transform:rotate(-12deg)}
.pin{position:absolute;left:50%;top:2em;margin-left:-2.6em;font-size:5.2em;opacity:0}
.on .pin{animation:pin .5s var(--d) cubic-bezier(.3,1.8,.4,1) both}
@keyframes pin{from{opacity:0;transform:translateY(-12em)}to{opacity:1;transform:none}}
.ok{margin-top:1.6em;background:#5ae39a;color:#0b1230;border-radius:1.6em;padding:.8em;text-align:center;font-size:2.8em;font-weight:900}
/* นับถอยหลัง */
.cd{position:absolute;left:0;right:0;top:50em;text-align:center;opacity:0}
.cd span{font-size:30em;font-weight:900}
.on .cd{animation:cd .5s var(--d) ease-out both}
@keyframes cd{0%{opacity:0;transform:scale(3)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.6)}}
/* คอนเฟตติ */
.cf{position:absolute;width:1.6em;height:2.6em;border-radius:.3em;opacity:0;z-index:7}
.on .cf{animation:cf 1.8s var(--d) cubic-bezier(.1,.8,.4,1) both}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}55%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(var(--rt))}100%{opacity:0;transform:translate(calc(var(--dx)*1.15),calc(var(--dy) + 36em)) rotate(calc(var(--rt)*2))}}
/* น้อง eSim */
.es{position:absolute;background:no-repeat center/contain;z-index:7;filter:drop-shadow(0 0 1.2em #5ef0dcaa)}
.on .es.a{animation:esin .5s var(--d) cubic-bezier(.2,1.6,.4,1) both}
@keyframes esin{0%{opacity:0;transform:scale(.2) rotate(-20deg)}100%{opacity:1;transform:none}}
.esw{position:absolute;z-index:7}
body.tes .esw.ta{animation:estalk .16s ease-in-out infinite alternate}
@keyframes estalk{from{transform:scale(1,1)}to{transform:scale(1.04,.96) translateY(.6em)}}
.ring{position:absolute;border-radius:50%;border:.6em solid transparent;border-top-color:#5ef0dc;border-right-color:#2f5bea;animation:rot 1.6s linear infinite;box-shadow:0 0 2em #5ef0dc55}
.ring.b{border-top-color:#ffd84d;border-right-color:transparent;border-left-color:#ffd84d;animation-duration:2.4s;animation-direction:reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.logo{display:flex;align-items:center;justify-content:center;gap:1.6em}
.logo .ic{width:10em;height:10em;border-radius:28%;display:grid;place-items:center;background:linear-gradient(150deg,#33c7a0,#1559c8);box-shadow:0 0 2.4em #5ef0dc99}
.logo .ic b{font-size:7.6em;font-weight:900;color:#fff;line-height:1;margin-top:-.12em}
.logo .tx{font-size:7em;font-weight:900;letter-spacing:-.03em;text-shadow:0 0 .4em #2f5beaaa}.logo .tx i{font-style:normal;color:#5ae39a}
.btnx{display:inline-block;font-size:5.6em;font-weight:900;color:#0b1230;border-radius:1em;padding:.4em 1.2em;background:linear-gradient(120deg,#5ae39a,#5ef0dc);box-shadow:0 0 1em #5ef0dc,0 .15em 0 #0b1230}
.btnr{display:inline-block;font-size:4.6em;font-weight:900;color:#fff;border-radius:1em;padding:.4em 1.2em;background:#e5484d;box-shadow:0 0 1em #e5484d99}
/* ซับ */
.sub{position:absolute;left:7em;right:13em;bottom:40em;text-align:center;z-index:25;opacity:0;animation:sIn .22s var(--d) ease-out forwards,sOut .18s var(--e) ease-in forwards}
@keyframes sIn{from{opacity:0;transform:translateY(1.2em) scale(.9)}to{opacity:1;transform:none}}
@keyframes sOut{to{opacity:0}}
.sub span{display:inline-block;font-size:3.5em;font-weight:900;color:#fff;background:#050a18d9;border:.1em solid #5ef0dc;border-radius:.5em;padding:.3em .8em;line-height:1.4;box-shadow:0 0 .6em #5ef0dc77}
#bar{position:absolute;left:0;bottom:0;height:.7em;background:linear-gradient(90deg,#ffd84d,#5ef0dc);width:0;z-index:50;box-shadow:0 0 1em #5ef0dc}
</style>
</head>
<body>
<div id="wrap"><div id="st">
<div class="sky"></div>
<div class="blob" style="left:-10em;top:20em;width:50em;height:50em;background:#2f5bea"></div>
<div class="blob" style="right:-14em;top:60em;width:46em;height:46em;background:#12a3a0;animation-delay:-4s"></div>
<div class="beam" style="left:10em"></div><div class="beam" style="right:10em;animation-delay:-2.5s"></div>
<div class="gridw"><div class="grid"></div></div><div class="horizon"></div>

<div class="A" style="inset:0">
 <div class="H" style="top:9em"><span class="btnr" style="font-size:3.6em;display:inline-block;transform:rotate(-3deg)">🎉 โปรเด็ด!</span></div>
 <div class="logo" style="position:absolute;left:0;right:0;top:20em"><div class="ic"><b>e</b></div><div class="tx">eSim<i>Payroll</i></div></div>
 <div class="H" style="top:33em"><span class="neo" style="font-size:6.4em">โปรแกรมเงินเดือน</span></div>
 <div class="H" style="top:39em"><span class="neo y" style="font-size:30em;display:inline-block;transform:rotate(-4deg)">ฟรี</span></div>
 <div class="H" style="top:74em"><span class="chip" style="font-size:5.6em">♾️ <b>ตลอดไป!</b></span></div>
 <div class="H" style="top:89em"><div class="gc y" style="display:inline-block;padding:1em 2.6em"><span style="font-size:4.6em;font-weight:900">👥 พนักงาน 1–10 คน</span></div></div>
 <div class="A" style="left:4em;top:107em"><span class="chip" style="font-size:3.4em">⚡ คำนวณอัตโนมัติ</span></div>
 <div class="A" style="left:4em;top:115em"><span class="chip" style="font-size:3.4em">🧾 50 ทวิ · ภ.ง.ด.1</span></div>
 <div class="A" style="left:4em;top:123em"><span class="chip" style="font-size:3.4em;border-color:#ffd84d">📱 สแกนหน้า + GPS</span></div>
 <div class="ring" style="left:57em;top:104em;width:38em;height:38em;animation:none"></div>
 <div class="es" style="left:58em;top:105em;width:36em;height:36em;background-image:url(media/esim/e6c.png)"></div>
 <div class="H" style="top:146em"><span class="btnx" style="font-size:5em">esimpayroll.com</span></div>
 <div class="H" style="top:159em"><span style="font-size:3.2em;font-weight:900;color:#c9d6f2">สมัครแล้วใช้ได้ทันที · ไม่ต้องใช้บัตรเครดิต</span></div>
</div>

<div id="bar"></div>
</div></div>

</body>
</html>
